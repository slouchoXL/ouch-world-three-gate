  <script>
    (async function () {
      try {
        if (window.supa && location.hash && location.hash.includes('access_token')) {
          const params = new URLSearchParams(location.hash.slice(1));
          const access_token = params.get('access_token');
          const refresh_token = params.get('refresh_token');
          const error = params.get('error');
          const error_description = params.get('error_description');
          if (error) {
            alert(`Authentication error: ${error_description || error}`);
            history.replaceState({}, '', location.pathname + location.search);
            return;
          }
          if (access_token && refresh_token) {
            const { error } = await window.supa.auth.setSession({ access_token, refresh_token });
            if (error) alert(`Session error: ${error.message}`); else window.location.reload();
          }
          history.replaceState({}, '', location.pathname + location.search);
        }
      } catch (e) { console.error('[supabase] Magic link processing failed:', e); }
    })();
  </script>

<script>
  // ===== Globals =====
  let scene, camera, renderer;
  let raycaster, mouseNDC, hoverActive = false, lastHoverState = false, hoverLight = null;
  let gltfLoader, dracoLoader;
  let currentModel = null, currentMixer = null, loadVersion = 0;
  const clock = new THREE.Clock();

  // [CAROUSEL] state
  const carousel = {
    mode: 'view',
    cache: [],
    mixers: [],
    preloadComplete: false
  };

  // expose for other code
  window.scene = null; window.camera = null; window.renderer = null; window.character = null;
  window.currentCharacterIndex = 0;

  function initLoaders() {
    gltfLoader = new THREE.GLTFLoader();
    dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    gltfLoader.setDRACOLoader(dracoLoader);
  }

  window.characterConfigs = [
    { name: "Sloucho", status: "Unlocked", url: "/assets/models/sloucho.glb", targetHeight: 1.4, y: 0.08, scaleMul: 0.6, trimStart: 1.5, trimEnd: 2.0 },
    { name: "Rás",     status: "Unlocked", url: "/assets/models/ras.glb",     targetHeight: 1.4, y: 0.05, scaleMul: 0.6, trimStart: 0.12, trimEnd: 0.10 },
    { name: "Super Maramu 2000", status: "Unlocked", url: "/assets/models/super-maramu.glb", targetHeight: 1.4, y: -0.15, scaleMul: 0.5, trimStart: 0.12, trimEnd: 0.10 }
  ];

  // ===== PRELOADING SYSTEM =====
  function showLoading() {
    const indicator = document.getElementById('loadingIndicator');
    if (indicator) {
      indicator.style.display = 'block';
      indicator.style.opacity = '1';
    }
  }

  function hideLoading() {
    const indicator = document.getElementById('loadingIndicator');
    if (indicator) {
      indicator.style.opacity = '0';
      setTimeout(() => { indicator.style.display = 'none'; }, 300);
    }
  }

  // NOTE: updateLoadingProgress() isn't included in your snippet, leaving as-is.

  function preloadAllCharacters() {
    if (carousel.preloadComplete) {
      console.log('✅ Characters already preloaded');
      return Promise.resolve();
    }

    const configs = window.characterConfigs || [];
    if (configs.length === 0) return Promise.resolve();

    console.log('🚀 Starting character preload...');
    showLoading();
    updateLoadingProgress(0, configs.length);

    const loadPromises = configs.map((config, index) => {
      return loadCharacterToCache(index).then(() => {
        updateLoadingProgress(index + 1, configs.length);
        console.log(`✅ Preloaded: ${config.name} (index: ${index})`);
      }).catch(err => {
        console.error(`❌ Failed to preload ${config.name}:`, err);
        updateLoadingProgress(index + 1, configs.length);
      });
    });

    return Promise.all(loadPromises).then(() => {
      carousel.preloadComplete = true;
      hideLoading();
      console.log('🎉 All characters preloaded! Cache state:', carousel.cache.length);
      carousel.cache.forEach((entry, i) => {
        if (entry) {
          const hasAnims = entry.gltfData && entry.gltfData.animations && entry.gltfData.animations.length > 0;
          console.log(`Cache[${i}]: ${entry.config.name}, has animations: ${hasAnims}`);
        }
      });
    }).catch(err => {
      console.error('Preloading failed:', err);
      hideLoading();
    });
  }

  function loadCharacterToCache(index) {
    const config = window.characterConfigs[index];
    if (!config || carousel.cache[index]) return Promise.resolve();

    return new Promise((resolve, reject) => {
      gltfLoader.load(
        config.url,
        (gltf) => {
          carousel.cache[index] = { gltfData: gltf, config: config, targetHeight: config.targetHeight ?? 1.4 };
          console.log(`Cached GLTF data for ${config.name}`);
          resolve();
        },
        undefined,
        (error) => {
          console.error(`Failed to load ${config.url}:`, error);
          reject(error);
        }
      );
    });
  }

  function getCharacterFromCache(index) {
    return carousel.cache[index] || null;
  }

  window.createCharacter = function() {
    if (!window.scene) { console.error('Scene not ready'); return; }

    if (currentMixer) {
      try { currentMixer.stopAllAction(); currentMixer.uncacheRoot(currentModel); } catch(e) {}
      currentMixer = null;
    }

    if (currentModel) {
      scene.remove(currentModel);
      if (!isFromCache(currentModel)) disposeObject(currentModel);
      currentModel = null;
    }

    if (window.character && window.character !== currentModel) {
      try { scene.remove(window.character); } catch {}
      window.character = null;
    }

    const index = window.currentCharacterIndex ?? 0;
    const cached = getCharacterFromCache(index);
    if (cached) {
      console.log(`📦 Loading ${cached.config.name} from cache...`);
      loadFromCache(index, cached);
      return;
    }

    console.log(`⏳ Loading ${window.characterConfigs[index]?.name} directly...`);
    loadCharacterDirectly();
  };

  function isFromCache(model) {
    return model && model.userData && model.userData.fromCache === true;
  }

  function loadFromCache(index, cached) {
    const { gltfData, config, targetHeight } = cached;

    const root = gltfData.scene || gltfData.scenes?.[0];
    if (!root) { console.error('No scene in cached GLTF data'); return; }

    if (root.parent) root.parent.remove(root);

    if (!root.userData.processed) {
      centerAndScaleToHeight(root, targetHeight);
      if (config.scaleMul) root.scale.multiplyScalar(config.scaleMul);

      root.userData = root.userData || {};
      if (config.y != null && !root.userData.yApplied) {
        root.position.y += config.y;
        root.userData.yApplied = true;
      }
      root.userData.baseY = root.position.y;

      root.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
          obj.raycast = THREE.Mesh.prototype.raycast;
          obj.frustumCulled = false;

          const storeMaterial = (material) => {
            if (!material) return;
            material.userData = material.userData || {};
            if ('emissive' in material && !material.userData._origEmissive) {
              material.userData._origEmissive = material.emissive.clone();
            }
          };

          if (Array.isArray(obj.material)) obj.material.forEach(storeMaterial);
          else storeMaterial(obj.material);
        }
      });

      root.updateMatrixWorld(true);
      root.userData.processed = true;
    }

    root.userData.fromCache = true;
    root.visible = true;

    let freshMixer = null;
    if (gltfData.animations && gltfData.animations.length) {
      freshMixer = new THREE.AnimationMixer(root);
      const clips = gltfData.animations;
      const baseClip = THREE.AnimationClip.findByName(clips, 'Idle') ||
                       THREE.AnimationClip.findByName(clips, 'idle') ||
                       clips[0];

      if (baseClip) {
        const trimStart = Math.max(0, config.trimStart ?? 1.5);
        const trimEnd = Math.max(0, config.trimEnd ?? 2.0);
        const minDur = 0.05;
        const startSec = Math.min(trimStart, Math.max(0, baseClip.duration - minDur));
        const endSec = Math.max(baseClip.duration - trimEnd, startSec + minDur);
        const fps = 30;
        const startFrame = Math.max(0, Math.floor(startSec * fps));
        const endFrame = Math.max(startFrame + 1, Math.ceil(endSec * fps));

        const trimmedClip = THREE.AnimationUtils.subclip(
          baseClip,
          `${baseClip.name}_${index}_${Date.now()}`,
          startFrame, endFrame, fps
        );

        const action = freshMixer.clipAction(trimmedClip);
        action.setLoop(THREE.LoopPingPong, Infinity);
        action.reset();
        action.setEffectiveWeight(1);
        action.play();
        action.time = 1/60;
        freshMixer.update(0);
      }
    }

    scene.add(root);
    currentModel = root;
    currentMixer = freshMixer;
    window.character = root;

    frameCameraOnTargetHeight(camera, targetHeight, 1.4, 0.2);
    window.updateCharacterInfo();
  }

  function loadCharacterDirectly() {
    const list = window.characterConfigs || [];
    const idx = (window.currentCharacterIndex ?? 0) % (list.length || 1);
    const cfg = list[idx];
    if (!cfg || !cfg.url) return;

    const myVersion = ++loadVersion;
    gltfLoader.load(
      cfg.url,
      (gltf) => {
        if (myVersion !== loadVersion) { if (gltf.scene) disposeObject(gltf.scene); return; }
        const root = gltf.scene || gltf.scenes?.[0];
        if (!root) return;

        const targetHeight = cfg.targetHeight ?? 1.8;

        centerAndScaleToHeight(root, targetHeight);
        if (cfg.scaleMul) root.scale.multiplyScalar(cfg.scaleMul);

        root.userData = root.userData || {};
        if (cfg.y != null && !root.userData.yApplied) {
          root.position.y += cfg.y;
          root.userData.yApplied = true;
        }
        root.userData.baseY = root.position.y;

        root.traverse((o) => {
          if (!o.isMesh) return;

          o.castShadow = true;
          o.receiveShadow = true;
          o.raycast = THREE.Mesh.prototype.raycast;
          o.frustumCulled = false;

          const store = (m) => {
            if (!m) return;
            m.userData = m.userData || {};
            if ('emissive' in m && !m.userData._origEmissive) {
              m.userData._origEmissive = m.emissive.clone();
            }
          };
          if (Array.isArray(o.material)) o.material.forEach(store);
          else store(o.material);
        });

        root.updateMatrixWorld(true);

        if (gltf.animations && gltf.animations.length) {
          currentMixer = new THREE.AnimationMixer(root);
          const clips = gltf.animations;
          const baseClip = THREE.AnimationClip.findByName(clips, 'Idle') ||
                           THREE.AnimationClip.findByName(clips, 'idle') ||
                           clips[0];

          const trimStart = Math.max(0, cfg.trimStart ?? 1.5);
          const trimEnd   = Math.max(0, cfg.trimEnd   ?? 2.0);
          const minDur = 0.05;
          const startSec = Math.min(trimStart, Math.max(0, baseClip.duration - minDur));
          const endSec   = Math.max(baseClip.duration - trimEnd, startSec + minDur);
          const fps = 30;
          const startFrame = Math.max(0, Math.floor(startSec * fps));
          const endFrame   = Math.max(startFrame + 1, Math.ceil(endSec * fps));

          const sub = THREE.AnimationUtils.subclip(
            baseClip,
            (baseClip.name || 'clip') + '_trim',
            startFrame, endFrame, fps
          );

          const action = currentMixer.clipAction(sub);
          action.setLoop(THREE.LoopPingPong, Infinity).reset().setEffectiveWeight(1).play();
          action.time = 1/60;
          currentMixer.update(0);
        } else {
          currentMixer = null;
        }

        scene.add(root);
        currentModel = root;
        window.character = root;

        frameCameraOnTargetHeight(camera, targetHeight, 1.4, 0.2);
        window.updateCharacterInfo?.();
      },
      undefined,
      (err) => console.error('GLB load error for', cfg.url, err)
    );
  }

  function centerAndScaleToHeight(root, targetHeight = 1.8) {
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    root.position.sub(center);
    root.position.y += targetHeight * 0.5;
    const h = Math.max(size.y, 1e-6);
    const s = targetHeight / h;
    root.scale.multiplyScalar(s);
  }

  function frameCameraOnTargetHeight(camera, targetHeight = 1.8, pad = 1.4, centerYFactor = 0.2) {
    const fovRad = (camera.fov * Math.PI) / 180;
    const halfH  = (targetHeight * pad) / 2;
    const dist   = halfH / Math.tan(fovRad / 2);
    const cy = targetHeight * centerYFactor;
    camera.position.set(0, cy, dist);
    camera.lookAt(0, cy, 0);
    camera.updateProjectionMatrix();
  }

  function tickAnimations() {
    const dt = Math.min(clock.getDelta(), 0.033);
    if (currentMixer) {
      try { currentMixer.update(dt); } catch(e) {}
    }
  }

  // ===== Character UI =====
  window.updateCharacterInfo = function() {
    const config = window.characterConfigs[window.currentCharacterIndex];

    if (!config || !nameEl) return;

  };

  window.previousCharacter = function() {
    window.currentCharacterIndex = (window.currentCharacterIndex - 1 + window.characterConfigs.length) % window.characterConfigs.length;
    window.createCharacter?.();
    window.updateCharacterInfo();

  window.nextCharacter = function() {

  window.confirmCharacter = function() {

      btn.classList.add('tick');

  function exitCarousel() {
    detachSimpleSwipeInput();

    const btn = document.getElementById('enterCarouselBtn');
    if (btn) {
      btn.classList.remove('tick');
      btn.setAttribute('aria-label', 'Choose Character');
    }

    carousel.mode = 'view';
    window.hideCharacterControls();
  }

  let simpleSwipe = { active: false, startX: 0, threshold: 50 };

  function attachSimpleSwipeInput() {
    if (simpleSwipe.active || !renderer) return;
    const dom = renderer.domElement;
    simpleSwipe.active = true;

    function onStart(e) { simpleSwipe.startX = e.touches ? e.touches[0].clientX : e.clientX; }
    function onEnd(e) {
      const endX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const deltaX = endX - simpleSwipe.startX;
      if (Math.abs(deltaX) > simpleSwipe.threshold) {
        if (deltaX > 0) window.previousCharacter();
        else window.nextCharacter();
      }
    }

    dom.addEventListener('touchstart', onStart);
    dom.addEventListener('touchend', onEnd);
    dom.addEventListener('mousedown', onStart);
    dom.addEventListener('mouseup', onEnd);

    simpleSwipe.handlers = { onStart, onEnd, dom };
  }

  function detachSimpleSwipeInput() {
    if (!simpleSwipe.active || !simpleSwipe.handlers) return;
    const { onStart, onEnd, dom } = simpleSwipe.handlers;

    dom.removeEventListener('touchstart', onStart);
    dom.removeEventListener('touchend', onEnd);
    dom.removeEventListener('mousedown', onStart);
    dom.removeEventListener('mouseup', onEnd);

    simpleSwipe.active = false;
    simpleSwipe.handlers = null;
  }

  function disposeObject(obj) {
    obj?.traverse?.((node) => {
      if (node.isMesh) {
        node.geometry?.dispose?.();
        const mat = node.material;
        if (Array.isArray(mat)) {
          mat.forEach(m => {
            m.map?.dispose?.(); m.normalMap?.dispose?.(); m.roughnessMap?.dispose?.();
            m.metalnessMap?.dispose?.(); m.emissiveMap?.dispose?.(); m.dispose?.();
          });
        } else if (mat) {
          mat.map?.dispose?.(); mat.normalMap?.dispose?.(); mat.roughnessMap?.dispose?.();
          mat.metalnessMap?.dispose?.(); mat.emissiveMap?.dispose?.(); mat.dispose?.();
        }
      }
    });
  }

  // ===== Three.js Setup =====
  function initThreeJS() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    window.scene = scene;

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);
    window.camera = camera;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const container = document.getElementById('scene-container');
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    raycaster = new THREE.Raycaster();
    mouseNDC = new THREE.Vector2();

    renderer.domElement.addEventListener('click', onCanvasClick);
    window.addEventListener('resize', onWindowResize);
    window.addEventListener('mousemove', onMouseMove);

    setFixedTitleWidth("Super Maramu 2000");
  }

  function animate() {
    requestAnimationFrame(animate);
    tickAnimations();
    renderer.render(scene, camera);
  }

  let clickPreventUntil = 0;

  function onCanvasClick(e) {
    if (performance.now() < clickPreventUntil) return;

    if (carousel && carousel.mode === 'carousel') {
      const cfg = window.characterConfigs?.[window.currentCharacterIndex];
      if (cfg && cfg.status !== 'Locked') exitCarousel(true);
      return;
    }

    const root = currentModel || window.character;
    if (!root || !camera || !renderer) return;

    root.updateMatrixWorld(true);

    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );

    raycaster.setFromCamera(ndc, camera);

    const hits = raycaster.intersectObject(root, true);
    if (hits.length > 0) {
      window.onCharacterClick();
      return;
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function onMouseMove(e) {
    mouseNDC.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    if (carousel.mode === 'carousel') return;
    checkHover();
  }

  function checkHover() {
    const root = currentModel || window.character;
    if (!root || !camera || !renderer) return;

    if (carousel.mode !== 'view') {
      renderer.domElement.style.cursor = 'default';
      if (lastHoverState) { setCharacterHighlight(false); lastHoverState = false; }
      return;
    }

    raycaster.setFromCamera(mouseNDC, camera);
    const hits = raycaster.intersectObject(root, true);
    const isOverCharacterMesh = hits.length > 0;

    if (isOverCharacterMesh !== lastHoverState) {
      setCharacterHighlight(isOverCharacterMesh);
      lastHoverState = isOverCharacterMesh;
    }
  }

  function setCharacterHighlight(active) {
    if (!window.scene || !window.character || !renderer) return;
    renderer.domElement.style.cursor = active ? 'pointer' : 'default';
  }

  function setFixedTitleWidth(ghostString) {
    const nameEl = document.getElementById('characterName');
    if (!nameEl) return;
    const measurer = document.createElement('span');
    measurer.style.position = 'absolute';
    measurer.style.visibility = 'hidden';
    measurer.style.whiteSpace = 'nowrap';
    measurer.style.fontFamily = getComputedStyle(nameEl).fontFamily;
    measurer.style.fontSize = getComputedStyle(nameEl).fontSize;
    measurer.style.fontWeight = getComputedStyle(nameEl).fontWeight;
    measurer.textContent = ghostString;
    document.body.appendChild(measurer);
    const width = Math.ceil(measurer.getBoundingClientRect().width);
    document.body.removeChild(measurer);
    document.documentElement.style.setProperty('--title-width', width + 'px');
  }

    if (!modal || !window.supa) return;

    const loggedInView = document.getElementById('accountLoggedIn');
    const loginForm    = document.getElementById('loginForm');
    const emailEl      = document.getElementById('accountEmail');

    const { data: { user } } = await window.supa.auth.getUser();

    if (user) {
      if (emailEl) emailEl.textContent = user.email || '';
      if (loggedInView) loggedInView.style.display = 'block';
      if (loginForm) loginForm.style.display = 'none';
    } else {
      if (loggedInView) loggedInView.style.display = 'none';
      if (loginForm) loginForm.style.display = 'block';
    }

    modal.classList.add('show');
  }

      '"': "&quot;",

        { title: "Sloucho - Lights On (ft. Yamagōchi)", dur: 203, src: "/assets/music/Sloucho_LightsOn.mp3" },
        { title: "Sloucho - Make it Work", dur: 209, src: 
        "/assets/music/Sloucho_MakeItWork.mp3" },
        { title: "Sloucho - Memory Walk", dur: 344, src: 
        "/assets/music/Sloucho_MemoryWalk.mp3" },
        { title: "Sloucho - Mind Traveller", dur: 90, src: "/assets/music/Sloucho_MindTraveller.mp3" },
        { title: "Sloucho - Over & Out", dur: 298, src: "/assets/music/Sloucho_OverAndOut.mp3" },
        { title: "Sloucho - Power Plant (Sloucho's Memory Mix)", dur: 62, src: "/assets/music/Sloucho_PowerPlant_MemoryMix.mp3" },
      ];

      const TZ = "Europe/Dublin";
      const START_HOUR = 6; // 06:00 station start in Dublin time

      const totalDur = PLAYLIST.reduce((s, t) => s + (t.dur || 0), 0);
      if (!totalDur) return;

      // ---- deterministic PRNG + shuffle ----
      function xmur3(str) {
        let h = 1779033703 ^ str.length;
        for (let i = 0; i < str.length; i++) {
          h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        return function () {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          return (h ^= h >>> 16) >>> 0;
        };
      }
      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6D2B79F5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function seededShuffle(arr, seedStr) {
        const seedFn = xmur3(seedStr);
        const rand = mulberry32(seedFn());
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // ---- timezone helpers (Dublin 06:00 start) ----
      function getTZParts(date, timeZone) {
        const dtf = new Intl.DateTimeFormat("en-GB", {
          timeZone,
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hour12: false
        });
        const parts = dtf.formatToParts(date);
        const get = (t) => parts.find(p => p.type === t)?.value;
        return {
          year: +get("year"),
          month: +get("month"),
          day: +get("day"),
          hour: +get("hour"),
          minute: +get("minute"),
          second: +get("second"),
        };
      }

      function tzLocalToUTCms({year, month, day, hour, minute, second}, timeZone) {
        const guess = Date.UTC(year, month - 1, day, hour, minute, second);
        const parts = getTZParts(new Date(guess), timeZone);
        const rendered = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
        const desired = Date.UTC(year, month - 1, day, hour, minute, second);
        const delta = desired - rendered;
        return guess + delta;
      }

      function mostRecent6amUTCms(now = new Date()) {
        const p = getTZParts(now, TZ);
        const today6 = { year: p.year, month: p.month, day: p.day, hour: START_HOUR, minute: 0, second: 0 };
        let startMs = tzLocalToUTCms(today6, TZ);
        if (now.getTime() < startMs) {
          const yesterday = new Date(startMs - 3600 * 1000);
          const yp = getTZParts(yesterday, TZ);
          const y6 = { year: yp.year, month: yp.month, day: yp.day, hour: START_HOUR, minute: 0, second: 0 };
          startMs = tzLocalToUTCms(y6, TZ);
        }
        return startMs;
      }

      function dayKeyForSeed(startMs) {
        const p = getTZParts(new Date(startMs), TZ);
        return `${p.year}-${String(p.month).padStart(2,"0")}-${String(p.day).padStart(2,"0")}`;
      }

      // ---- station state ----
      let station = { cycleIndex: 0, order: [], trackIndex: 0 };

      function updateNowPlaying(title) {
        if (!nowPlayingTitleEl) return;
        nowPlayingTitleEl.textContent = title || "—";
        startNowPlayingMarquee();   // ✅ recalculates scrolling per track
      }

      
      function startNowPlayingMarquee() {
        const marquee = document.querySelector("#nowPlaying .np-marquee");
        const text = document.getElementById("nowPlayingTitle");
        if (!marquee || !text) return;

        // reset previous animation
        text.style.transition = "none";
        text.style.transform = "translateX(0)";
        text.dataset.animating = "0";

        // Measure after layout
        requestAnimationFrame(() => {
          const marqueeW = marquee.clientWidth;
          const textW = text.scrollWidth;

          // If it fits, do nothing
          if (textW <= marqueeW) return;

          // Scroll distance: text width + small gap
          const gap = 24;
          const distance = textW - marqueeW + gap;

          // Speed: px/sec (tweak to taste)
          const speed = 45;
          const duration = distance / speed;

          // Animate: wait a beat, then glide left, snap back, repeat
          const loop = () => {
            // pause at start
            text.style.transition = "none";
            text.style.transform = "translateX(0)";

            setTimeout(() => {
              text.style.transition = `transform ${duration}s linear`;
              text.style.transform = `translateX(-${distance}px)`;
            }, 900);

            // after scroll completes + small pause, loop
            setTimeout(loop, 900 + duration * 1000 + 900);
          };

          loop();
        });
      }


      async function loadAndSeek(track, offsetSec) {
        if (!track?.src) return;

        audioEl.src = track.src;
        audioEl.load();

        updateNowPlaying(track.title);

        await new Promise((resolve) => {
          const onMeta = () => { audioEl.removeEventListener("loadedmetadata", onMeta); resolve(); };
          audioEl.addEventListener("loadedmetadata", onMeta);
        });

        const dur = audioEl.duration || track.dur || 0;
        const safe = dur ? Math.min(Math.max(0, offsetSec), Math.max(0, dur - 0.25)) : Math.max(0, offsetSec);
        try { audioEl.currentTime = safe; } catch (_) {}
      }

      function computeLivePosition() {
        const now = Date.now();
        const startMs = mostRecent6amUTCms(new Date(now));
        const dayKey = dayKeyForSeed(startMs);

        const elapsedSec = Math.floor((now - startMs) / 1000);
        const cycleIndex = Math.floor(elapsedSec / totalDur);
        let cycleOffset = elapsedSec % totalDur;
        if (cycleOffset < 0) cycleOffset += totalDur;

        const order = seededShuffle(PLAYLIST, `${dayKey}|cycle:${cycleIndex}`);

        let i = 0;
        while (i < order.length && cycleOffset >= order[i].dur) {
          cycleOffset -= order[i].dur;
          i++;
        }
        if (i >= order.length) i = 0;

        return { cycleIndex, order, trackIndex: i, offset: cycleOffset };
      }

      async function syncToLive() {
        const pos = computeLivePosition();
        station = { cycleIndex: pos.cycleIndex, order: pos.order, trackIndex: pos.trackIndex };
        await loadAndSeek(station.order[station.trackIndex], pos.offset);
      }

      async function playNext() {
        station.trackIndex++;
        if (station.trackIndex >= station.order.length) {
          station.cycleIndex++;
          const startMs = mostRecent6amUTCms(new Date());
          const dayKey = dayKeyForSeed(startMs);
          station.order = seededShuffle(PLAYLIST, `${dayKey}|cycle:${station.cycleIndex}`);
          station.trackIndex = 0;
        }
        await loadAndSeek(station.order[station.trackIndex], 0);
        try { await audioEl.play(); } catch (_) {}
      }

      audioEl.addEventListener("ended", playNext);

      // ---- keep your existing autoplay-muted unlock logic ----
      audioEl.muted = true;
      audioEl.setAttribute("muted", "");
      btn.classList.add("is-muted");
      btn.setAttribute("aria-label", "Unmute audio");

      let started = false;

      async function tryPlayMuted() {
        if (started || !audioEl.paused) { started = true; return; }
        try {
          await audioEl.play();
          started = true;
          removeUnlockers();
        } catch (_) {
          // blocked until user gesture
        }
      }

      function unlock() { tryPlayMuted(); }

      function addUnlockers() {
        window.addEventListener("pointerdown", unlock, { capture: true, once: true });
        window.addEventListener("mousedown",   unlock, { capture: true, once: true });
        window.addEventListener("touchstart",  unlock, { capture: true, once: true });
        window.addEventListener("keydown",     unlock, { capture: true, once: true });
        window.addEventListener("wheel",       unlock, { capture: true, once: true });
        window.addEventListener("scroll",      unlock, { capture: true, once: true });
      }

      function removeUnlockers() {
        window.removeEventListener("pointerdown", unlock, { capture: true });
        window.removeEventListener("mousedown",   unlock, { capture: true });
        window.removeEventListener("touchstart",  unlock, { capture: true });
        window.removeEventListener("keydown",     unlock, { capture: true });
        window.removeEventListener("wheel",       unlock, { capture: true });
        window.removeEventListener("scroll",      unlock, { capture: true });
      }

      // 1) Sync station (sets src + seeks)
      // 2) Then attempt autoplay (muted)
      syncToLive().then(() => {
        tryPlayMuted();
        audioEl.addEventListener("canplay", tryPlayMuted);
        window.addEventListener("load", tryPlayMuted, { once: true });
        addUnlockers();
      });

      // Resync when user returns (keeps “live” tight)
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) syncToLive();
      });

      // Button = mute / unmute toggle (your existing behavior)
      btn.addEventListener("click", async () => {
        const willMute = !audioEl.muted;

        audioEl.muted = willMute;
        btn.classList.toggle("is-muted", willMute);
        btn.setAttribute("aria-label", willMute ? "Unmute audio" : "Mute audio");

        // If user unmuted, ensure playback is running
        if (!willMute) {
          try { await audioEl.play(); } catch (_) {}
        }
      });
    })();



  /* ============================================================
     HERO VIDEO AUTOPLAY (single controller)
     - Removed the diagnostic logger (it was calling v.play() again)
     - Only one autoplay controller exists now
     - NEVER calls video.load()
     ============================================================ */
  


  (() => {
    const v = document.getElementById("heroVideo");
    const layer = document.getElementById("heroLayer");
    if (!v) return;

    // Ensure correct state immediately
    v.muted = true;
    v.defaultMuted = true;

    // If you fade video in only after it truly starts:
    function showVideo() {
      layer?.classList.add("is-playing");
    }

    let unlocked = false;

    async function attemptPlay(tag) {
      try {
        const p = v.play();
        if (p && p.then) await p;

        // Extra safety: only "confirm" after time has advanced
        if (!v.paused) {
          showVideo();
          unlocked = true;
          removeUnlockers();
          return true;
        }
        return false;
      } catch (e) {
        // Only treat NotAllowedError as "needs gesture"
        if (e?.name !== "NotAllowedError") {
          console.warn("[hero] play failed:", e);
        }
        return false;
      }
    }

    const unlockEvents = ["pointerdown", "mousedown", "touchstart", "keydown", "wheel"];
    const onGesture = async (ev) => {
      if (unlocked) return;
      const ok = await attemptPlay(`gesture:${ev.type}`);
      if (ok) {
        // done
      }
    };

    function addUnlockers() {
      unlockEvents.forEach(ev =>
        window.addEventListener(ev, onGesture, { capture: true })
      );
    }
    function removeUnlockers() {
      unlockEvents.forEach(ev =>
        window.removeEventListener(ev, onGesture, { capture: true })
      );
    }

    addUnlockers();

    // Try autoplay once on load
    window.addEventListener("load", async () => {
      const ok = await attemptPlay("window.load");
      if (!ok) {
        // stay armed; next user gesture will start it
      }
    }, { once: true });

    // Also retry when tab becomes visible again
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !unlocked) attemptPlay("visibility");
    });
  })();
