  <!-- Magic link processing -->
  <script>
    (async function () {
      try {
        if (window.supa && location.hash && location.hash.includes('access_token')) {
          const params = new URLSearchParams(location.hash.slice(1));
          const access_token = params.get('access_token');
          const refresh_token = params.get('refresh_token');
          const error = params.get('error');
          const error_description = params.get('error_description');
          if (error) {
            alert(`Authentication error: ${error_description || error}`);
            history.replaceState({}, '', location.pathname + location.search);
            return;
          }
          if (access_token && refresh_token) {
            const { error } = await window.supa.auth.setSession({ access_token, refresh_token });
            if (error) alert(`Session error: ${error.message}`);
            else window.location.reload();
          }
          history.replaceState({}, '', location.pathname + location.search);
        }
      } catch (e) { console.error('[supabase] Magic link processing failed:', e); }
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff;
      --text: #000;
      --muted: rgba(0,0,0,0.45);
      --border: rgba(0,0,0,0.12);
      --border-hover: rgba(0,0,0,0.28);
      --pill-bg: rgba(255,255,255,0.92);
      --btn-bg: rgba(0,0,0,0.05);
      --btn-bg-hover: rgba(0,0,0,0.10);
      --radius-card: 14px;
      --edge-pad-desktop: 28px;
      --edge-pad-mobile: 16px;
      --circle: 30px;
      --circle-border: rgba(0,0,0,0.15);
      --circle-border-hover: rgba(0,0,0,0.30);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'PPMori', -apple-system, BlinkMacSystemFont, 'SF Pro Text',
        'SF Pro Display', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: none;
      -ms-touch-action: none;
    }

    @font-face {
      font-family: 'PPMori';
      src: url('/assets/fonts/PPMori/PPMori-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* ── Top nav ── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px var(--edge-pad-desktop);
      z-index: 100;
    }
    @media (max-width: 768px) {
      .top-nav { padding: 20px var(--edge-pad-mobile); }
    }

    .menu-button, .login-button {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--circle-border);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      backdrop-filter: blur(10px);
      transition: border-color .2s ease, background .2s ease;
    }
    .menu-button:hover, .login-button:hover {
      border-color: var(--circle-border-hover);
      background: #fff;
    }
    .menu-dots { display: flex; gap: 4px; }
    .dot { width: 3px; height: 3px; background: #000; border-radius: 50%; }
    .user-icon { width: 16px; height: 16px; color: #000; }
    .user-icon svg { width: 100%; height: 100%; fill: currentColor; }

    /* ── Menu tray ── */
    .menu-tray {
      position: fixed; top: 60px; left: 20px; width: 155px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 200;
      transform: translateY(-20px); opacity: 0; visibility: hidden;
      transition: all .3s ease;
      padding: 10px 0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .menu-tray.open { transform: translateY(0); opacity: 1; visibility: visible; }
    .menu-item {
      position: relative; display: block; width: 100%;
      padding: 6px 15px; color: #000; text-decoration: none;
      font-size: 14px; font-weight: 400;
      cursor: pointer; background: none; border: 0;
    }
    .menu-item::before {
      content: ""; position: absolute; inset: 1px; left: 8px; right: 8px;
      border-radius: 8px; background: rgba(0,0,0,0.06);
      opacity: 0; transform: scaleY(0.96);
      transition: opacity .15s ease, transform .2s ease; pointer-events: none;
    }
    .menu-item:hover::before { opacity: 1; transform: scaleY(1); }
    .menu-item, .menu-item * { position: relative; z-index: 1; }

    /* ── Centred pill ── */
    .center-pill-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .now-playing-pill {
      pointer-events: auto;
      background: var(--pill-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      display: grid;
      grid-template-columns: 40px minmax(0, 260px) 40px;
      align-items: center;
      gap: 10px;
      padding: 9px;
      width: max-content;
      max-width: calc(100vw - 48px);
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }

    /* ── Circular buttons ── */
    .circ-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; padding: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .circ-btn:hover { border-color: var(--border-hover); background: var(--btn-bg-hover); }
    .circ-btn svg {
      width: 16px; height: 16px;
      stroke: rgba(0,0,0,0.65);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* mute toggle */
    .mute-btn .icon-sound { display: block; }
    .mute-btn .icon-muted { display: none; }
    .mute-btn.is-muted .icon-sound { display: none; }
    .mute-btn.is-muted .icon-muted { display: block; }

    /* ── Live pulse dot ── */
    .live-dot-wrap {
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #000;
      opacity: 0.18;
      animation: livePulse 2.4s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 0.18; transform: scale(1); }
      50%       { opacity: 0.55; transform: scale(1.25); }
    }

    /* ── Track info ── */
    .pill-meta { min-width: 0; }
    .pill-marquee-wrap {
      overflow: hidden;
      white-space: nowrap;
      line-height: 1.3;
    }
    .pill-title {
      font-size: 14px;
      font-weight: 450;
      white-space: nowrap;
      line-height: 1.3;
      color: var(--text);
      display: inline-block;
      will-change: transform;
    }
    .pill-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Shared icon-circle (modal) ── */
    .icon-circle {
      width: var(--circle); height: var(--circle);
      border-radius: 50%;
      background: rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.15);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;

    .icon-circle:hover { border-color: rgba(0,0,0,0.30); background: rgba(0,0,0,0.10); }
    .icon-close { position: relative; }
    .icon-close::before, .icon-close::after {
      content: ""; position: absolute;
      width: 12px; height: 2px;
      background: rgba(0,0,0,0.70); border-radius: 2px;
    }
    .icon-close::before { transform: rotate(45deg); }
    .icon-close::after  { transform: rotate(-45deg); }

    /* ── Account modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(255,255,255,0.88);
      z-index: 9999;
      display: none; align-items: center; justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .modal-overlay.show { display: flex; }

    .login-modal {
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px;
      width: 90%; max-width: 360px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.14);
      border: 1px solid var(--border);
      text-align: center;
      color: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      position: relative;
      min-height: 260px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .login-modal > :not(.icon-circle) { width: 100%; }
    .login-modal h2 { font-size: 18px; margin-bottom: 12px; color: #000; }
    .login-modal p  { font-size: 13px; opacity: 0.70; margin-bottom: 16px; color: #000; }
    .login-modal .icon-circle.icon-close {
      position: absolute; top: 14px; right: 14px;
    }

    .form-group { margin-bottom: 12px; }
    .form-input {
      width: 100%; padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.20);
      background: #f5f5f5; color: #000;
      font-size: 14px; outline: none; font-family: inherit;
    }
    .form-input:focus { border-color: #000; background: #fff; }
    .form-input::placeholder { color: rgba(0,0,0,0.40); }

    .form-button {

    /* ── Social link button + tray ── */
    .social-wrap {
      position: fixed;
      bottom: max(28px, env(safe-area-inset-bottom) + 20px);
      left: 50%;
      transform: translateX(-50%);

      display: flex;

    .social-tray {
      display: flex;
      gap: 8px;

    }
    .social-tray.open {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .social-btn {
      width: 30px; height: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--circle-border);

      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, background 0.15s;

    .social-btn:hover { border-color: var(--circle-border-hover); background: var(--btn-bg-hover); color: var(--text); }
    .social-btn svg { width: 13px; height: 13px; }

    .link-button {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--circle-border);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      backdrop-filter: blur(10px);
      color: var(--muted);
      transition: border-color .2s ease, background .2s ease, color .2s ease;
    }
    .link-button:hover, .link-button.active {
      border-color: var(--circle-border-hover);
      background: #fff;
      color: var(--text);
    }
    .link-button svg { width: 13px; height: 13px; }

    .sr-only {
      position: absolute !important; width: 1px !important; height: 1px !important;
      padding: 0 !important; margin: -1px !important; overflow: hidden !important;
      clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important;
    }
  </style>
</head>

      const tray = document.getElementById('socialTray');
      const btn  = document.getElementById('socialToggle');
      const isOpen = tray.classList.toggle('open');
      btn.classList.toggle('active', isOpen);
    }

    // ── Close trays on outside click ──
    document.addEventListener('click', function (e) {
      const menuTray = document.getElementById('menuTray');
      const menuBtn  = document.querySelector('.menu-button');
      if (menuTray && menuBtn && !menuTray.contains(e.target) && !menuBtn.contains(e.target))
        menuTray.classList.remove('open');

      const socialTray   = document.getElementById('socialTray');
      const socialToggle = document.getElementById('socialToggle');
      if (socialTray && socialToggle && !socialTray.contains(e.target) && !socialToggle.contains(e.target)) {

    // ── Auth ──
    async function handleLogin() {
      const modal        = document.getElementById('loginModal');
      const loggedInView = document.getElementById('accountLoggedIn');
      const loginForm    = document.getElementById('loginForm');
      const emailEl      = document.getElementById('accountEmail');
      if (!modal || !window.supa) return;

      const { data: { user } } = await window.supa.auth.getUser();
      if (user) {
        if (emailEl) emailEl.textContent = user.email || '';
        if (loggedInView) loggedInView.style.display = 'block';
        if (loginForm)    loginForm.style.display    = 'none';
      } else {
        if (loggedInView) loggedInView.style.display = 'none';
        if (loginForm)    loginForm.style.display    = 'block';
      }
      modal.classList.add('show');
    }

    function closeLoginModal() {
      document.getElementById('loginModal')?.classList.remove('show');
    }

    async function logout() {
      try { await window.supa?.auth?.signOut(); closeLoginModal(); }
      catch (e) { console.error('[auth] signOut failed', e); }
    }

    document.getElementById('loginModal')?.addEventListener('click', function (e) {
      if (e.target === this) closeLoginModal();
    });
    document.getElementById('logoutBtn')?.addEventListener('click', logout);

    // arriving from /fake's login button — open the login modal directly
    if (new URLSearchParams(location.search).get('login') === '1') handleLogin();

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])
      );
    }

    function showCheckEmailUI(email) {
      const card = document.querySelector('#loginModal .login-modal');
      if (!card) return;
      card.innerHTML = `
        <button class="icon-circle icon-close" type="button" onclick="closeLoginModal()" aria-label="Close"></button>

        <p style="font-size:14px; margin:0 0 12px; line-height:1.45; text-align:center;">

        </p>

    (function () {

      const loginBtn   = document.getElementById('loginSubmit');
      if (!emailInput || !loginBtn) return;
      loginBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = (emailInput.value || '').trim();
        if (!email) return alert('Enter your email');
        if (!window.supa?.auth) return alert('Auth not initialized');
        loginBtn.disabled = true;
        const old = loginBtn.textContent;
        loginBtn.textContent = 'Sending…';
        const { error } = await supa.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: window.location.origin }
        });
        loginBtn.disabled    = false;
        loginBtn.textContent = old;
        if (error) alert(error.message);
        else showCheckEmailUI(email);
      });
    })();

    // ── Mobile zoom suppression ──
    (function () {
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
    document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });
    document.addEventListener('touchstart',  e => { if (e.touches?.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove',   e => { if (typeof e.scale === 'number' && e.scale !== 1) e.preventDefault(); }, { passive: false });

    // ── normalizeTrack — splits "Artist - Title", swaps & for · ──
    function normalizeTrack(raw) {
      const full = (raw?.title || '').trim();
      const m    = full.match(/\s[-–—]\s/);
      if (!m) {
        return {
          ...raw,
          artist: (raw?.artist || 'Sloucho').replace(/\s*&\s*/g, ' · '),
          title:  full || 'OUCH™',
        };
      }
      const parsedArtist = full.slice(0, m.index).trim().replace(/\s*&\s*/g, ' · ');
      const parsedTitle  = full.slice(m.index + m[0].length).trim();
      return {
        ...raw,
        artist: (raw?.artist ? raw.artist.replace(/\s*&\s*/g, ' · ') : parsedArtist) || 'Sloucho',
        title:  parsedTitle || 'OUCH™',
      };
    }

    // ── MediaSession ──
    function updateMediaSessionMetadata(rawTrack) {
      if (!('mediaSession' in navigator)) return;
      const track  = normalizeTrack(rawTrack);
      const art    = `${location.origin}/assets/slouchometa.png`;
      navigator.mediaSession.metadata = new MediaMetadata({
        title:   track?.title  || 'OUCH™',
        artist:  track?.artist || 'Sloucho',
        album:   'Discography',
        artwork: [
          { src: art, sizes: '96x96',   type: 'image/png' },
          { src: art, sizes: '192x192', type: 'image/png' },
          { src: art, sizes: '512x512', type: 'image/png' },
        ]
      });
    }

    // ── Marquee ──
    let marqueeTimers = [];
    function clearMarqueeTimers() {
      marqueeTimers.forEach(t => clearTimeout(t));
      marqueeTimers = [];
    }
    function startMarquee() {
      const wrap = document.getElementById('marqueeWrap');
      const text = document.getElementById('nowPlayingTitle');
      if (!wrap || !text) return;
      clearMarqueeTimers();
      text.style.transition = 'none';
      text.style.transform  = 'translateX(0)';
      requestAnimationFrame(() => {
        const wrapW = wrap.clientWidth;
        const textW = text.scrollWidth;
        if (textW <= wrapW) return;
        const distance = textW - wrapW;
        const duration = distance / 45;
        const loop = () => {
          text.style.transition = 'transform 380ms cubic-bezier(0.22,0.61,0.36,1)';
          text.style.transform  = 'translateX(0)';
          marqueeTimers.push(setTimeout(() => {
            text.style.transition = `transform ${duration}s linear`;
            text.style.transform  = `translateX(-${distance}px)`;
          }, 900));
          marqueeTimers.push(setTimeout(loop, 900 + duration * 1000 + 900));
        };
        loop();
      });
    }

    function updateNowPlaying(track) {
      const t = normalizeTrack(track);
      const titleEl  = document.getElementById('nowPlayingTitle');
      const artistEl = document.getElementById('nowPlayingArtist');
      if (titleEl)  titleEl.textContent  = t.title  || 'OUCH™';
      if (artistEl) artistEl.textContent = t.artist || 'Sloucho';
      startMarquee();
    }

    // ── HOME AUDIO — LIVE STATION ──
    (function () {
      const audioEl = document.getElementById('mysteryGiftAudio');
      const btn     = document.getElementById('audioMuteBtn');
      if (!audioEl || !btn) return;

      const PLAYLIST = [
        { title: "Sloucho & Rory Sweeney - Watching Us",                        dur: 266, src: "/assets/music/Sloucho_RorySweeney_WatchingUs.mp3" },
        { title: "Sloucho & Spooklet - Casse-Toi",                              dur: 200, src: "/assets/music/Sloucho_Spooklet_CasseToi.mp3" },

        { title: "Sloucho - techno party",                                       dur: 177, src: "/assets/music/Sloucho_TechnoParty.mp3" },

        { title: "Sloucho - The Power of the Plant",                             dur: 44,  src: "/assets/music/Sloucho_ThePowerOfThePlant.mp3" },
        { title: "Sloucho - TMD my DMS",                                         dur: 200, src: "/assets/music/Sloucho_TMDmyDMS.mp3" },
        { title: "Sloucho - Two Thousands (ft. Emby + Curtisy)",                 dur: 194, src: "/assets/music/Sloucho_TwoThousands.mp3" },
        { title: "Sloucho - when inches became miles",                           dur: 251, src: "/assets/music/Sloucho_WhenInchesBecameMiles.mp3" },
        { title: "Sloucho & Brawni - Silver Veil",                               dur: 208, src: "/assets/music/Sloucho_Brawni_SilverVeil.mp3" },
        { title: "Sloucho & Curtisy - gimme it",                                 dur: 212, src: "/assets/music/Sloucho_GimmeIt.mp3" },
        { title: "Sloucho & Rhoshi - Mutant",                                    dur: 240, src: "/assets/music/Sloucho_Rhoshi_Mutant.mp3" },
        { title: "Sloucho & Rory Sweeney - 150K (Rhoshi's Monster Mix)",        dur: 77,  src: "/assets/music/Sloucho_RorySweeney_150K_MonsterMix.mp3" },
        { title: "Sloucho & Rory Sweeney - 150K",                               dur: 220, src: "/assets/music/Sloucho_RorySweeney_150K.mp3" },
        { title: "Sloucho & Rory Sweeney - Come Around",                        dur: 244, src: "/assets/music/Sloucho_RorySweeney_ComeAround.mp3" },
        { title: "Isabella Lovestory - Telenovela (Sloucho Edit)",               dur: 153, src: "/assets/music/IsabellaLovestory_Telenovela_SlouchoEdit.mp3" },
        { title: "Llainwire - Trust Fund (Sloucho Edit)",                        dur: 239, src: "/assets/music/Llainwire_TrustFund_SlouchoEdit.mp3" },
        { title: "Skillibeng - Coke (Sloucho Edit)",                             dur: 207, src: "/assets/music/Skillibeng_Coke_SlouchoEdit.mp3" },
        { title: "Sloucho - always remember",                                    dur: 173, src: "/assets/music/Sloucho_AlwaysRemember.mp3" },
        { title: "Sloucho - Brand New (ft. Zack Oke + Emby)",                   dur: 219, src: "/assets/music/Sloucho_BrandNew.mp3" },
        { title: "Sloucho - Bronze Age (Bing's Malfunction Mix)",                dur: 63,  src: "/assets/music/Sloucho_BronzeAge_BingsMix.mp3" },
        { title: "Sloucho - Bronze Age",                                         dur: 191, src: "/assets/music/Sloucho_BronzeAge.mp3" },
        { title: "Sloucho - Hold It Down",                                       dur: 389, src: "/assets/music/Sloucho_HoldItDown.mp3" },
        { title: "Sloucho - i found u",                                          dur: 200, src: "/assets/music/Sloucho_IFoundU.mp3" },
        { title: "Sloucho - just u",                                             dur: 201, src: "/assets/music/Sloucho_JustU.mp3" },
        { title: "Sloucho - Lights On (ft. Yamagōchi)",                          dur: 203, src: "/assets/music/Sloucho_LightsOn.mp3" },
        { title: "Sloucho - Make it Work",                                       dur: 209, src: "/assets/music/Sloucho_MakeItWork.mp3" },
        { title: "Sloucho - Memory Walk",                                        dur: 344, src: "/assets/music/Sloucho_MemoryWalk.mp3" },
        { title: "Sloucho - Mind Traveller",                                     dur: 90,  src: "/assets/music/Sloucho_MindTraveller.mp3" },
        { title: "Sloucho - Over & Out",                                         dur: 298, src: "/assets/music/Sloucho_OverAndOut.mp3" },
        { title: "Sloucho - Power Plant (Sloucho's Memory Mix)",                 dur: 62,  src: "/assets/music/Sloucho_PowerPlant_MemoryMix.mp3" },
      ];

      const TZ         = 'Europe/Dublin';
      const START_HOUR = 6;
      const totalDur   = PLAYLIST.reduce((s, t) => s + (t.dur || 0), 0);
      if (!totalDur) return;

      // ── Seeded RNG ──
      function xmur3(str) {
        let h = 1779033703 ^ str.length;
        for (let i = 0; i < str.length; i++) {
          h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        return function () {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          return (h ^= h >>> 16) >>> 0;
        };
      }
      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6D2B79F5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function seededShuffle(arr, seedStr) {
        const seedFn = xmur3(seedStr);
        const rand   = mulberry32(seedFn());
        const a      = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // ── Timezone helpers ──
      function getTZParts(date, timeZone) {
        const dtf   = new Intl.DateTimeFormat('en-GB', {
          timeZone, year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        const parts = dtf.formatToParts(date);
        const get   = t => parts.find(p => p.type === t)?.value;
        return {
          year: +get('year'), month: +get('month'), day: +get('day'),
          hour: +get('hour'), minute: +get('minute'), second: +get('second'),
        };
      }
      function tzLocalToUTCms({ year, month, day, hour, minute, second }, timeZone) {
        const guess    = Date.UTC(year, month - 1, day, hour, minute, second);
        const parts    = getTZParts(new Date(guess), timeZone);
        const rendered = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
        return guess + (Date.UTC(year, month - 1, day, hour, minute, second) - rendered);
      }
      function mostRecent6amUTCms(now = new Date()) {
        const p      = getTZParts(now, TZ);
        const today6 = { year: p.year, month: p.month, day: p.day, hour: START_HOUR, minute: 0, second: 0 };
        let startMs  = tzLocalToUTCms(today6, TZ);
        if (now.getTime() < startMs) {
          const yesterday = new Date(startMs - 3600 * 1000);
          const yp        = getTZParts(yesterday, TZ);
          startMs         = tzLocalToUTCms({ year: yp.year, month: yp.month, day: yp.day, hour: START_HOUR, minute: 0, second: 0 }, TZ);
        }
        return startMs;
      }
      function dayKeyForSeed(startMs) {
        const p = getTZParts(new Date(startMs), TZ);
        return `${p.year}-${String(p.month).padStart(2,'0')}-${String(p.day).padStart(2,'0')}`;
      }

      let station = { cycleIndex: 0, order: [], trackIndex: 0 };

      async function loadAndSeek(track, offsetSec) {
        if (!track?.src) return;
        audioEl.src = track.src;
        audioEl.load();
        updateNowPlaying(track);
        updateMediaSessionMetadata(track);
        await new Promise(resolve => {
          const onMeta = () => { audioEl.removeEventListener('loadedmetadata', onMeta); resolve(); };
          audioEl.addEventListener('loadedmetadata', onMeta);
        });
        const dur  = audioEl.duration || track.dur || 0;
        const safe = dur ? Math.min(Math.max(0, offsetSec), Math.max(0, dur - 0.25)) : Math.max(0, offsetSec);
        try { audioEl.currentTime = safe; } catch (_) {}
      }

      function computeLivePosition() {
        const now        = Date.now();
        const startMs    = mostRecent6amUTCms(new Date(now));
        const dayKey     = dayKeyForSeed(startMs);
        const elapsedSec = Math.floor((now - startMs) / 1000);
        const cycleIndex = Math.floor(elapsedSec / totalDur);
        let cycleOffset  = elapsedSec % totalDur;
        if (cycleOffset < 0) cycleOffset += totalDur;
        const order = seededShuffle(PLAYLIST, `${dayKey}|cycle:${cycleIndex}`);
        let i = 0;
        while (i < order.length && cycleOffset >= order[i].dur) { cycleOffset -= order[i].dur; i++; }
        if (i >= order.length) i = 0;
        return { cycleIndex, order, trackIndex: i, offset: cycleOffset };
      }

      async function syncToLive() {
        const pos = computeLivePosition();
        station   = { cycleIndex: pos.cycleIndex, order: pos.order, trackIndex: pos.trackIndex };
        await loadAndSeek(station.order[station.trackIndex], pos.offset);
      }

      async function playNext() {
        station.trackIndex++;
        if (station.trackIndex >= station.order.length) {
          station.cycleIndex++;
          const startMs     = mostRecent6amUTCms(new Date());
          const dayKey      = dayKeyForSeed(startMs);
          station.order     = seededShuffle(PLAYLIST, `${dayKey}|cycle:${station.cycleIndex}`);
          station.trackIndex = 0;
        }
        await loadAndSeek(station.order[station.trackIndex], 0);
        try { await audioEl.play(); } catch (_) {}
      }

      audioEl.addEventListener('ended', playNext);

      audioEl.addEventListener('play', () => {
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        updateMediaSessionMetadata(normalizeTrack(station?.order?.[station?.trackIndex]));
      });
      audioEl.addEventListener('playing', () => {
        updateMediaSessionMetadata(normalizeTrack(station?.order?.[station?.trackIndex]));
        if ('mediaSession' in navigator && typeof navigator.mediaSession.setPositionState === 'function') {
          const t   = station?.order?.[station?.trackIndex];
          const dur = audioEl.duration || t?.dur || 0;
          if (dur) navigator.mediaSession.setPositionState({
            duration: dur, playbackRate: audioEl.playbackRate || 1, position: audioEl.currentTime || 0
          });
        }
      });
      audioEl.addEventListener('pause', () => {
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      });

      // ── Autoplay muted unlock ──
      audioEl.muted = true;
      audioEl.setAttribute('muted', '');
      btn.classList.add('is-muted');
      btn.setAttribute('aria-label', 'Unmute audio');

      let started = false;
      async function tryPlayMuted() {
        if (started || !audioEl.paused) { started = true; return; }
        try { await audioEl.play(); started = true; removeUnlockers(); } catch (_) {}
      }
      function unlock() { tryPlayMuted(); }
      function addUnlockers() {
        ['pointerdown','mousedown','touchstart','keydown','wheel','scroll'].forEach(ev =>
          window.addEventListener(ev, unlock, { capture: true, once: true })
        );
      }
      function removeUnlockers() {
        ['pointerdown','mousedown','touchstart','keydown','wheel','scroll'].forEach(ev =>
          window.removeEventListener(ev, unlock, { capture: true })
        );
      }

      syncToLive().then(() => {
        tryPlayMuted();
        audioEl.addEventListener('canplay', tryPlayMuted);
        window.addEventListener('load', tryPlayMuted, { once: true });
        addUnlockers();
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) syncToLive();
      });

      // ── Mute button ──
      btn.addEventListener('click', async () => {
        const willMute = !audioEl.muted;
        audioEl.muted  = willMute;
        btn.classList.toggle('is-muted', willMute);
        btn.setAttribute('aria-label', willMute ? 'Unmute audio' : 'Mute audio');
        if (!willMute) {
          updateMediaSessionMetadata(normalizeTrack(station?.order?.[station?.trackIndex]));
          try { await audioEl.play(); } catch (_) {}
        }
      });
    })();
  </script>
