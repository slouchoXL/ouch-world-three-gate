  <!-- Magic link processing -->
  <script>
    (async function () {
      try {
        if (window.supa && location.hash && location.hash.includes('access_token')) {
          const params = new URLSearchParams(location.hash.slice(1));
          const access_token = params.get('access_token');
          const refresh_token = params.get('refresh_token');
          const error = params.get('error');
          const error_description = params.get('error_description');
          if (error) {
            alert(`Authentication error: ${error_description || error}`);
            history.replaceState({}, '', location.pathname + location.search);
            return;
          }
          if (access_token && refresh_token) {
            const { error } = await window.supa.auth.setSession({ access_token, refresh_token });
            if (error) alert(`Session error: ${error.message}`);
            else window.location.reload();
          }
          history.replaceState({}, '', location.pathname + location.search);
        }
      } catch (e) { console.error('[supabase] Magic link processing failed:', e); }
    })();

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff;
      --text: #000;
      --muted: rgba(0,0,0,0.45);
      --border: rgba(0,0,0,0.12);
      --border-hover: rgba(0,0,0,0.28);
      --pill-bg: rgba(255,255,255,0.92);
      --btn-bg: rgba(0,0,0,0.05);
      --btn-bg-hover: rgba(0,0,0,0.10);
      --radius-card: 14px;
      --radius-pill: 999px;
      --edge-pad-desktop: 28px;
      --edge-pad-mobile: 16px;
      --circle: 30px;
      --circle-border: rgba(0,0,0,0.15);
      --circle-border-hover: rgba(0,0,0,0.30);
    }

    /* page layout — matches /portal */
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PPMori', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: pan-y;
      -ms-touch-action: pan-y;
    }
    body::-webkit-scrollbar { display: none; }

    @font-face {
      font-family: 'PPMori';
      src: url('/assets/fonts/PPMori/PPMori-Regular.woff2') format('woff2'),
           url('https://ouch.world/assets/fonts/PPMori/PPMori-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* ── Top nav (index.html) ── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px var(--edge-pad-desktop);
      z-index: 1000;
    }
    @media (max-width: 768px) { .top-nav { padding: 20px var(--edge-pad-mobile); } }

    .menu-button, .login-button {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--circle-border);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      backdrop-filter: blur(10px);
      transition: border-color .2s ease, background .2s ease;
    }
    .menu-button:hover, .login-button:hover { border-color: var(--circle-border-hover); background: #fff; }
    .menu-dots { display: flex; gap: 4px; }
    .dot { width: 3px; height: 3px; background: #000; border-radius: 50%; }
    .user-icon { width: 16px; height: 16px; color: #000; }
    .user-icon svg { width: 100%; height: 100%; fill: currentColor; }

    /* ── Menu tray (index.html) ── */
    .menu-tray {
      position: fixed; top: 60px; left: 20px; width: 155px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 1000;
      transform: translateY(-20px); opacity: 0; visibility: hidden;
      transition: all .3s ease;
      padding: 10px 0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .menu-tray.open { transform: translateY(0); opacity: 1; visibility: visible; }
    .menu-item {
      position: relative; display: block; width: 100%;
      padding: 6px 15px; color: #000; text-decoration: none;
      font-size: 14px; font-weight: 400;
      cursor: pointer; background: none; border: 0;
    }
    .menu-item::before {
      content: ""; position: absolute; inset: 1px; left: 8px; right: 8px;
      border-radius: 8px; background: rgba(0,0,0,0.06);
      opacity: 0; transform: scaleY(0.96);
      transition: opacity .15s ease, transform .2s ease; pointer-events: none;
    }
    .menu-item:hover::before { opacity: 1; transform: scaleY(1); }
    .menu-item, .menu-item * { position: relative; z-index: 1; }

    /* ── Fixed album header (portal) ── */
    .fixed-header {
      position: fixed;
      top: 68px;
      left: 0; right: 0;
      text-align: center;
      padding: 4px 24px 24px;
      z-index: 999;
      pointer-events: none;
    }
    .fixed-header .fh-artist,
    .fixed-header .fh-title {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 500;
      line-height: 1.0;
      letter-spacing: -0.03em;
    }
    .fixed-header .fh-artist { color: var(--text); }
    .fixed-header .fh-title  { color: var(--muted); }

    /* ── Top nav fade gradient — covers nav + fixed header (portal) ── */
    .nav-fade {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 210px;
      background: linear-gradient(to bottom,
        rgba(255,255,255,1) 0%,
        rgba(255,255,255,1) 72%,
        rgba(255,255,255,0) 88%);
      pointer-events: none;
      z-index: 998;
    }

    /* ── Page layout (portal) ── */
    .page {
      max-width: 740px;
      margin: 0 auto;
      padding: 195px 24px calc(60px + 54px + env(safe-area-inset-bottom, 0px));
    }

    /* ── Release date — portal .bs-copy p ── */
    .release-date {
      text-align: center;
      font-size: 13px;
      line-height: 1.3;
      color: var(--muted);
      margin-bottom: 40px;
    }

    /* ── Track pill (portal) ── */
    .track-pill {
      background: var(--pill-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      margin-bottom: 5px;
      overflow: hidden;
    }
    .pill-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 9px 9px 9px 19px;
      user-select: none;
    }

    /* ── Circle buttons (portal .circ-btn) ── */
    .circ-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      color: var(--muted);
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    span.circ-btn { cursor: default; }
    .circ-btn svg { width: 14px; height: 14px; }

    .pill-meta { min-width: 0; }
    .pill-title {
      font-size: 14px; font-weight: 450;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.3;
    }
    .pill-sub {
      font-size: 12px; color: var(--muted);
      margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-pill.locked .pill-title { color: var(--muted); }
    a.circ-btn:hover, button.circ-btn:hover { border-color: var(--border-hover); background: var(--btn-bg-hover); color: var(--text); }

    /* ── Expanded panel (portal .pill-expanded / .pill-action-btn) ── */
    .info-btn.active { background: rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.2); color: var(--text); }
    .pill-expanded { max-height: 0; overflow: hidden; transition: max-height 0.38s cubic-bezier(0.4,0,0.2,1); }
    .pill-expanded.open { max-height: 360px; }
    .pill-expanded-inner { padding: 14px 49px 18px 19px; border-top: 1px solid var(--border); }
    .pill-actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .pill-action-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; padding: 5px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      cursor: pointer; text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .pill-action-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .pill-action-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

    @media (max-width: 600px) {
      .page { padding-top: 180px; }
    }

    /* ── Social buttons (index.html .social-btn) ── */
    .social-btn {
      width: 30px; height: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--circle-border);
      background: var(--btn-bg);
      color: var(--muted);
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    a.social-btn:hover { border-color: var(--circle-border-hover); background: var(--btn-bg-hover); color: var(--text); }
    .social-btn svg { width: 13px; height: 13px; }

    /* ── Social link button + tray (index.html) ── */
    .social-wrap {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      padding: 10px 0 calc(14px + env(safe-area-inset-bottom, 0px));
    }
    .social-tray {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      display: flex;
      gap: 8px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      transform: translate(-50%, 8px);
      opacity: 0;
      visibility: hidden;
      transition: transform .25s ease, opacity .25s ease, visibility .25s ease;
    }
    .social-tray.open { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

    .link-button {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--circle-border);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      backdrop-filter: blur(10px);
      color: var(--muted);
      transition: border-color .2s ease, background .2s ease, color .2s ease;
    }
    .link-button:hover, .link-button.active { border-color: var(--circle-border-hover); background: #fff; color: var(--text); }
    .link-button svg { width: 13px; height: 13px; }

    /* ── Shared icon-circle (modal) ── */
    .icon-circle {
      width: var(--circle); height: var(--circle);
      border-radius: 50%;
      background: rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.15);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      transition: border-color .2s ease, background .2s ease;
    }
    .icon-circle:hover { border-color: rgba(0,0,0,0.30); background: rgba(0,0,0,0.10); }
    .icon-close { position: relative; }
    .icon-close::before, .icon-close::after {
      content: ""; position: absolute;
      width: 12px; height: 2px;
      background: rgba(0,0,0,0.70); border-radius: 2px;
    }
    .icon-close::before { transform: rotate(45deg); }
    .icon-close::after  { transform: rotate(-45deg); }

    /* ── Account modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(255,255,255,0.88);
      z-index: 9999;
      display: none; align-items: center; justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .modal-overlay.show { display: flex; }

    .login-modal {
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px;
      width: 90%; max-width: 360px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.14);
      border: 1px solid var(--border);
      text-align: center;
      color: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      position: relative;
      min-height: 260px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .login-modal > :not(.icon-circle) { width: 100%; }
    .login-modal h2 { font-size: 18px; margin-bottom: 12px; color: #000; }
    .login-modal p  { font-size: 13px; opacity: 0.70; margin-bottom: 16px; color: #000; }
    .login-modal .icon-circle.icon-close {
      position: absolute; top: 14px; right: 14px;
    }

    .form-group { margin-bottom: 12px; }
    .form-input {
      width: 100%; padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.20);
      background: #f5f5f5; color: #000;
      font-size: 14px; outline: none; font-family: inherit;
    }
    .form-input:focus { border-color: #000; background: #fff; }
    .form-input::placeholder { color: rgba(0,0,0,0.40); }

    .form-button {
      width: 100%; padding: 10px 12px;
      border-radius: 999px; border: none;
      background: #000; color: #fff;
      font-weight: 600; font-size: 14px; cursor: pointer;
      font-family: inherit;
    }
    .form-button:hover { background: #222; }
  </style>
</head>

      </form>
    </div>
  </div>

  <script>
    // ── Tracks — fill in links for released tracks ──
    const TRACKS = [
      { title: 'fall4me' },
      { title: 'Nothing Like Me' },
      { title: 'Angel (Need You)', feat: null, out: true,
        spotify:  'https://open.spotify.com/album/66dOOdRtocUGVPqR7hmyqf',
        apple:    'https://music.apple.com/album/angel-need-you-single/6821024081',
        youtube:  'https://music.youtube.com/watch?v=7sWCyl6QriI',
        bandcamp: 'https://sloucho.bandcamp.com/track/angel-need-you' },
      { title: 'Something Else', feat: 'Kibo', out: true,
        spotify:  'https://open.spotify.com/album/3FlCWoWNo9sSV0GmOzqsyh',
        apple:    'https://music.apple.com/album/something-else-feat-kibo-single/6795630432',
        youtube:  'https://www.youtube.com/watch?v=IzhMSLQbnXM',
        bandcamp: 'https://sloucho.bandcamp.com/album/something-else-ft-kibo' },
      { title: 'Goodbye' },
      { title: 'Wiggidy Woo' },
      { title: 'Don’t Panic!' },
      { title: 'All Night' },
      { title: 'Catfished V2', feat: 'Crutch', out: true,
        spotify:  'https://open.spotify.com/album/4PKdWpqhzzDJPApqoN3FV6',
        apple:    'https://music.apple.com/album/wondering-catfished-v2-single/1896132020',
        youtube:  'https://music.youtube.com/watch?v=4oPI7V_i0f8',
        bandcamp: 'https://sloucho.bandcamp.com/album/wondering-catfished-v2' },
      { title: 'Fake', feat: 'Gemma Dunleavy', out: true,
        spotify:  'https://open.spotify.com/album/0pUqf3yaHSWtkcgdIJU1yf',
        apple:    'https://music.apple.com/album/fake-single/6780259367',
        youtube:  'https://www.youtube.com/watch?v=2cFgs6cc1BU',
        bandcamp: 'https://sloucho.bandcamp.com/track/fake-ft-gemma-dunleavy' },
      { title: 'Love is Fear', feat: null, out: true,
        spotify:  'https://open.spotify.com/album/7yTaU52PQrOjVud6BgLMtv',
        apple:    'https://music.apple.com/album/love-is-fear-single/1875394359',
        youtube:  'https://www.youtube.com/watch?v=cci9Bfajs3o',
        bandcamp: 'https://sloucho.bandcamp.com/track/love-is-fear' },
      { title: 'Weightless' },
    ];

    // icons from index.html (Spotify, YouTube, Bandcamp) + portal music-note (Apple Music)
    const ICON = {
      spotify:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.622.622 0 01-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 11-.277-1.215c3.809-.87 7.077-.496 9.712 1.115a.623.623 0 01.207.857zm1.223-2.722a.78.78 0 01-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166a.78.78 0 01-.973-.519.781.781 0 01.52-.973c3.632-1.102 8.147-.568 11.233 1.329a.78.78 0 01.257 1.072zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.937.937 0 11-.543-1.793c3.525-1.07 9.381-.863 13.081 1.345a.937.937 0 01-.921 1.605z"/></svg>',
      apple:    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>',
      youtube:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.7 2.7 0 00-1.9-1.9C18 5 12 5 12 5s-6 0-7.7.3A2.7 2.7 0 002.4 7.2C2 8.9 2 12 2 12s0 3.1.4 4.8a2.7 2.7 0 001.9 1.9C6 19 12 19 12 19s6 0 7.7-.3a2.7 2.7 0 001.9-1.9C22 15.1 22 12 22 12s0-3.1-.4-4.8zM10 15V9l5.5 3L10 15z"/></svg>',
      bandcamp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 17.5L8.6 6.5H23l-7.6 11z"/></svg>',
      link:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>',
      lock:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',
    };

    function link(href, platform, label, icon) {
      return `<a class="pill-action-btn" href="${href}" target="_blank" rel="noopener" data-platform="${platform}">${icon} ${label}</a>`;
    }

    document.getElementById('trackList').innerHTML = TRACKS.map(t => t.out ? `
      <div class="track-pill">
        <div class="pill-row">
          <div class="pill-meta">
            <div class="pill-title">${t.title}</div>
            <div class="pill-sub">Sloucho${t.feat ? ' · ' + t.feat : ''}</div>
          </div>
          <button type="button" class="circ-btn info-btn" onclick="toggleLinks(this)" aria-label="${t.title} links" aria-expanded="false">${ICON.link}</button>
        </div>
        <div class="pill-expanded">
          <div class="pill-expanded-inner">
            <div class="pill-actions">
              ${link(t.spotify,  'spotify',  'Spotify',     ICON.spotify)}
              ${link(t.apple,    'apple',    'Apple Music', ICON.apple)}
              ${link(t.youtube,  'youtube',  'YouTube',     ICON.youtube)}
              ${link(t.bandcamp, 'bandcamp', 'Bandcamp',    ICON.bandcamp)}
            </div>
          </div>
        </div>
      </div>` : `
      <div class="track-pill locked">
        <div class="pill-row">
          <div class="pill-meta">
            <div class="pill-title">Locked</div>
          </div>
          <span class="circ-btn" role="img" aria-label="Locked until release">${ICON.lock}</span>
        </div>
      </div>`).join('');

    // ── Menu ──
    function toggleMenu() { document.getElementById('menuTray')?.classList.toggle('open'); }

    // ── Link dropdown (portal toggleInfo logic) ──
    let openPill = null;
    function toggleLinks(btn) {
      const pill   = btn.closest('.track-pill');
      const panel  = pill.querySelector('.pill-expanded');
      const isOpen = panel.classList.contains('open');

      if (openPill && openPill !== pill) {
        const prev = openPill.querySelector('.pill-expanded');
        prev.classList.remove('open'); prev.style.maxHeight = '0px';
        openPill.querySelector('.info-btn')?.classList.remove('active');
        openPill.querySelector('.info-btn')?.setAttribute('aria-expanded', 'false');
      }

      panel.classList.toggle('open', !isOpen);
      panel.style.maxHeight = isOpen ? '0px' : panel.scrollHeight + 'px';
      btn.classList.toggle('active', !isOpen);
      btn.setAttribute('aria-expanded', String(!isOpen));
      openPill = isOpen ? null : pill;
    }

    // ── Social tray ──
    function toggleSocial() {
      const tray = document.getElementById('socialTray');
      const btn  = document.getElementById('socialToggle');
      const isOpen = tray.classList.toggle('open');
      btn.classList.toggle('active', isOpen);
    }

    // ── Close trays on outside click ──
    document.addEventListener('click', function (e) {
      const menuTray = document.getElementById('menuTray');
      const menuBtn  = document.querySelector('.menu-button');
      if (menuTray && menuBtn && !menuTray.contains(e.target) && !menuBtn.contains(e.target))
        menuTray.classList.remove('open');

      const socialTray   = document.getElementById('socialTray');
      const socialToggle = document.getElementById('socialToggle');
      if (socialTray && socialToggle && !socialTray.contains(e.target) && !socialToggle.contains(e.target)) {
        socialTray.classList.remove('open');
        socialToggle.classList.remove('active');
      }
    });

    // ── Auth ──
    async function handleLogin() {
      const modal        = document.getElementById('loginModal');
      const loggedInView = document.getElementById('accountLoggedIn');
      const loginForm    = document.getElementById('loginForm');
      const emailEl      = document.getElementById('accountEmail');
      if (!modal || !window.supa) return;

      const { data: { user } } = await window.supa.auth.getUser();
      if (user) {
        if (emailEl) emailEl.textContent = user.email || '';
        if (loggedInView) loggedInView.style.display = 'block';
        if (loginForm)    loginForm.style.display    = 'none';
      } else {
        if (loggedInView) loggedInView.style.display = 'none';
        if (loginForm)    loginForm.style.display    = 'block';
      }
      modal.classList.add('show');
    }

    function closeLoginModal() {
      document.getElementById('loginModal')?.classList.remove('show');
    }

    async function logout() {
      try { await window.supa?.auth?.signOut(); closeLoginModal(); }
      catch (e) { console.error('[auth] signOut failed', e); }
    }

    document.getElementById('loginModal')?.addEventListener('click', function (e) {
      if (e.target === this) closeLoginModal();
    });
    document.getElementById('logoutBtn')?.addEventListener('click', logout);

    // arriving from /fake's login button — open the login modal directly
    if (new URLSearchParams(location.search).get('login') === '1') handleLogin();

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])
      );
    }

    function showCheckEmailUI(email) {
      const card = document.querySelector('#loginModal .login-modal');
      if (!card) return;
      card.innerHTML = `
        <button class="icon-circle icon-close" type="button" onclick="closeLoginModal()" aria-label="Close"></button>
        <h2 style="margin:8px 0 10px; text-align:center;">Check your email</h2>
        <p style="font-size:14px; margin:0 0 12px; line-height:1.45; text-align:center;">
          We sent a login link to <strong>${escapeHtml(email)}</strong>.
        </p>
      `;
    }

    (function () {
      const emailInput = document.getElementById('loginEmail');
      const loginBtn   = document.getElementById('loginSubmit');
      if (!emailInput || !loginBtn) return;
      loginBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = (emailInput.value || '').trim();
        if (!email) return alert('Enter your email');
        if (!window.supa?.auth) return alert('Auth not initialized');
        loginBtn.disabled = true;
        const old = loginBtn.textContent;
        loginBtn.textContent = 'Sending…';
        const { error } = await supa.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: window.location.origin }
        });
        loginBtn.disabled    = false;
        loginBtn.textContent = old;
        if (error) alert(error.message);
        else showCheckEmailUI(email);
      });
    })();
  </script>
</body>
</html>
