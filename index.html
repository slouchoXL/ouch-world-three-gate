  <!-- Magic link processing -->
  <script>
    (async function () {
      try {
        if (window.supa && location.hash && location.hash.includes('access_token')) {
          const params = new URLSearchParams(location.hash.slice(1));
          const access_token = params.get('access_token');
          const refresh_token = params.get('refresh_token');
          const error = params.get('error');
          const error_description = params.get('error_description');
          if (error) {
            alert(`Authentication error: ${error_description || error}`);
            history.replaceState({}, '', location.pathname + location.search);
            return;
          }
          if (access_token && refresh_token) {
            const { error } = await window.supa.auth.setSession({ access_token, refresh_token });
            if (error) alert(`Session error: ${error.message}`); else window.location.reload();
          }
          history.replaceState({}, '', location.pathname + location.search);
        }
      } catch (e) { console.error('[supabase] Magic link processing failed:', e); }
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      touch-action: none;
      -ms-touch-action: none;
    }

    .container { width: 100vw; height: 100vh; position: relative; }

    :root{
      --circle: 30px;
      --circle-bg: rgba(0,0,0,0.8);
      --circle-border: rgba(255,255,255,0.25);
      --circle-border-hover: rgba(255,255,255,0.45);
      --circle-icon: 12px;
      --edge-pad-desktop: 28px;
      --edge-pad-mobile: 16px;
    }

    /* Shared circular button primitive */
    .icon-circle{
      width: var(--circle);
      height: var(--circle);
      border-radius: 50%;
      background: var(--circle-bg);
      border: 1px solid var(--circle-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: border-color .2s ease;
      backdrop-filter: blur(10px);
      pointer-events: auto; /* allow clicking */
    }
    .icon-circle:hover{ border-color: var(--circle-border-hover); }

    /* X icon (CSS-drawn) */
    .icon-close{ position: relative; }
    .icon-close::before,
    .icon-close::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 50%;
      width: var(--circle-icon);
      height: 2px;
      background: rgba(255,255,255,0.85);
      border-radius: 2px;
      transform-origin: center;
    }
    .icon-close::before{ transform: translate(-50%,-50%) rotate(45deg); }
    .icon-close::after { transform: translate(-50%,-50%) rotate(-45deg); }

    /* Top navigation */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px;
      padding-left: var(--edge-pad-desktop) !important;
      padding-right: var(--edge-pad-desktop) !important;
    }
    @media (max-width: 768px) {
      .top-nav {
        padding-left: var(--edge-pad-mobile) !important;
        padding-right: var(--edge-pad-mobile) !important;
      }
    }

    .menu-button, .login-button {
      width: 30px; height: 30px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .2s ease, background .2s ease;
    }
    .menu-button:hover, .login-button:hover { border-color: rgba(255, 255, 255, 0.45); }
    .menu-dots { display: flex; gap: 4px; }
    .dot { width: 3px; height: 3px; background: #fff; border-radius: 50%; }
    .user-icon { width: 16px; height: 16px; color: #fff; }
    .user-icon svg { width: 100%; height: 100%; fill: currentColor; }

    /* Menu tray */
    .menu-tray {
      position: fixed; top: 60px; left: 20px; width: 130px;
      background: rgba(0, 0, 0, 1); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; z-index: 200;
      transform: translateY(-20px); opacity: 0; visibility: hidden;
      transition: all .3s ease; padding: 10px 0;
    }
    .menu-tray.open { transform: translateY(0); opacity: 1; visibility: visible; }
    .menu-item {
      position: relative; display: block; width: 100%;
      padding: 6px 15px; color: #fff; text-decoration: none;
      font-size: 14px; font-weight: 300; cursor: pointer;
      background: none; border: 0;
    }
    .menu-item::before {
      content: ""; position: absolute; inset: 1px;
      left: 8px; right: 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      opacity: 0; transform: scaleY(0.96);
      transition: opacity .15s ease, transform .2s ease;
      pointer-events: none;
    }
    .menu-item:hover::before, .menu-item:focus-visible::before { opacity: 1; transform: scaleY(1); }
    .menu-item, .menu-item * { position: relative; z-index: 1; }
    .menu-item .menu-pill { background: transparent !important; padding: 0 !important; border-radius: 0 !important; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }
    .modal-overlay.show { display: flex; }

    .login-modal {
      background: rgba(15,15,15,0.95);
      border-radius: 16px;
      padding: 24px 20px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7);
      text-align: center;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "SF Pro Display", "Segoe UI", sans-serif;
      position: relative;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #loginModal .login-modal .icon-circle.icon-close{
      position: absolute;
      top: 14px;
      right: 14px;
      left: auto;
    }

    input, textarea, select { font-size: 16px; }
    button, a, .menu-button, .login-button, .icon-circle { touch-action: manipulation; }

    .form-group { margin-bottom: 12px; }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: #fff; }
    .form-input::placeholder { color: rgba(255,255,255,0.5); }

    .form-button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 999px;
      border: none;
      background: #fff;
      color: #000;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    /* Action bar (speaker + now playing) */
    .item-action-bar {
      position: fixed;
      bottom: max(60px, env(safe-area-inset-bottom) + 24px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1500;
      gap: 10px;
      pointer-events: none; /* container is inert; buttons re-enable */

    @supports not (bottom: env(safe-area-inset-bottom)) {
      .item-action-bar { bottom: 35px; }
    }

    /* Speaker icon styling */
    .icon-circle svg {
      width: 18px;
      height: 18px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-circle .icon-muted { display: none; }
    .icon-circle.is-muted .icon-sound { display: none; }
    .icon-circle.is-muted .icon-muted { display: block; }

    .now-playing{
      position: relative;
      z-index: 110;
      color: #fff;

      width: clamp(220px, 72vw, 420px);
      padding: 10px 14px;

      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      backdrop-filter: blur(10px);

      opacity: 0.88;
      pointer-events: none;

      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0; /* important for marquee */
    }

    .now-playing .np-label{
      font-weight: 700;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .now-playing .np-marquee{
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;

      -webkit-mask-image: none;
      mask-image: none;
    }

    /* only fade left edge when scrolling */
    .now-playing.is-scrolling .np-marquee{
      -webkit-mask-image: linear-gradient(to right, transparent 0px, #000 18px, #000 100%);
      mask-image: linear-gradient(to right, transparent 0px, #000 18px, #000 100%);
    }

    .now-playing .np-text{
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
    }

      .sr-only{
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0,0,0,0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }


    /* Hero layer */
    #heroLayer{

    #heroVideo{

      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms ease;
    }
    #heroLayer.is-playing #heroVideo{ opacity: 1; }

    /* Hide native controls overlays */
    #heroVideo::-webkit-media-controls,
    #heroVideo::-webkit-media-controls-panel{
      display: none !important;
      -webkit-appearance: none;
    }
  </style>
</head>

  <script>
    // ===== Menu / Modal =====
    function toggleMenu() {
      document.getElementById('menuTray')?.classList.toggle('open');
    }

    async function handleLogin() {
      const modal = document.getElementById('loginModal');
      if (!modal || !window.supa) return;

      const loggedInView = document.getElementById('accountLoggedIn');
      const loginForm    = document.getElementById('loginForm');
      const emailEl      = document.getElementById('accountEmail');

      const { data: { user } } = await window.supa.auth.getUser();

      if (user) {
        if (emailEl) emailEl.textContent = user.email || '';
        if (loggedInView) loggedInView.style.display = 'block';
        if (loginForm) loginForm.style.display = 'none';
      } else {
        if (loggedInView) loggedInView.style.display = 'none';
        if (loginForm) loginForm.style.display = 'block';
      }

      modal.classList.add('show');
    }

    function closeLoginModal() {
      document.getElementById('loginModal')?.classList.remove('show');
    }

    async function logout() {
      try {
        await window.supa?.auth?.signOut();
        closeLoginModal();
      } catch (e) {
        console.error('[auth] signOut failed', e);
      }
    }

    document.addEventListener('click', function(e) {
      const tray = document.getElementById('menuTray');
      const btn = document.querySelector('.menu-button');
      if (tray && btn && !tray.contains(e.target) && !btn.contains(e.target)) tray.classList.remove('open');
    });

    document.getElementById('loginModal')?.addEventListener('click', function(e) {
      if (e.target === this) closeLoginModal();
    });

    document.getElementById('logoutBtn')?.addEventListener('click', logout);

    // ===== Mobile zoom suppression (kept as-is) =====
    (function () {
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
    document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });
    document.addEventListener('touchstart', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function (e) { if (typeof e.scale === 'number' && e.scale !== 1) e.preventDefault(); }, { passive: false });

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m]));
    }

    function showCheckEmailUI(email) {
      const modal = document.getElementById('loginModal');
      if (!modal) return;
      const card = modal.querySelector('.login-modal');
      if (!card) return;

      card.innerHTML = `
        <button class="icon-circle icon-close" type="button" onclick="closeLoginModal()" aria-label="Close"></button>
        <h2 style="margin: 8px 0 10px; text-align:center;">Check your email</h2>
        <p style="font-size:14px; opacity:0.8; margin:0 0 12px; line-height:1.45; text-align:center;">
          We sent a login link to <strong>${escapeHtml(email)}</strong>.
        </p>
      `;

      modal.classList.add('show');
    }

    (function () {
      const emailInput = document.getElementById('loginEmail');
      const loginBtn   = document.getElementById('loginSubmit');
      if (!emailInput || !loginBtn) return;

      loginBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = (emailInput.value || '').trim();
        if (!email) return alert('Enter your email');
        if (!window.supa?.auth) return alert('Auth not initialized');

        loginBtn.disabled = true;
        const old = loginBtn.textContent;
        loginBtn.textContent = 'Sending…';

        const { error } = await supa.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: window.location.origin }
        });

        loginBtn.disabled = false;
        loginBtn.textContent = old;

        if (error) alert(error.message);
        else showCheckEmailUI(email);
      });
    })();

    // ===== Media Session (Lock Screen) =====
    function updateMediaSessionMetadata(track) {
      if (!("mediaSession" in navigator)) return;

      const title =
        track?.title ||
        document.getElementById("nowPlayingTitle")?.textContent?.trim() ||
        "OUCH™";

      const artist =
        track?.artist ||
        document.getElementById("nowPlayingArtist")?.textContent?.trim() ||
        "Sloucho";

      const art = `${location.origin}/assets/metadata.png`;

      navigator.mediaSession.metadata = new MediaMetadata({
        title,
        artist,
        album: "Discography",
        artwork: [
          { src: art, sizes: "96x96", type: "image/png" },
          { src: art, sizes: "192x192", type: "image/png" },
          { src: art, sizes: "512x512", type: "image/png" }
        ]
      });
    }

    (function () {

        { title: "Sloucho - when inches became miles", dur: 251, src: "/assets/music/Sloucho_WhenInchesBecameMiles.mp3" },

        { title: "Llainwire - Trust Fund (Sloucho Edit)", dur: 239, src: "/assets/music/Llainwire_TrustFund_SlouchoEdit.mp3" },
        { title: "Skillibeng - Coke (Sloucho Edit)", dur: 207, src: "/assets/music/Skillibeng_Coke_SlouchoEdit.mp3" },

        { title: "Sloucho - Bronze Age", dur: 191, src: "/assets/music/Sloucho_BronzeAge.mp3" },

        { title: "Sloucho - just u", dur: 201, src: "/assets/music/Sloucho_JustU.mp3" },
        { title: "Sloucho - Lights On (ft. Yamagōchi)", dur: 203, src: "/assets/music/Sloucho_LightsOn.mp3" },
        { title: "Sloucho - Make it Work", dur: 209, src: "/assets/music/Sloucho_MakeItWork.mp3" },
        { title: "Sloucho - Memory Walk", dur: 344, src: "/assets/music/Sloucho_MemoryWalk.mp3" },
        { title: "Sloucho - Mind Traveller", dur: 90, src: "/assets/music/Sloucho_MindTraveller.mp3" },
        { title: "Sloucho - Over & Out", dur: 298, src: "/assets/music/Sloucho_OverAndOut.mp3" },
        { title: "Sloucho - Power Plant (Sloucho's Memory Mix)", dur: 62, src: "/assets/music/Sloucho_PowerPlant_MemoryMix.mp3" },
      ];

      const TZ = "Europe/Dublin";
      const START_HOUR = 6;

      const totalDur = PLAYLIST.reduce((s, t) => s + (t.dur || 0), 0);
      if (!totalDur) return;

      function xmur3(str) {
        let h = 1779033703 ^ str.length;
        for (let i = 0; i < str.length; i++) {
          h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        return function () {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          return (h ^= h >>> 16) >>> 0;
        };
      }
      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6D2B79F5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function seededShuffle(arr, seedStr) {
        const seedFn = xmur3(seedStr);
        const rand = mulberry32(seedFn());
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function getTZParts(date, timeZone) {
        const dtf = new Intl.DateTimeFormat("en-GB", {
          timeZone,
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hour12: false
        });
        const parts = dtf.formatToParts(date);
        const get = (t) => parts.find(p => p.type === t)?.value;
        return {
          year: +get("year"),
          month: +get("month"),
          day: +get("day"),
          hour: +get("hour"),
          minute: +get("minute"),
          second: +get("second"),
        };
      }

      function tzLocalToUTCms({year, month, day, hour, minute, second}, timeZone) {
        const guess = Date.UTC(year, month - 1, day, hour, minute, second);
        const parts = getTZParts(new Date(guess), timeZone);
        const rendered = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
        const desired = Date.UTC(year, month - 1, day, hour, minute, second);
        const delta = desired - rendered;
        return guess + delta;
      }

      function mostRecent6amUTCms(now = new Date()) {
        const p = getTZParts(now, TZ);
        const today6 = { year: p.year, month: p.month, day: p.day, hour: START_HOUR, minute: 0, second: 0 };
        let startMs = tzLocalToUTCms(today6, TZ);
        if (now.getTime() < startMs) {
          const yesterday = new Date(startMs - 3600 * 1000);
          const yp = getTZParts(yesterday, TZ);
          const y6 = { year: yp.year, month: yp.month, day: yp.day, hour: START_HOUR, minute: 0, second: 0 };
          startMs = tzLocalToUTCms(y6, TZ);
        }
        return startMs;
      }

      function normalizeTrack(raw) {
        const full = (raw?.title || "").trim();

        // Split on FIRST " - " only
        const idx = full.indexOf(" - ");
        if (idx === -1) {
          return {
            ...raw,
            artist: raw?.artist || "Sloucho",
            title: full || "OUCH™",
          };
        }

        const artist = full.slice(0, idx).trim();
        const title = full.slice(idx + 3).trim();

        return {
          ...raw,
          artist: raw?.artist || artist || "Sloucho",
          title: title || "OUCH™",
        };
      }

      
      function dayKeyForSeed(startMs) {
        const p = getTZParts(new Date(startMs), TZ);
        return `${p.year}-${String(p.month).padStart(2,"0")}-${String(p.day).padStart(2,"0")}`;
      }

      let station = { cycleIndex: 0, order: [], trackIndex: 0 };

      let marqueeTimers = [];
      function clearMarqueeTimers(){
        marqueeTimers.forEach(t => clearTimeout(t));
        marqueeTimers = [];
      }

      function updateNowPlaying(track) {
        const runEl = document.getElementById("nowPlayingRun");
        const artistEl = document.getElementById("nowPlayingArtist");
        const titleEl = document.getElementById("nowPlayingTitle");

        const artist = track?.artist || "Sloucho";
        const title = track?.title || "OUCH™";

        // Visible run: "Artist - Song"
        if (runEl) runEl.textContent = `${artist} - ${title}`;

        // Hidden pieces for MediaSession
        if (artistEl) artistEl.textContent = artist;
        if (titleEl) titleEl.textContent = title;

        startNowPlayingMarquee();
      }


      function startNowPlayingMarquee() {
        const nowPlaying = document.getElementById("nowPlaying");
        const marquee = document.querySelector("#nowPlaying .np-marquee");
        const text = document.getElementById("nowPlayingRun");

        if (!marquee || !text || !nowPlaying) return;

        clearMarqueeTimers();
        text.style.transition = "none";
        text.style.transform = "translateX(0)";

        requestAnimationFrame(() => {
          const marqueeW = marquee.clientWidth;
          const textW = text.scrollWidth;

          if (textW <= marqueeW) {
            nowPlaying.classList.remove("is-scrolling");
            text.style.paddingRight = "0px";
            return;
          }

          nowPlaying.classList.add("is-scrolling");
          text.style.paddingRight = "24px";

          const distance = text.scrollWidth - marqueeW;
          const speed = 45;
          const duration = distance / speed;

          const loop = () => {
            text.style.transition = "none";
            text.style.transform = "translateX(0)";

            marqueeTimers.push(setTimeout(() => {
              text.style.transition = `transform ${duration}s linear`;
              text.style.transform = `translateX(-${distance}px)`;
            }, 900));

            marqueeTimers.push(setTimeout(loop, 900 + duration * 1000 + 900));
          };

          loop();
        });
      }

      async function loadAndSeek(track, offsetSec) {
        if (!track?.src) return;

        audioEl.src = track.src;
        audioEl.load();

        // If you later add track.artist to playlist items, this will "just work"
        const t = normalizeTrack(track);

        updateNowPlaying(t);
        updateMediaSessionMetadata(t);


        await new Promise((resolve) => {
          const onMeta = () => { audioEl.removeEventListener("loadedmetadata", onMeta); resolve(); };
          audioEl.addEventListener("loadedmetadata", onMeta);
        });

        const dur = audioEl.duration || track.dur || 0;
        const safe = dur ? Math.min(Math.max(0, offsetSec), Math.max(0, dur - 0.25)) : Math.max(0, offsetSec);
        try { audioEl.currentTime = safe; } catch (_) {}
      }

      function computeLivePosition() {
        const now = Date.now();
        const startMs = mostRecent6amUTCms(new Date(now));
        const dayKey = dayKeyForSeed(startMs);

        const elapsedSec = Math.floor((now - startMs) / 1000);
        const cycleIndex = Math.floor(elapsedSec / totalDur);
        let cycleOffset = elapsedSec % totalDur;
        if (cycleOffset < 0) cycleOffset += totalDur;

        const order = seededShuffle(PLAYLIST, `${dayKey}|cycle:${cycleIndex}`);

        let i = 0;
        while (i < order.length && cycleOffset >= order[i].dur) {
          cycleOffset -= order[i].dur;
          i++;
        }
        if (i >= order.length) i = 0;

        return { cycleIndex, order, trackIndex: i, offset: cycleOffset };
      }

      async function syncToLive() {
        const pos = computeLivePosition();
        station = { cycleIndex: pos.cycleIndex, order: pos.order, trackIndex: pos.trackIndex };
        await loadAndSeek(station.order[station.trackIndex], pos.offset);
      }

      async function playNext() {
        station.trackIndex++;
        if (station.trackIndex >= station.order.length) {
          station.cycleIndex++;
          const startMs = mostRecent6amUTCms(new Date());
          const dayKey = dayKeyForSeed(startMs);
          station.order = seededShuffle(PLAYLIST, `${dayKey}|cycle:${station.cycleIndex}`);
          station.trackIndex = 0;
        }
        await loadAndSeek(station.order[station.trackIndex], 0);
        try { await audioEl.play(); } catch (_) {}
      }

      audioEl.addEventListener("ended", playNext);

      audioEl.addEventListener("play", () => {
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
        updateMediaSessionMetadata(station?.order?.[station?.trackIndex]);
      });

      audioEl.addEventListener("playing", () => {
        updateMediaSessionMetadata(station?.order?.[station?.trackIndex]);
        if ("mediaSession" in navigator && typeof navigator.mediaSession.setPositionState === "function") {
          const t = station?.order?.[station?.trackIndex];
          const dur = audioEl.duration || t?.dur || 0;
          if (dur) {
            navigator.mediaSession.setPositionState({
              duration: dur,
              playbackRate: audioEl.playbackRate || 1,
              position: audioEl.currentTime || 0,
            });
          }
        }
      });

      audioEl.addEventListener("pause", () => {
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
      });

      // Autoplay muted unlock logic
      audioEl.muted = true;
      audioEl.setAttribute("muted", "");
      btn.classList.add("is-muted");
      btn.setAttribute("aria-label", "Unmute audio");

      let started = false;

      async function tryPlayMuted() {
        if (started || !audioEl.paused) { started = true; return; }
        try {
          await audioEl.play();
          started = true;
          removeUnlockers();
        } catch (_) {}
      }

      function unlock() { tryPlayMuted(); }

      function addUnlockers() {
        window.addEventListener("pointerdown", unlock, { capture: true, once: true });
        window.addEventListener("mousedown",   unlock, { capture: true, once: true });
        window.addEventListener("touchstart",  unlock, { capture: true, once: true });
        window.addEventListener("keydown",     unlock, { capture: true, once: true });
        window.addEventListener("wheel",       unlock, { capture: true, once: true });
        window.addEventListener("scroll",      unlock, { capture: true, once: true });
      }

      function removeUnlockers() {
        window.removeEventListener("pointerdown", unlock, { capture: true });
        window.removeEventListener("mousedown",   unlock, { capture: true });
        window.removeEventListener("touchstart",  unlock, { capture: true });
        window.removeEventListener("keydown",     unlock, { capture: true });
        window.removeEventListener("wheel",       unlock, { capture: true });
        window.removeEventListener("scroll",      unlock, { capture: true });
      }

      syncToLive().then(() => {
        tryPlayMuted();
        audioEl.addEventListener("canplay", tryPlayMuted);
        window.addEventListener("load", tryPlayMuted, { once: true });
        addUnlockers();
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) syncToLive();
      });

      btn.addEventListener("click", async () => {
        const willMute = !audioEl.muted;

        audioEl.muted = willMute;
        btn.classList.toggle("is-muted", willMute);
        btn.setAttribute("aria-label", willMute ? "Unmute audio" : "Mute audio");

        if (!willMute) {
          updateMediaSessionMetadata(station?.order?.[station?.trackIndex]);
          try { await audioEl.play(); } catch (_) {}
        }
      });
    })();

    // ===== HERO VIDEO AUTOPLAY (single controller) =====
    (() => {
      const v = document.getElementById("heroVideo");
      const layer = document.getElementById("heroLayer");
      if (!v) return;

      v.muted = true;
      v.defaultMuted = true;

      function showVideo() {
        layer?.classList.add("is-playing");
      }

      let unlocked = false;

      async function attemptPlay(tag) {
        try {
          const p = v.play();
          if (p && p.then) await p;

          if (!v.paused) {
            showVideo();
            unlocked = true;
            removeUnlockers();
            return true;
          }
          return false;
        } catch (e) {
          if (e?.name !== "NotAllowedError") console.warn("[hero] play failed:", e);
          return false;
        }
      }

      const unlockEvents = ["pointerdown", "mousedown", "touchstart", "keydown", "wheel"];
      const onGesture = async (ev) => {
        if (unlocked) return;
        await attemptPlay(`gesture:${ev.type}`);
      };

      function addUnlockers() {
        unlockEvents.forEach(ev =>
          window.addEventListener(ev, onGesture, { capture: true })
        );
      }
      function removeUnlockers() {
        unlockEvents.forEach(ev =>
          window.removeEventListener(ev, onGesture, { capture: true })
        );
      }

      addUnlockers();

      window.addEventListener("load", async () => {
        await attemptPlay("window.load");
      }, { once: true });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && !unlocked) attemptPlay("visibility");
      });
    })();
  </script>
