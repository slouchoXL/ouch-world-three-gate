  <script>
    (async function () {
      try {
        if (window.supa && location.hash && location.hash.includes('access_token')) {
          const params = new URLSearchParams(location.hash.slice(1));
          const access_token = params.get('access_token');
          const refresh_token = params.get('refresh_token');
          const error = params.get('error');
          const error_description = params.get('error_description');
          if (error) {
            alert(`Authentication error: ${error_description || error}`);
            history.replaceState({}, '', location.pathname + location.search);
            return;
          }
          if (access_token && refresh_token) {
            const { error } = await window.supa.auth.setSession({ access_token, refresh_token });
            if (error) alert(`Session error: ${error.message}`); else window.location.reload();
          }
          history.replaceState({}, '', location.pathname + location.search);
        }
      } catch (e) { console.error('[supabase] Magic link processing failed:', e); }
    })();

<script>
  // ===== Globals =====
  let scene, camera, renderer;
  let raycaster, mouseNDC, hoverActive = false, lastHoverState = false, hoverLight = null;
  let gltfLoader, dracoLoader;
  let currentModel = null, currentMixer = null, loadVersion = 0;
  const clock = new THREE.Clock();

  // [CAROUSEL] state
  const carousel = {
    mode: 'view',
    cache: [],
    mixers: [],
    preloadComplete: false
  };

  // expose for other code
  window.scene = null; window.camera = null; window.renderer = null; window.character = null;
  window.currentCharacterIndex = 0;

  function initLoaders() {
    gltfLoader = new THREE.GLTFLoader();
    dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    gltfLoader.setDRACOLoader(dracoLoader);
  }

  window.characterConfigs = [
    { name: "Sloucho", status: "Unlocked", url: "/assets/models/sloucho.glb", targetHeight: 1.4, y: 0.08, scaleMul: 0.6, trimStart: 1.5, trimEnd: 2.0 },
    { name: "Rás",     status: "Unlocked", url: "/assets/models/ras.glb",     targetHeight: 1.4, y: 0.05, scaleMul: 0.6, trimStart: 0.12, trimEnd: 0.10 },
    { name: "Super Maramu 2000", status: "Unlocked", url: "/assets/models/super-maramu.glb", targetHeight: 1.4, y: -0.15, scaleMul: 0.5, trimStart: 0.12, trimEnd: 0.10 }
  ];

  // ===== PRELOADING SYSTEM =====
  function showLoading() {
    const indicator = document.getElementById('loadingIndicator');
    if (indicator) {
      indicator.style.display = 'block';
      indicator.style.opacity = '1';
    }
  }

  function hideLoading() {
    const indicator = document.getElementById('loadingIndicator');
    if (indicator) {
      indicator.style.opacity = '0';
      setTimeout(() => { indicator.style.display = 'none'; }, 300);
    }
  }

  // NOTE: updateLoadingProgress() isn't included in your snippet, leaving as-is.

  function preloadAllCharacters() {
    if (carousel.preloadComplete) {
      console.log('✅ Characters already preloaded');
      return Promise.resolve();
    }

    const configs = window.characterConfigs || [];
    if (configs.length === 0) return Promise.resolve();

    console.log('🚀 Starting character preload...');
    showLoading();
    updateLoadingProgress(0, configs.length);

    const loadPromises = configs.map((config, index) => {
      return loadCharacterToCache(index).then(() => {
        updateLoadingProgress(index + 1, configs.length);
        console.log(`✅ Preloaded: ${config.name} (index: ${index})`);
      }).catch(err => {
        console.error(`❌ Failed to preload ${config.name}:`, err);
        updateLoadingProgress(index + 1, configs.length);
      });
    });

    return Promise.all(loadPromises).then(() => {
      carousel.preloadComplete = true;
      hideLoading();
      console.log('🎉 All characters preloaded! Cache state:', carousel.cache.length);
      carousel.cache.forEach((entry, i) => {
        if (entry) {
          const hasAnims = entry.gltfData && entry.gltfData.animations && entry.gltfData.animations.length > 0;
          console.log(`Cache[${i}]: ${entry.config.name}, has animations: ${hasAnims}`);
        }
      });
    }).catch(err => {
      console.error('Preloading failed:', err);
      hideLoading();
    });
  }

  function loadCharacterToCache(index) {
    const config = window.characterConfigs[index];
    if (!config || carousel.cache[index]) return Promise.resolve();

    return new Promise((resolve, reject) => {
      gltfLoader.load(
        config.url,
        (gltf) => {
          carousel.cache[index] = { gltfData: gltf, config: config, targetHeight: config.targetHeight ?? 1.4 };
          console.log(`Cached GLTF data for ${config.name}`);
          resolve();
        },
        undefined,
        (error) => {
          console.error(`Failed to load ${config.url}:`, error);
          reject(error);
        }
      );
    });
  }

  function getCharacterFromCache(index) {
    return carousel.cache[index] || null;
  }

  window.createCharacter = function() {
    if (!window.scene) { console.error('Scene not ready'); return; }

    if (currentMixer) {
      try { currentMixer.stopAllAction(); currentMixer.uncacheRoot(currentModel); } catch(e) {}
      currentMixer = null;
    }

    if (currentModel) {
      scene.remove(currentModel);
      if (!isFromCache(currentModel)) disposeObject(currentModel);
      currentModel = null;
    }

    if (window.character && window.character !== currentModel) {
      try { scene.remove(window.character); } catch {}
      window.character = null;
    }

    const index = window.currentCharacterIndex ?? 0;
    const cached = getCharacterFromCache(index);
    if (cached) {
      console.log(`📦 Loading ${cached.config.name} from cache...`);
      loadFromCache(index, cached);
      return;
    }

    console.log(`⏳ Loading ${window.characterConfigs[index]?.name} directly...`);
    loadCharacterDirectly();
  };

  function isFromCache(model) {
    return model && model.userData && model.userData.fromCache === true;
  }

  function loadFromCache(index, cached) {
    const { gltfData, config, targetHeight } = cached;

    const root = gltfData.scene || gltfData.scenes?.[0];
    if (!root) { console.error('No scene in cached GLTF data'); return; }

    if (root.parent) root.parent.remove(root);

    if (!root.userData.processed) {
      centerAndScaleToHeight(root, targetHeight);
      if (config.scaleMul) root.scale.multiplyScalar(config.scaleMul);

      root.userData = root.userData || {};
      if (config.y != null && !root.userData.yApplied) {
        root.position.y += config.y;
        root.userData.yApplied = true;
      }
      root.userData.baseY = root.position.y;

      root.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
          obj.raycast = THREE.Mesh.prototype.raycast;
          obj.frustumCulled = false;

          const storeMaterial = (material) => {
            if (!material) return;
            material.userData = material.userData || {};
            if ('emissive' in material && !material.userData._origEmissive) {
              material.userData._origEmissive = material.emissive.clone();
            }
          };

          if (Array.isArray(obj.material)) obj.material.forEach(storeMaterial);
          else storeMaterial(obj.material);
        }
      });

      root.updateMatrixWorld(true);
      root.userData.processed = true;
    }

    root.userData.fromCache = true;
    root.visible = true;

    let freshMixer = null;
    if (gltfData.animations && gltfData.animations.length) {
      freshMixer = new THREE.AnimationMixer(root);
      const clips = gltfData.animations;
      const baseClip = THREE.AnimationClip.findByName(clips, 'Idle') ||
                       THREE.AnimationClip.findByName(clips, 'idle') ||
                       clips[0];

      if (baseClip) {
        const trimStart = Math.max(0, config.trimStart ?? 1.5);
        const trimEnd = Math.max(0, config.trimEnd ?? 2.0);
        const minDur = 0.05;
        const startSec = Math.min(trimStart, Math.max(0, baseClip.duration - minDur));
        const endSec = Math.max(baseClip.duration - trimEnd, startSec + minDur);
        const fps = 30;
        const startFrame = Math.max(0, Math.floor(startSec * fps));
        const endFrame = Math.max(startFrame + 1, Math.ceil(endSec * fps));

        const trimmedClip = THREE.AnimationUtils.subclip(
          baseClip,
          `${baseClip.name}_${index}_${Date.now()}`,
          startFrame, endFrame, fps
        );

        const action = freshMixer.clipAction(trimmedClip);
        action.setLoop(THREE.LoopPingPong, Infinity);
        action.reset();
        action.setEffectiveWeight(1);
        action.play();
        action.time = 1/60;
        freshMixer.update(0);
      }
    }

    scene.add(root);
    currentModel = root;
    currentMixer = freshMixer;
    window.character = root;

    frameCameraOnTargetHeight(camera, targetHeight, 1.4, 0.2);
    window.updateCharacterInfo();
  }

  function loadCharacterDirectly() {
    const list = window.characterConfigs || [];
    const idx = (window.currentCharacterIndex ?? 0) % (list.length || 1);
    const cfg = list[idx];
    if (!cfg || !cfg.url) return;

    const myVersion = ++loadVersion;
    gltfLoader.load(
      cfg.url,
      (gltf) => {
        if (myVersion !== loadVersion) { if (gltf.scene) disposeObject(gltf.scene); return; }
        const root = gltf.scene || gltf.scenes?.[0];
        if (!root) return;

        const targetHeight = cfg.targetHeight ?? 1.8;

        centerAndScaleToHeight(root, targetHeight);
        if (cfg.scaleMul) root.scale.multiplyScalar(cfg.scaleMul);

        root.userData = root.userData || {};
        if (cfg.y != null && !root.userData.yApplied) {
          root.position.y += cfg.y;
          root.userData.yApplied = true;
        }
        root.userData.baseY = root.position.y;

        root.traverse((o) => {
          if (!o.isMesh) return;

          o.castShadow = true;
          o.receiveShadow = true;
          o.raycast = THREE.Mesh.prototype.raycast;
          o.frustumCulled = false;

          const store = (m) => {
            if (!m) return;
            m.userData = m.userData || {};
            if ('emissive' in m && !m.userData._origEmissive) {
              m.userData._origEmissive = m.emissive.clone();
            }
          };
          if (Array.isArray(o.material)) o.material.forEach(store);
          else store(o.material);
        });

        root.updateMatrixWorld(true);

        if (gltf.animations && gltf.animations.length) {
          currentMixer = new THREE.AnimationMixer(root);
          const clips = gltf.animations;
          const baseClip = THREE.AnimationClip.findByName(clips, 'Idle') ||
                           THREE.AnimationClip.findByName(clips, 'idle') ||
                           clips[0];

          const trimStart = Math.max(0, cfg.trimStart ?? 1.5);
          const trimEnd   = Math.max(0, cfg.trimEnd   ?? 2.0);
          const minDur = 0.05;
          const startSec = Math.min(trimStart, Math.max(0, baseClip.duration - minDur));
          const endSec   = Math.max(baseClip.duration - trimEnd, startSec + minDur);
          const fps = 30;
          const startFrame = Math.max(0, Math.floor(startSec * fps));
          const endFrame   = Math.max(startFrame + 1, Math.ceil(endSec * fps));

          const sub = THREE.AnimationUtils.subclip(
            baseClip,
            (baseClip.name || 'clip') + '_trim',
            startFrame, endFrame, fps
          );

          const action = currentMixer.clipAction(sub);
          action.setLoop(THREE.LoopPingPong, Infinity).reset().setEffectiveWeight(1).play();
          action.time = 1/60;
          currentMixer.update(0);
        } else {
          currentMixer = null;
        }

        scene.add(root);
        currentModel = root;
        window.character = root;

        frameCameraOnTargetHeight(camera, targetHeight, 1.4, 0.2);
        window.updateCharacterInfo?.();
      },
      undefined,
      (err) => console.error('GLB load error for', cfg.url, err)
    );
  }

  function centerAndScaleToHeight(root, targetHeight = 1.8) {
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    root.position.sub(center);
    root.position.y += targetHeight * 0.5;
    const h = Math.max(size.y, 1e-6);
    const s = targetHeight / h;
    root.scale.multiplyScalar(s);
  }

  function frameCameraOnTargetHeight(camera, targetHeight = 1.8, pad = 1.4, centerYFactor = 0.2) {
    const fovRad = (camera.fov * Math.PI) / 180;
    const halfH  = (targetHeight * pad) / 2;
    const dist   = halfH / Math.tan(fovRad / 2);
    const cy = targetHeight * centerYFactor;
    camera.position.set(0, cy, dist);
    camera.lookAt(0, cy, 0);
    camera.updateProjectionMatrix();
  }

  function tickAnimations() {
    const dt = Math.min(clock.getDelta(), 0.033);
    if (currentMixer) {
      try { currentMixer.update(dt); } catch(e) {}
    }
  }

  let simpleSwipe = { active: false, startX: 0, threshold: 50 };

  function attachSimpleSwipeInput() {
    if (simpleSwipe.active || !renderer) return;
    const dom = renderer.domElement;
    simpleSwipe.active = true;

    function onStart(e) { simpleSwipe.startX = e.touches ? e.touches[0].clientX : e.clientX; }
    function onEnd(e) {
      const endX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const deltaX = endX - simpleSwipe.startX;
      if (Math.abs(deltaX) > simpleSwipe.threshold) {
        if (deltaX > 0) window.previousCharacter();
        else window.nextCharacter();
      }
    }

    dom.addEventListener('touchstart', onStart);
    dom.addEventListener('touchend', onEnd);
    dom.addEventListener('mousedown', onStart);
    dom.addEventListener('mouseup', onEnd);

    simpleSwipe.handlers = { onStart, onEnd, dom };
  }

  function detachSimpleSwipeInput() {
    if (!simpleSwipe.active || !simpleSwipe.handlers) return;
    const { onStart, onEnd, dom } = simpleSwipe.handlers;

    dom.removeEventListener('touchstart', onStart);
    dom.removeEventListener('touchend', onEnd);
    dom.removeEventListener('mousedown', onStart);
    dom.removeEventListener('mouseup', onEnd);

    simpleSwipe.active = false;
    simpleSwipe.handlers = null;
  }

  function disposeObject(obj) {
    obj?.traverse?.((node) => {
      if (node.isMesh) {
        node.geometry?.dispose?.();
        const mat = node.material;
        if (Array.isArray(mat)) {
          mat.forEach(m => {
            m.map?.dispose?.(); m.normalMap?.dispose?.(); m.roughnessMap?.dispose?.();
            m.metalnessMap?.dispose?.(); m.emissiveMap?.dispose?.(); m.dispose?.();
          });
        } else if (mat) {
          mat.map?.dispose?.(); mat.normalMap?.dispose?.(); mat.roughnessMap?.dispose?.();
          mat.metalnessMap?.dispose?.(); mat.emissiveMap?.dispose?.(); mat.dispose?.();
        }
      }
    });
  }

  function animate() {

  let clickPreventUntil = 0;

  function onCanvasClick(e) {
    if (performance.now() < clickPreventUntil) return;

    if (carousel && carousel.mode === 'carousel') {
      const cfg = window.characterConfigs?.[window.currentCharacterIndex];
      if (cfg && cfg.status !== 'Locked') exitCarousel(true);
      return;
    }

    const root = currentModel || window.character;
    if (!root || !camera || !renderer) return;

    root.updateMatrixWorld(true);

    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );

    raycaster.setFromCamera(ndc, camera);

    const hits = raycaster.intersectObject(root, true);
    if (hits.length > 0) {
      window.onCharacterClick();
      return;
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function onMouseMove(e) {
    mouseNDC.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    if (carousel.mode === 'carousel') return;
    checkHover();
  }

  function checkHover() {
    const root = currentModel || window.character;
    if (!root || !camera || !renderer) return;

    if (carousel.mode !== 'view') {
      renderer.domElement.style.cursor = 'default';
      if (lastHoverState) { setCharacterHighlight(false); lastHoverState = false; }
      return;
    }

    raycaster.setFromCamera(mouseNDC, camera);
    const hits = raycaster.intersectObject(root, true);
    const isOverCharacterMesh = hits.length > 0;

    if (isOverCharacterMesh !== lastHoverState) {
      setCharacterHighlight(isOverCharacterMesh);
      lastHoverState = isOverCharacterMesh;
    }
  }

  function setCharacterHighlight(active) {
    if (!window.scene || !window.character || !renderer) return;

  /* ============================================================
     HERO VIDEO AUTOPLAY (single controller)
     - Removed the diagnostic logger (it was calling v.play() again)
     - Only one autoplay controller exists now
     - NEVER calls video.load()
     ============================================================ */
  

  (function () {
    const layer = document.getElementById("heroLayer");
    const v = document.getElementById("heroVideo");
    if (!layer || !v) return;

    // autoplay-friendly state
    v.muted = true;
    v.defaultMuted = true;
    v.autoplay = true;
    v.playsInline = true;

    v.setAttribute("muted", "");
    v.setAttribute("autoplay", "");
    v.setAttribute("playsinline", "");
    v.setAttribute("webkit-playsinline", "");

    v.disablePictureInPicture = true;
    v.controls = false;

    let started = false;

    function markPlaying() {
      if (started) return;
      started = true;
      layer.classList.add("is-playing"); // fades video in over poster
      removeUnlockers();
    }

    async function tryPlay() {
      if (started) return;

      try {
        const p = v.play(); // call play() even if readyState is low
        if (p && p.then) await p;
        if (!v.paused) markPlaying();
      } catch (e) {
        // keep unlockers; we’ll try again on next gesture / canplay
      }
    }

    const unlockEvents = ["pointerdown", "mousedown", "touchstart", "keydown"];

    function addUnlockers() {
      unlockEvents.forEach(ev =>
        window.addEventListener(ev, tryPlay, { capture: true }) // no once:true
      );
    }

    function removeUnlockers() {
      unlockEvents.forEach(ev =>
        window.removeEventListener(ev, tryPlay, { capture: true })
      );
    }

    // authoritative signal
    v.addEventListener("playing", markPlaying, { once: true });

    // keep retrying as the video becomes playable
    v.addEventListener("loadeddata", tryPlay);
    v.addEventListener("canplay", tryPlay);
    v.addEventListener("canplaythrough", tryPlay);

    addUnlockers();

    // initial attempt
    tryPlay();
    window.addEventListener("load", tryPlay, { once: true });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tryPlay(); });
  })();

          duration: Number.isFinite(v.duration) ? v.duration.toFixed(3) : v.duration,
          readyState: rsName(v.readyState),
          networkState: nsName(v.networkState),
          autoplay: v.autoplay,
          playsInline: v.playsInline,
          preload: v.preload,
          videoW: v.videoWidth,
          videoH: v.videoHeight
        };
        return s;
      }

      function line(msg, obj) {
        const div = document.createElement("div");
        div.style.cssText = "margin:0 0 6px 0; white-space:pre-wrap;";
        div.textContent = `[${now()}] ${msg}` + (obj ? `\n${JSON.stringify(obj, null, 2)}` : "");
        logEl.prepend(div);
      }

      function setMeta() {
        const s = snapshot("meta");
        metaEl.textContent = `src=${s.src || "(none)"} | ${s.readyState} | ${s.networkState} | paused=${s.paused} | muted=${s.muted} | t=${s.currentTime}/${s.duration}`;
      }

      // keep meta updated
      setInterval(setMeta, 500);

      // ---------- IMPORTANT: show errors ----------
      function mediaErrorDetails() {
        const e = v.error;
        if (!e) return null;
        // MediaError codes:
        // 1 = MEDIA_ERR_ABORTED
        // 2 = MEDIA_ERR_NETWORK
        // 3 = MEDIA_ERR_DECODE
        // 4 = MEDIA_ERR_SRC_NOT_SUPPORTED
        return { code: e.code, message: e.message || null };
      }

      // ---------- LOG ALL VIDEO EVENTS ----------
      const events = [
        "loadstart","durationchange","loadedmetadata","loadeddata",
        "progress","canplay","canplaythrough",
        "play","playing","pause","waiting","stalled","suspend",
        "seeking","seeked","timeupdate","ended",
        "ratechange","volumechange",
        "error","emptied","abort"
      ];

      events.forEach(ev => {
        v.addEventListener(ev, () => {
          const err = (ev === "error") ? mediaErrorDetails() : null;
          line(`event: ${ev}`, { ...snapshot(ev), error: err });
        });
      });

      // ---------- LOG PROMISE REJECTIONS ----------
      window.addEventListener("unhandledrejection", (e) => {
        line("unhandledrejection", { reason: String(e.reason) });
      });

      // ---------- LOG NETWORK / RESOURCE ----------
      // fetch HEAD-ish info (won't violate CORS for same-origin; for cross-origin it may fail)
      async function probeUrl(url) {
        try {
          const res = await fetch(url, { method: "GET", mode: "cors" });
          line("probe fetch() ok", {
            status: res.status,
            contentType: res.headers.get("content-type"),
            acceptRanges: res.headers.get("accept-ranges"),
            contentLength: res.headers.get("content-length"),
            url: res.url
          });
        } catch (e) {
          line("probe fetch() failed", { error: String(e) });
        }
      }

      // ---------- PLAY ATTEMPTS ----------
      async function tryPlay(tag) {
        line(`tryPlay(${tag})`, snapshot("before-play"));

        // make sure autoplay policy requirements are met
        v.muted = true;
        v.defaultMuted = true;
        v.setAttribute("muted", "");
        v.playsInline = true;
        v.setAttribute("playsinline", "");
        v.setAttribute("webkit-playsinline", "");

        // IMPORTANT: ensure it's not accidentally display:none / zero-sized
        const rect = v.getBoundingClientRect();
        line("layout check", { rect, computedDisplay: getComputedStyle(v).display, opacity: getComputedStyle(v).opacity });

        try {
          const p = v.play();
          if (p && p.then) await p;
          line(`play() resolved (${tag})`, snapshot("after-play"));
          if (layer) layer.classList.add("is-playing");
        } catch (e) {
          // This is where Chrome desktop usually tells the truth (NotAllowedError / NotSupportedError / AbortError)
          line(`play() REJECTED (${tag})`, { error: String(e), name: e?.name, ...snapshot("play-rejected"), mediaError: mediaErrorDetails() });
        }
      }

      btnTry.onclick = () => tryPlay("button");
      btnMute.onclick = () => { v.muted = !v.muted; line("toggle muted", snapshot("toggle-muted")); };

      // ---------- STARTUP / GESTURE HOOKS ----------
      // Keep gesture hooks until we see "playing"
      let started = false;
      function onPlaying() {
        started = true;
        line("== playing confirmed ==", snapshot("playing-confirmed"));
        unlockEvents.forEach(ev => window.removeEventListener(ev, onGesture, { capture: true }));
      }
      v.addEventListener("playing", onPlaying);

      const unlockEvents = ["pointerdown","mousedown","touchstart","keydown"];
      function onGesture(ev) {
        if (started) return;
        line(`gesture: ${ev.type}`, snapshot("gesture"));
        tryPlay(`gesture:${ev.type}`);
      }
      unlockEvents.forEach(ev => window.addEventListener(ev, onGesture, { capture: true }));

      // Probe the actual resolved URL once available
      // currentSrc is often empty until loadstart, so run both now and after metadata
      if (v.src) probeUrl(v.src);
      v.addEventListener("loadedmetadata", () => {
        const url = v.currentSrc || v.src;
        if (url) probeUrl(url);
      }, { once: true });

      // initial attempt
      tryPlay("init");
      window.addEventListener("load", () => tryPlay("window.load"), { once: true });
      document.addEventListener("visibilitychange", () => { if (!document.hidden) tryPlay("visibility"); });

    })();
 



 

</script>
