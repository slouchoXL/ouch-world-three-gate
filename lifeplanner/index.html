<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Planner</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#ffffff; --surface-2:#fcfcfb;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --line:#e6e5df; --line-strong:#d8d7cf;
  --accent:#2a78d6;
  --inquiry:#c58a12; --inquiry-bg:#fdf3dc;
  --confirmed:#2a78d6; --confirmed-bg:#e4eefb;
  --fulfilled:#0a8a0a; --fulfilled-bg:#e2f3e2;
  --good:#0a8a0a; --bad:#d03b3b;
  --good-bg:#e2f3e2; --bad-bg:#fbe4e4;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 4px 16px rgba(11,11,11,.05);
  --radius:12px;
}
:root[data-theme="dark"], :root:not([data-theme="light"]) [data-auto-dark]{}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#201f1e;
    --ink:#f4f4f0; --ink-2:#c3c2b7; --muted:#8f8e87;
    --line:#2c2c2a; --line-strong:#3a3a37;
    --inquiry:#e0a83a; --inquiry-bg:#38300f;
    --confirmed:#3987e5; --confirmed-bg:#12233a;
    --fulfilled:#39b539; --fulfilled-bg:#12331a;
    --good:#39b539; --bad:#e66767;
    --good-bg:#12331a; --bad-bg:#3a1717;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#201f1e;
  --ink:#f4f4f0; --ink-2:#c3c2b7; --muted:#8f8e87;
  --line:#2c2c2a; --line-strong:#3a3a37;
  --inquiry:#e0a83a; --inquiry-bg:#38300f;
  --confirmed:#3987e5; --confirmed-bg:#12233a;
  --fulfilled:#39b539; --fulfilled-bg:#12331a;
  --good:#39b539; --bad:#e66767;
  --good-bg:#12331a; --bad-bg:#3a1717;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
a{color:var(--accent)}

/* ---------- top bar ---------- */
header.app{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);
}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--accent)}
nav.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
nav.tabs button{
  border:0;background:transparent;color:var(--ink-2);padding:6px 14px;border-radius:7px;font-weight:600;
}
nav.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.iconbtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;
}
.iconbtn:hover{color:var(--ink);border-color:var(--line-strong)}

main{max-width:1180px;margin:0 auto;padding:20px 18px 80px}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 10px;border-radius:8px;font-size:13px}
.btn.danger{color:var(--bad);border-color:transparent}
.btn.danger:hover{background:var(--bad-bg)}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:5px 12px;border-radius:6px;font-weight:600}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.navbtns{display:flex;gap:4px;align-items:center}
h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 12px;font-weight:700}
.title-lg{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}

/* ---------- calendar: year ---------- */
.year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:980px){.year-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.year-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.year-grid{grid-template-columns:1fr}}
.month-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-height:150px}
.month-card.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mc-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 6px;cursor:pointer}
.mc-head:hover .mc-name{color:var(--accent)}
.mc-name{font-weight:700;font-size:14px}
.mc-net{font-size:12px;font-weight:700}
.mc-body{padding:2px 8px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.chip{
  display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:7px;font-size:12px;
  border:1px solid transparent;cursor:pointer;line-height:1.25;
}
.chip:hover{filter:brightness(.98);border-color:var(--line-strong)}
.chip .cdate{font-weight:700;width:22px;flex:none;color:var(--ink-2)}
.chip .ctitle{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cfee{font-weight:700;flex:none}
.chip.inquiry{background:var(--inquiry-bg);color:var(--inquiry)}
.chip.confirmed{background:var(--confirmed-bg);color:var(--confirmed)}
.chip.fulfilled{background:var(--fulfilled-bg);color:var(--fulfilled)}
.chip .paiddot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.mc-empty{color:var(--muted);font-size:12px;padding:8px 4px}
.mc-more{color:var(--muted);font-size:11px;padding:2px 4px;cursor:pointer}
.mc-foot{border-top:1px solid var(--line);padding:6px 12px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* ---------- calendar: month grid ---------- */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow span{font-size:11px;font-weight:700;color:var(--muted);text-align:left;padding-left:4px;text-transform:uppercase;letter-spacing:.04em}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:104px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.day:hover{border-color:var(--line-strong)}
.day.out{background:var(--surface-2);opacity:.55}
.day.today{border-color:var(--accent)}
.day.today .dnum{background:var(--accent);color:#fff}
.dnum{font-size:12px;font-weight:700;color:var(--ink-2);width:22px;height:22px;display:grid;place-items:center;border-radius:6px}
.day .chip{padding:2px 5px}
.addhint{position:absolute;right:6px;top:6px;color:var(--muted);opacity:0;font-size:16px;font-weight:700}
.day:hover .addhint{opacity:1}

/* ---------- finances ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{padding:15px 16px}
.tile .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.tile .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.tile .sub{font-size:12px;color:var(--ink-2);margin-top:3px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.acct-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.acct-row{grid-template-columns:1fr}}
.acct{padding:15px 16px;display:flex;flex-direction:column;gap:2px}
.acct .an{font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.acct .ab{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.acct .ameta{font-size:11px;color:var(--muted);margin-top:4px}

table.fin{width:100%;border-collapse:collapse;font-size:13px}
table.fin th,table.fin td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
table.fin th:first-child,table.fin td:first-child{text-align:left}
table.fin thead th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;border-bottom:1px solid var(--line-strong)}
table.fin tbody tr:hover{background:var(--surface-2)}
table.fin tr.now td{background:var(--confirmed-bg)}
table.fin tr.now td:first-child{font-weight:700}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.tag.inquiry{background:var(--inquiry-bg);color:var(--inquiry)}
.tag.confirmed{background:var(--confirmed-bg);color:var(--confirmed)}
.tag.fulfilled{background:var(--fulfilled-bg);color:var(--fulfilled)}

.todo{display:flex;flex-direction:column}
.todo-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.todo-item:last-child{border-bottom:0}
.todo-item .ti-main{flex:1;min-width:0}
.todo-item .ti-t{font-weight:600}
.todo-item .ti-s{font-size:12px;color:var(--muted)}
.todo-item .ti-amt{font-weight:700;font-size:15px}
.empty{color:var(--muted);padding:24px 14px;text-align:center}

.week-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.task-item{display:flex;align-items:center;gap:13px;padding:11px 14px;border-bottom:1px solid var(--line)}
.task-item:last-child{border-bottom:0}
.task-item .tt{font-weight:500}
.task-item.done .tt{color:var(--muted);text-decoration:line-through}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);display:grid;place-items:center;cursor:pointer;flex:none;color:#fff;font-size:13px;font-weight:700;transition:background .12s,border-color .12s}
.check:hover{border-color:var(--muted)}
.check.on{background:var(--good);border-color:var(--good)}
.task-item .del-task{opacity:0;border:0;background:transparent}
.task-item:hover .del-task{opacity:1}
.task-item .del-task:hover{color:var(--bad)}

.bars{display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.bar-row{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px}
.bar-lab{font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-lab .sw{width:11px;height:11px;border-radius:3px;flex:none}
.bar-track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-val{font-weight:700;font-size:13px;white-space:nowrap}

/* ---------- settings ---------- */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.settings-grid{grid-template-columns:1fr}}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .lr-main{flex:1;min-width:0}
.list-row .lr-t{font-weight:600}
.list-row .lr-s{font-size:12px;color:var(--muted)}
.card-pad{padding:16px}
.card-pad h3{margin:0 0 4px;font-size:15px}
.card-pad .hint{color:var(--muted);font-size:12px;margin:0 0 14px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,11,11,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.scrim.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:460px;overflow:hidden}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:13px}
.modal-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);
  padding:9px 11px;border-radius:9px;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.statusseg{display:flex;gap:6px}
.statusseg button{flex:1;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2);padding:8px;border-radius:9px;font-weight:600}
.statusseg button.active[data-st="inquiry"]{background:var(--inquiry-bg);border-color:var(--inquiry);color:var(--inquiry)}
.statusseg button.active[data-st="confirmed"]{background:var(--confirmed-bg);border-color:var(--confirmed);color:var(--confirmed)}
.statusseg button.active[data-st="fulfilled"]{background:var(--fulfilled-bg);border-color:var(--fulfilled);color:var(--fulfilled)}
.checkline{display:flex;align-items:center;gap:9px;padding:2px 0}
.checkline input{width:auto}
.paidbox{border:1px dashed var(--line-strong);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:11px}
.muted-note{font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.exp-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
.g-net-wrap{font-size:12px;color:var(--ink-2)}
.g-net-wrap b{font-variant-numeric:tabular-nums}
#g-exps{display:flex;flex-direction:column;gap:9px}
.exp-item{border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.exp-top{display:grid;grid-template-columns:1fr 92px 32px;gap:8px;align-items:center}
.exp-bot{display:flex;align-items:center;gap:14px}
.exp-item input,.exp-item select{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:7px 9px;border-radius:8px;width:100%}
.exp-item .checkline{white-space:nowrap}
.exp-item .checkline input{width:auto}
.exp-bot select{max-width:150px}
.src-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.src-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2);padding:4px 9px;border-radius:20px;font-size:12px;font-weight:600}
.src-chip:hover{color:var(--ink);border-color:var(--muted)}
.src-chip .sw{width:9px;height:9px;border-radius:3px;flex:none}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 18px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);opacity:0;transition:opacity .2s, transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.fs-box{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px}
.fs-box .lr-s{margin-top:3px;color:var(--muted)}
.fs-box.ok{border-color:var(--good);background:var(--good-bg)}
.fs-box.warn{border-color:var(--inquiry);background:var(--inquiry-bg)}
.hidden{display:none !important}
</style>
</head>
<body>
<header class="app">
  <div class="brand"><span class="dot"></span>Life Planner</div>
  <nav class="tabs" id="tabs">
    <button data-tab="calendar" class="active">Calendar</button>
    <button data-tab="finances">Finances</button>
    <button data-tab="tasks">This week</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="spacer"></div>
  <div class="navbtns">
    <button class="iconbtn" id="yr-prev" title="Previous year">‹</button>
    <button class="btn sm" id="yr-label" style="min-width:64px;justify-content:center">2026</button>
    <button class="iconbtn" id="yr-next" title="Next year">›</button>
  </div>
  <button class="iconbtn" id="theme-toggle" title="Toggle theme">◐</button>
</header>

<main id="view"></main>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   GIG LEDGER — single-file calendar + finance tracker
   Data lives in localStorage. Back up via Settings → Data.
   ============================================================ */

const STORE_KEY = "gigledger.v1";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];

/* ---------- date helpers (string-based, timezone-safe) ---------- */
const pad = n => String(n).padStart(2,"0");
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoOf(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }          // m is 0-based
function mkey(iso){ return iso.slice(0,7); }                          // YYYY-MM
function mkeyOf(y,m){ return `${y}-${pad(m+1)}`; }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function firstDow(y,m){ return (new Date(y,m,1).getDay()+6)%7; }      // Mon=0
function fmtDayLabel(iso){ const [y,m,d]=iso.split("-").map(Number); return `${d} ${MONTHS_SHORT[m-1]} ${y}`; }
function addDays(iso,n){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function weekMonday(iso){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(y,m-1,d); const dow=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-dow); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function daysBetween(a,b){ const pa=a.split("-").map(Number),pb=b.split("-").map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000); }
function weekLabel(mon){ const end=addDays(mon,6); const a=mon.split("-").map(Number),z=end.split("-").map(Number);
  const left=`${a[2]} ${MONTHS_SHORT[a[1]-1]}`, right=`${z[2]} ${MONTHS_SHORT[z[1]-1]} ${z[0]}`;
  return a[1]===z[1]?`${a[2]} – ${z[2]} ${MONTHS_SHORT[z[1]-1]} ${z[0]}`:`${left} – ${right}`; }

/* ---------- money ---------- */
const eur = new Intl.NumberFormat("en-IE",{style:"currency",currency:"EUR",maximumFractionDigits:2,minimumFractionDigits:0});
const eur2 = new Intl.NumberFormat("en-IE",{style:"currency",currency:"EUR",maximumFractionDigits:2,minimumFractionDigits:2});
function money(n){ n=Number(n)||0; return (Math.abs(n)%1===0)?eur.format(n):eur2.format(n); }
function signed(n){ n=Number(n)||0; return (n>0?"+":"")+money(n); }
const num = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- state ---------- */
let S = load();
let ui = { tab:"calendar", calMode:"year", year:(new Date()).getFullYear(), month:(new Date()).getMonth(), weekStart:weekMonday(todayISO()) };

function blank(){
  return {
    version:1,
    accounts:[
      {id:uid(), name:"Revolut", startBalance:0, startDate:todayISO()},
      {id:uid(), name:"AIB", startBalance:0, startDate:todayISO()}
    ],
    sources:[],
    bookings:[],   // {id,title,venue,date,fee,sourceId,status,paid,paidDate,accountId,notes}
    fixedCosts:[], // {id,name,amount,accountId,category,startMonth,endMonth}
    costPayments:{}, // "costId|YYYY-MM" -> {paid,paidDate,amount}
    oneOffs:[],    // {id,name,amount,type,date,accountId,sourceId,category,paid,paidDate}
    reconciliations:[], // {id,accountId,date,balance}
    tasks:{}       // "YYYY-MM-DD"(Monday) -> [{id,text,done,doneDate}]
  };
}
function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const d=JSON.parse(raw); return normalize(d); } }
  catch(e){ console.warn("load failed",e); }
  return blank();
}
function normalize(d){
  const b=blank();
  d=Object.assign(b,d||{});
  ["accounts","sources","bookings","fixedCosts","oneOffs","reconciliations"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=b[k]; });
  if(typeof d.costPayments!=="object"||!d.costPayments) d.costPayments={};
  if(typeof d.tasks!=="object"||!d.tasks) d.tasks={};
  d.bookings.forEach(bk=>{ if(!Array.isArray(bk.expenses)) bk.expenses=[]; });
  if(d.accounts.length===0) d.accounts=b.accounts;
  return d;
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ toast("⚠ Could not save — storage blocked"); }
  fileAutosave();
}

/* ---------- optional: auto-save to a real file (Chrome/Edge) ---------- */
const FS_OK = (typeof window!=="undefined") && ("showSaveFilePicker" in window);
let fileHandle=null;      // connected file handle (this session)
let fileStatus="none";    // none | connected | reconnect
let fileName="";
let fsTimer=null;
const IDB_NAME="gigledger-fs", IDB_STORE="handles";
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,"readonly"); const rq=tx.objectStore(IDB_STORE).get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function idbDel(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function writeToFile(handle){ const w=await handle.createWritable(); await w.write(JSON.stringify(S,null,2)); await w.close(); }
async function ensureRW(handle){
  if((await handle.queryPermission({mode:"readwrite"}))==="granted") return true;
  return (await handle.requestPermission({mode:"readwrite"}))==="granted";
}
function fileAutosave(){
  if(!fileHandle || fileStatus!=="connected") return;
  clearTimeout(fsTimer);
  fsTimer=setTimeout(async()=>{
    try{ await writeToFile(fileHandle); }
    catch(e){ fileStatus="reconnect"; if(ui.tab==="settings") render(); toast("⚠ Lost the data file — reconnect in Settings"); }
  },500);
}
async function connectNewFile(){
  if(!FS_OK) return;
  try{
    const handle=await window.showSaveFilePicker({suggestedName:"life-planner-data.json",types:[{description:"JSON data",accept:{"application/json":[".json"]}}]});
    fileHandle=handle; fileName=handle.name; await writeToFile(handle);
    await idbSet("dataFile",handle); fileStatus="connected";
    render(); toast("Auto-saving to "+handle.name);
  }catch(e){ if(e && e.name!=="AbortError") toast("⚠ Couldn't create the file"); }
}
async function connectExistingFile(){
  if(!FS_OK) return;
  try{
    const [handle]=await window.showOpenFilePicker({types:[{description:"JSON data",accept:{"application/json":[".json"]}}]});
    if(!(await ensureRW(handle))){ toast("Write permission needed"); return; }
    const file=await handle.getFile(); const text=await file.text();
    if(text.trim() && confirm("Load data from this file? It replaces what's currently in this browser.")){ S=normalize(JSON.parse(text)); }
    fileHandle=handle; fileName=handle.name; fileStatus="connected";
    save(); render(); toast("Connected — auto-saving to "+handle.name);
  }catch(e){ if(e && e.name!=="AbortError") toast("⚠ Couldn't open the file"); }
}
async function reconnectFile(){
  if(!fileHandle) return;
  try{
    if(!(await ensureRW(fileHandle))){ toast("Permission needed to resume auto-save"); return; }
    const file=await fileHandle.getFile(); const text=await file.text();
    if(text.trim()){ S=normalize(JSON.parse(text)); }
    fileStatus="connected"; save(); render(); toast("Reconnected — auto-saving to "+fileName);
  }catch(e){ toast("⚠ Couldn't reconnect"); }
}
async function disconnectFile(){ fileHandle=null; fileStatus="none"; fileName=""; try{ await idbDel("dataFile"); }catch(e){} render(); toast("Auto-save file disconnected"); }
async function restoreFileHandleOnBoot(){
  if(!FS_OK) return;
  try{
    const handle=await idbGet("dataFile");
    if(!handle) return;
    fileHandle=handle; fileName=handle.name||"data file";
    if((await handle.queryPermission({mode:"readwrite"}))==="granted"){
      try{ const file=await handle.getFile(); const text=await file.text(); if(text.trim()){ S=normalize(JSON.parse(text)); save(); } fileStatus="connected"; }
      catch(e){ fileStatus="reconnect"; }
    } else { fileStatus="reconnect"; }
    render();
  }catch(e){}
}

/* ============================================================
   FINANCE ENGINE
   ============================================================ */

// active fixed-cost instances for a given month key
function costsForMonth(mk){
  return S.fixedCosts.filter(c=>{
    if(c.startMonth && mk < c.startMonth) return false;
    if(c.endMonth && mk > c.endMonth) return false;
    return true;
  }).map(c=>{
    const p=S.costPayments[`${c.id}|${mk}`]||{};
    return { costId:c.id, mk, name:c.name, category:c.category, accountId:c.accountId,
             amount:(p.amount!=null? num(p.amount): num(c.amount)),
             paid:!!p.paid, paidDate:p.paidDate||null };
  });
}

// P&L for one month
function monthPnL(mk){
  const bks = S.bookings.filter(b=>mkey(b.date)===mk);
  const potential = bks.filter(b=>b.status==="inquiry").reduce((s,b)=>s+num(b.fee),0);
  const committedBk = bks.filter(b=>b.status==="confirmed"||b.status==="fulfilled").reduce((s,b)=>s+num(b.fee),0);
  const receivedBk = bks.filter(b=>b.paid).reduce((s,b)=>s+num(b.fee),0);
  const ooIn = S.oneOffs.filter(o=>o.type==="income" && mkey(o.date)===mk);
  const ooEx = S.oneOffs.filter(o=>o.type==="expense" && mkey(o.date)===mk);
  const committed = committedBk + ooIn.reduce((s,o)=>s+num(o.amount),0);
  const received  = receivedBk  + ooIn.filter(o=>o.paid).reduce((s,o)=>s+num(o.amount),0);
  const fixed = costsForMonth(mk);
  const fixedTotal = fixed.reduce((s,c)=>s+c.amount,0);
  const ooExTotal  = ooEx.reduce((s,o)=>s+num(o.amount),0);
  const gigExp = bks.filter(b=>b.status==="confirmed"||b.status==="fulfilled")
                    .reduce((s,b)=>s+(b.expenses||[]).reduce((x,e)=>x+num(e.amount),0),0);
  const expenses = fixedTotal + ooExTotal + gigExp;
  return { mk, potential, committed, received, expenses, fixedTotal, ooExTotal, gigExp,
           net: committed-expenses, netPotential:(committed+potential)-expenses };
}

// actual current balance for one account (paid ledger, anchored to latest reconciliation)
function accountBalance(accId){
  const a=acct(accId); if(!a) return 0;
  const today=todayISO();
  let anchorDate=a.startDate||"0000-01-01", bal=num(a.startBalance);
  S.reconciliations.filter(r=>r.accountId===accId && r.date<=today).forEach(r=>{
    if(r.date>=anchorDate){ anchorDate=r.date; bal=num(r.balance); }
  });
  S.bookings.forEach(b=>{ if(b.paid && b.accountId===accId){ const pd=b.paidDate||b.date; if(pd>anchorDate && pd<=today) bal+=num(b.fee); }});
  S.bookings.forEach(b=>{ (b.expenses||[]).forEach(e=>{ if(e.paid && e.accountId===accId){ const pd=e.paidDate||b.date; if(pd>anchorDate && pd<=today) bal-=num(e.amount); }}); });
  S.oneOffs.forEach(o=>{ if(o.paid && o.accountId===accId){ const pd=o.paidDate||o.date; if(pd>anchorDate && pd<=today) bal+=(o.type==="income"?num(o.amount):-num(o.amount)); }});
  Object.entries(S.costPayments).forEach(([k,p])=>{
    if(!p.paid) return;
    const [costId,mk]=k.split("|");
    const c=S.fixedCosts.find(x=>x.id===costId); if(!c||c.accountId!==accId) return;
    const pd=p.paidDate||(mk+"-01"); if(pd>anchorDate && pd<=today) bal-=(p.amount!=null?num(p.amount):num(c.amount));
  });
  return bal;
}
function lastReconcile(accId){
  const rs=S.reconciliations.filter(r=>r.accountId===accId).sort((a,b)=>a.date<b.date?1:-1);
  return rs[0]||null;
}
function combinedBalance(){ return S.accounts.reduce((s,a)=>s+accountBalance(a.id),0); }

// money owed to you: committed income not yet marked paid
function awaitingPayment(){
  let t=0;
  S.bookings.forEach(b=>{ if((b.status==="confirmed"||b.status==="fulfilled") && !b.paid) t+=num(b.fee); });
  S.oneOffs.forEach(o=>{ if(o.type==="income" && !o.paid) t+=num(o.amount); });
  return t;
}

// projected combined balance at end of selected year:
// balance now + unpaid committed income (dated within year, not before today's month)
//            − unpaid expenses for current..Dec of the year
function projectedYearEnd(year){
  const today=todayISO(), curMk=mkey(today), yEnd=`${year}-12`;
  if(year < (new Date()).getFullYear()) return combinedBalance();
  let bal=combinedBalance();
  S.bookings.forEach(b=>{
    if(b.status==="confirmed"||b.status==="fulfilled"){
      const mk=mkey(b.date);
      if(mk>=curMk && mk<=yEnd){
        if(!b.paid) bal+=num(b.fee);
        (b.expenses||[]).forEach(e=>{ if(!e.paid) bal-=num(e.amount); });
      }
    }
  });
  S.oneOffs.forEach(o=>{
    if(o.type==="income" && !o.paid){ const mk=mkey(o.date); if(mk>=curMk && mk<=yEnd) bal+=num(o.amount); }
    if(o.type==="expense" && !o.paid){ const mk=mkey(o.date); if(mk>=curMk && mk<=yEnd) bal-=num(o.amount); }
  });
  for(let m=0;m<12;m++){
    const mk=mkeyOf(year,m); if(mk<curMk) continue;
    costsForMonth(mk).forEach(c=>{ if(!c.paid) bal-=c.amount; });
  }
  return bal;
}

const view=document.getElementById("view");
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===ui.tab));

/* ----- calendar ----- */
function bookingsInMonth(y,m){
  const mk=mkeyOf(y,m);
  return S.bookings.filter(b=>mkey(b.date)===mk).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function chipHTML(b){
  const day=Number(b.date.slice(8,10));
  const paid=b.paid?'<span class="paiddot" title="Paid"></span>':'';
  return `<div class="chip ${b.status}" data-edit="${b.id}" title="${esc(b.title)} — ${money(b.fee)} (${b.status}${b.paid?', paid':''})">
    <span class="cdate">${day}</span><span class="ctitle">${esc(b.title||"(untitled)")}</span>${paid}<span class="cfee">${money(b.fee)}</span></div>`;
}
function renderCalendar(){
  const modeYear=ui.calMode==="year";
  let html=`<div class="toolbar">
    <div class="seg"><button data-cal="year" class="${modeYear?'active':''}">Year</button><button data-cal="month" class="${!modeYear?'active':''}">Month</button></div>`;
  if(!modeYear){
    html+=`<div class="navbtns"><button class="iconbtn" id="m-prev">‹</button>
      <button class="btn sm" style="min-width:120px;justify-content:center" id="m-label">${MONTHS[ui.month]} ${ui.year}</button>
      <button class="iconbtn" id="m-next">›</button></div>`;
  }
  html+=`<div class="spacer"></div><button class="btn primary" id="add-gig">+ Add</button></div>`;

  if(modeYear){
    html+=`<div class="year-grid">`;
    const now=new Date(), isNowY=now.getFullYear()===ui.year;
    for(let m=0;m<12;m++){
      const bks=bookingsInMonth(ui.year,m);
      const pnl=monthPnL(mkeyOf(ui.year,m));
      const netClass=pnl.net>0?'pos':pnl.net<0?'neg':'';
      const shown=bks.slice(0,5);
      const more=bks.length-shown.length;
      html+=`<div class="month-card ${isNowY&&now.getMonth()===m?'now':''}">
        <div class="mc-head" data-month="${m}">
          <span class="mc-name">${MONTHS[m]}</span>
          <span class="mc-net ${netClass}">${bks.length||pnl.expenses?signed(pnl.net):''}</span>
        </div>
        <div class="mc-body">
          ${shown.map(chipHTML).join("") || '<div class="mc-empty">None</div>'}
          ${more>0?`<div class="mc-more" data-month="${m}">+${more} more…</div>`:''}
        </div>
        <div class="mc-foot"><span>${bks.length} Job${bks.length===1?'':'s'}</span><span>${pnl.committed?money(pnl.committed)+' in':''}</span></div>
      </div>`;
    }
    html+=`</div>`;
  }else{
    html+=`<div class="dow">${DOW.map(d=>`<span>${d}</span>`).join("")}</div><div class="mgrid">`;
    const y=ui.year,m=ui.month, start=firstDow(y,m), dim=daysInMonth(y,m);
    const prevDim=daysInMonth(m===0?y-1:y, (m+11)%12);
    const today=todayISO();
    const cells=[];
    for(let i=0;i<start;i++) cells.push({d:prevDim-start+1+i,out:true,y:m===0?y-1:y,m:(m+11)%12});
    for(let d=1;d<=dim;d++) cells.push({d,out:false,y,m});
    while(cells.length%7!==0||cells.length<35){ const last=cells[cells.length-1]; let nm=m+1,ny=y; if(nm>11){nm=0;ny++;} const nextIdx=cells.filter(c=>c.out&&c.after).length+1; cells.push({d:nextIdx,out:true,after:true,y:ny,m:nm}); if(cells.length>=42)break; }
    cells.forEach(c=>{
      const iso=isoOf(c.y,c.m,c.d);
      const dayb=S.bookings.filter(b=>b.date===iso).sort((a,b)=>a.status<b.status?1:-1);
      html+=`<div class="day ${c.out?'out':''} ${iso===today?'today':''}" data-day="${iso}">
        <span class="addhint">＋</span><span class="dnum">${c.d}</span>
        ${dayb.map(chipHTML).join("")}
      </div>`;
    });
    html+=`</div>`;
  }
  view.innerHTML=html;
}

/* ----- tasks (weekly checklist) ----- */
function weekTasks(mon){ return S.tasks[mon] || []; }
function renderTasks(){
  const mon=ui.weekStart, end=addDays(mon,6), today=todayISO();
  const list=weekTasks(mon);
  const done=list.filter(t=>t.done).length, total=list.length;
  const pct=total?Math.round(done/total*100):0;
  const isThisWeek=(today>=mon && today<=end);
  let statusLine;
  if(today<mon){ statusLine=`starts in ${daysBetween(today,mon)} day${daysBetween(today,mon)===1?'':'s'}`; }
  else if(today>end){ statusLine=`past week`; }
  else { const left=daysBetween(today,end)+1; statusLine=`${left} day${left===1?'':'s'} left this week`; }
  const remaining=total-done;
  const urgent=isThisWeek && remaining>0 && daysBetween(today,end)<=1;

  let html=`<div class="week-head">
    <div class="navbtns"><button class="iconbtn" id="wk-prev">‹</button>
      <button class="btn sm" style="min-width:170px;justify-content:center" id="wk-today">${weekLabel(mon)}</button>
      <button class="iconbtn" id="wk-next">›</button></div>
    <div class="spacer"></div>
    <div style="text-align:right"><div style="font-weight:700;font-size:15px" class="${urgent?'neg':''}">${done}/${total||0} done</div>
      <div class="muted-note ${urgent?'neg':''}">${statusLine}</div></div>
  </div>`;

  html+=`<div class="card" style="padding:14px 16px;margin-bottom:16px">
    <div style="height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${pct===100?'var(--good)':'var(--accent)'};border-radius:5px;transition:width .25s"></div>
    </div>
    ${total&&done===total?'<div class="muted-note pos" style="margin-top:9px">✓ All done — nice one.</div>':''}
  </div>`;

  html+=`<div class="card card-pad" style="margin-bottom:16px">
    <label style="font-size:12px;font-weight:600;color:var(--ink-2)">Tasks</label>
    <textarea id="task-input" rows="3" placeholder="" style="margin-top:7px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);padding:10px 12px;border-radius:10px;width:100%;resize:vertical"></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
     
      <button class="btn primary" id="task-add">+ Add</button>
    </div>
  </div>`;

  const sorted=[...list].sort((a,b)=>(a.done?1:0)-(b.done?1:0));
  html+=`<div class="card todo">`;
  if(total===0){ html+=`<div class="empty"></div>`; }
  else{
    sorted.forEach(t=>{
      html+=`<div class="task-item ${t.done?'done':''}">
        <div class="check ${t.done?'on':''}" data-toggle="${t.id}" title="Toggle done">${t.done?'✓':''}</div>
        <div class="tt" style="flex:1;min-width:0">${esc(t.text)}</div>
        <button class="iconbtn del-task" data-del-task="${t.id}" title="Delete" style="width:28px;height:28px;font-size:13px">✕</button>
      </div>`;
    });
  }
  html+=`</div>`;
  view.innerHTML=html;
  const ta=document.getElementById("task-input"); if(ta && isThisWeek) ta.focus();
}
function addTasksFromText(text){
  const parts=(text.includes("\n")?text.split("\n"):text.split(",")).map(s=>s.trim()).filter(Boolean);
  if(parts.length===0) return 0;
  if(!S.tasks[ui.weekStart]) S.tasks[ui.weekStart]=[];
  parts.forEach(txt=>S.tasks[ui.weekStart].push({id:uid(),text:txt,done:false,doneDate:null}));
  save(); return parts.length;
}

      </div>`;
    });
  }
  html+=`</div>`;

  // monthly table
  html+=`<h2 class="section">${ui.year} — month by month</h2>
  <div class="card" style="padding:6px 10px;overflow-x:auto"><table class="fin"><thead><tr>
    <th>Month</th><th>Potential</th><th>Income</th><th>Costs</th><th>Net</th><th>Running</th>
  </tr></thead><tbody>`;
  const now=new Date();
  rows.forEach(({m,p,cum})=>{
    const isNow=now.getFullYear()===ui.year&&now.getMonth()===m;
    html+=`<tr class="${isNow?'now':''}">
      <td>${MONTHS_SHORT[m]}</td>
      <td class="tnum" style="color:var(--muted)">${p.potential?money(p.potential):'·'}</td>
      <td class="tnum">${p.committed?money(p.committed):'·'}</td>
      <td class="tnum">${p.expenses?money(p.expenses):'·'}</td>
      <td class="tnum ${p.net>0?'pos':p.net<0?'neg':''}">${(p.committed||p.expenses)?signed(p.net):'·'}</td>
      <td class="tnum ${cum>0?'pos':cum<0?'neg':''}"><b>${signed(cum)}</b></td>
    </tr>`;
  });
  html+=`<tr style="border-top:2px solid var(--line-strong)"><td><b>Total ${ui.year}</b></td><td></td>
    <td class="tnum"><b>${money(ytdIncome)}</b></td><td class="tnum"><b>${money(ytdExp)}</b></td>
    <td class="tnum ${ytdNet>=0?'pos':'neg'}"><b>${signed(ytdNet)}</b></td><td></td></tr>`;
  html+=`</tbody></table></div>`;

  // source performance
  const perf=sourcePerformance(ui.year);
  html+=`<h2 class="section">Income by source · ${ui.year}</h2><div class="card card-pad">`;
  if(perf.length===0){ html+=`<div class="empty">No income logged yet for ${ui.year}</div>`; }
  else{
    const max=Math.max(...perf.map(p=>p.total),1);
    html+=`<div class="bars">`;
    perf.forEach(p=>{
      html+=`<div class="bar-row">
        <div class="bar-lab"><span class="sw" style="background:${p.color}"></span>${esc(p.name)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,p.total/max*100)}%;background:${p.color}"></div></div>
        <div class="bar-val tnum">${money(p.total)} <span style="color:var(--muted);font-weight:600">· ${p.count}</span></div>
      </div>`;
    });
    html+=`</div>`;
  }
  html+=`</div>`;

  view.innerHTML=html;
}

function buildOwedList(){
  const items=[]; const today=todayISO();
  S.bookings.forEach(b=>{
    if((b.status==="confirmed"||b.status==="fulfilled") && !b.paid){
      items.push({key:"b|"+b.id, sortDate:b.date, dir:1, amount:num(b.fee),
        title:`${b.title||"(Job)"} — ${money(b.fee)}`,
        sub:`${b.status} · ${fmtDayLabel(b.date)}${b.date<=today?' · due':''}`});
    }
    if(b.status==="confirmed"||b.status==="fulfilled"){
      (b.expenses||[]).forEach(e=>{ if(!e.paid && num(e.amount)>0){
        items.push({key:"ge|"+b.id+"|"+e.id, sortDate:b.date, dir:-1, amount:num(e.amount),
          title:`${e.name||"Job cost"} — ${money(e.amount)}`,
          sub:`cost for ${b.title||"job"} · ${fmtDayLabel(b.date)}`});
      }});
    }
  });
  S.oneOffs.forEach(o=>{
    if(!o.paid){
      items.push({key:"o|"+o.id, sortDate:o.date, dir:o.type==="income"?1:-1, amount:num(o.amount),
        title:`${o.name||(o.type)} `, sub:`${o.type} · ${fmtDayLabel(o.date)}`});
    }
  });
  const curMk=mkey(today);
  S.fixedCosts.forEach(c=>{
    for(let y=ui.year-1;y<=ui.year;y++) for(let m=0;m<12;m++){
      const mk=mkeyOf(y,m); if(mk>curMk) continue;
      if(c.startMonth&&mk<c.startMonth) continue; if(c.endMonth&&mk>c.endMonth) continue;
      const p=S.costPayments[`${c.id}|${mk}`]||{};
      if(!p.paid){
        items.push({key:"c|"+c.id+"|"+mk, sortDate:mk+"-01", dir:-1, amount:(p.amount!=null?num(p.amount):num(c.amount)),
          title:`${c.name} — ${MONTHS_SHORT[m]} ${y}`, sub:`fixed cost · ${acctName(c.accountId)}`});
      }
    }
  });
  return items.sort((a,b)=>a.sortDate<b.sortDate?-1:a.sortDate>b.sortDate?1:0);
}

function sourcePerformance(year){
  const map={};
  S.bookings.forEach(b=>{
    if(mkey(b.date).slice(0,4)!=String(year)) return;
    if(!(b.status==="confirmed"||b.status==="fulfilled")) return;
    const key=b.sourceId||"__none";
    if(!map[key]) map[key]={total:0,count:0};
    map[key].total+=num(b.fee); map[key].count++;
  });
  S.oneOffs.forEach(o=>{
    if(o.type!=="income") return; if(mkey(o.date).slice(0,4)!=String(year)) return;
    const key=o.sourceId||"__none";
    if(!map[key]) map[key]={total:0,count:0};
    map[key].total+=num(o.amount); map[key].count++;
  });
  return Object.entries(map).map(([id,v])=>({
    name: id==="__none"?"Unassigned":(source(id)||{}).name||"?",
    color: id==="__none"?"var(--muted)":sourceColor(id),
    total:v.total, count:v.count
  })).sort((a,b)=>b.total-a.total);
}

/* ----- gig editor ----- */
function editGig(id, presetDate){
  const isNew=!id;
  const b = isNew ? {id:uid(),title:"",venue:"",date:presetDate||todayISO(),fee:"",sourceId:"",status:"inquiry",paid:false,paidDate:todayISO(),accountId:(S.accounts[0]||{}).id,notes:"",expenses:[]}

  const srcList=`<datalist id="srcs">${S.sources.map(s=>`<option value="${esc(s.name)}">`).join("")}</datalist>`;
  const curSrcName = b.sourceId ? ((source(b.sourceId)||{}).name||"") : "";
  openModal(`
    <div class="modal-head"><h3>${isNew?'Add':'Edit'}</h3><button class="iconbtn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Title</label><input id="g-title" value="${esc(b.title)}" placeholder="" autofocus></div>
      <div class="row2">
        <div class="field"><label>Date</label><input id="g-date" type="date" value="${b.date}"></div>
        <div class="field"><label>Fee (€)</label><input id="g-fee" type="number" step="0.01" value="${b.fee}" placeholder="0"></div>
      </div>
      <div class="row2">
       
        <div class="field" style="grid-column:1/-1"><label>Income source</label><input id="g-source" list="srcs" value="${esc(curSrcName)}" placeholder="Type a source, e.g. DJ sets" autocomplete="off">${srcList}<div id="src-quick" class="src-quick"></div></div>
      </div>
      <div class="field"><label>Status</label>
        <div class="statusseg" id="g-status">
          <button type="button" data-st="inquiry" class="${b.status==='inquiry'?'active':''}">Inquiry</button>
          <button type="button" data-st="confirmed" class="${b.status==='confirmed'?'active':''}">Confirmed</button>
          <button type="button" data-st="fulfilled" class="${b.status==='fulfilled'?'active':''}">Fulfilled</button>
        </div>
        <div class="muted-note" id="g-status-note"></div>
      </div>
      <div class="paidbox">
        <div class="checkline"><input type="checkbox" id="g-paid" ${b.paid?'checked':''}><label for="g-paid" style="font-weight:600">Paid</label></div>
        <div class="row2" id="g-paid-fields">
          <div class="field"><label>Paid into</label><select id="g-account">${acctOptions(b.accountId)}</select></div>
          <div class="field"><label>Date received</label><input id="g-paiddate" type="date" value="${b.paidDate||todayISO()}"></div>
        </div>
      </div>
      <div class="exp-head"><label style="font-size:12px;font-weight:600;color:var(--ink-2)">Expenses</label><span class="g-net-wrap">Net to you: <b id="g-net">—</b></span></div>
      <div id="g-exps"></div>
      <button class="btn sm" id="g-addexp" style="align-self:flex-start">+ Add</button>
    </div>
    <div class="modal-foot">
      ${isNew?'<span></span>':'<button class="btn danger" data-del-gig="'+b.id+'">Delete</button>'}
      <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="g-save">Save</button></div>
    </div>`);

  let status=b.status;
  const noteEl=modal.querySelector("#g-status-note");
  const paidFields=modal.querySelector("#g-paid-fields");
  function syncStatusNote(){
    noteEl.textContent = status==="inquiry" ? "Pending — counts as potential only, not in your committed totals."
      : status==="confirmed" ? "Locked in — counts as expected income for its month."
      : "Job completed — still tick ‘Paid’ once the cash actually lands.";
  }
  function syncPaid(){ paidFields.style.opacity=modal.querySelector("#g-paid").checked?1:.45; }
  syncStatusNote(); syncPaid();

  // ---- per-gig expenses ----
  let exps = b.expenses.map(e=>Object.assign({},e));
  function expRowHTML(e,idx){
    return `<div class="exp-item" data-idx="${idx}">
      <div class="exp-top">
        <input class="exp-f" data-field="name" value="${esc(e.name||'')}" placeholder="e.g. Videographer">
        <input class="exp-f" data-field="amount" type="number" step="0.01" value="${e.amount??''}" placeholder="0">
        <button class="iconbtn" data-delexp="${idx}" title="Remove" style="width:32px;height:32px;font-size:13px">✕</button>
      </div>
      <div class="exp-bot">
        <label class="checkline" style="margin:0"><input type="checkbox" class="exp-f" data-field="paid" ${e.paid?'checked':''}> paid</label>
        <select class="exp-f" data-field="accountId">${acctOptions(e.accountId||(S.accounts[0]||{}).id)}</select>
      </div>
    </div>`;
  }
  function updateNet(){
    const fee=num(modal.querySelector("#g-fee").value);
    const sum=exps.reduce((s,e)=>s+num(e.amount),0);
    const net=fee-sum; const el=modal.querySelector("#g-net");
    el.textContent=money(net); el.style.color=net>=0?'var(--good)':'var(--bad)';
  }
  function renderExps(){
    const c=modal.querySelector("#g-exps");
    c.innerHTML = exps.length? exps.map(expRowHTML).join("") : '<div class="muted-note"></div>';
    updateNet();
  }
  function readExp(el){ const item=el.closest(".exp-item"); if(!item)return; const idx=+item.dataset.idx,f=el.dataset.field; exps[idx][f]=el.type==="checkbox"?el.checked:el.value; if(f==="amount")updateNet(); }
  const expc=modal.querySelector("#g-exps");
  expc.addEventListener("input",e=>{ if(e.target.classList.contains("exp-f")) readExp(e.target); });
  expc.addEventListener("change",e=>{ if(e.target.classList.contains("exp-f")) readExp(e.target); });
  expc.addEventListener("click",e=>{ const d=e.target.closest("[data-delexp]"); if(d){ exps.splice(+d.dataset.delexp,1); renderExps(); }});
  modal.querySelector("#g-addexp").addEventListener("click",()=>{ exps.push({id:uid(),name:"",amount:"",paid:false,paidDate:null,accountId:(S.accounts[0]||{}).id}); renderExps(); const items=modal.querySelectorAll("#g-exps .exp-item"); const last=items[items.length-1]; if(last) last.querySelector("input").focus(); });
  modal.querySelector("#g-fee").addEventListener("input",updateNet);
  renderExps();

  // ---- income-source quick pick ----
  (function(){
    const q=modal.querySelector("#src-quick"); if(!q) return;
    if(S.sources.length===0){ q.innerHTML='<span class="muted-note">No sources yet — type one above to start tracking it.</span>'; return; }
    q.innerHTML = S.sources.map(so=>`<button type="button" class="src-chip" data-src="${esc(so.name)}"><span class="sw" style="background:${sourceColor(so.id)}"></span>${esc(so.name)}</button>`).join("");
    q.addEventListener("click",e=>{ const bt=e.target.closest("[data-src]"); if(bt) modal.querySelector("#g-source").value=bt.dataset.src; });
  })();

  modal.querySelector("#g-status").addEventListener("click",e=>{
    const btn=e.target.closest("button[data-st]"); if(!btn) return;
    status=btn.dataset.st;
    modal.querySelectorAll("#g-status button").forEach(x=>x.classList.toggle("active",x===btn));
    syncStatusNote();
  });
  modal.querySelector("#g-paid").addEventListener("change",syncPaid);
  modal.querySelector("#g-save").addEventListener("click",()=>{
    b.title=modal.querySelector("#g-title").value.trim();
    b.date=modal.querySelector("#g-date").value||todayISO();
    b.fee=num(modal.querySelector("#g-fee").value);
    { const gv=modal.querySelector("#g-venue"); if(gv) b.venue=gv.value.trim(); }
    b.sourceId=ensureSource(modal.querySelector("#g-source").value)||"";
    b.status=status;
    b.paid=modal.querySelector("#g-paid").checked;
    b.accountId=modal.querySelector("#g-account").value;
    b.paidDate=modal.querySelector("#g-paiddate").value||todayISO();
    b.expenses=exps.map(e=>({id:e.id||uid(),name:(e.name||"").trim(),amount:num(e.amount),paid:!!e.paid,paidDate:e.paid?(e.paidDate||b.date):null,accountId:e.accountId||(S.accounts[0]||{}).id})).filter(e=>e.name||e.amount>0);
    if(!b.title){ toast("Give the job a title"); return; }
    const i=S.bookings.findIndex(x=>x.id===b.id);
    if(i<0) S.bookings.push(b); else S.bookings[i]=b;
    save(); closeModal(); render(); toast(isNew?"Job added":"Job saved");
  });
}

      ${isNew?'<span></span>':'<button class="btn danger" data-del-cost="'+c.id+'">Delete</button>'}
      <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="c-save">Save</button></div>
    </div>`);
  modal.querySelector("#c-save").addEventListener("click",()=>{
    c.name=modal.querySelector("#c-name").value.trim()||"Cost";
    c.amount=num(modal.querySelector("#c-amt").value);
    c.category=modal.querySelector("#c-cat").value.trim();
    c.accountId=modal.querySelector("#c-acct").value;
    c.startMonth=(modal.querySelector("#c-start").value||"").slice(0,7)||mkeyOf(ui.year,0);
    c.endMonth=(modal.querySelector("#c-end").value||"").slice(0,7);
    const i=S.fixedCosts.findIndex(x=>x.id===c.id);
    if(i<0) S.fixedCosts.push(c); else S.fixedCosts[i]=c;
    save(); closeModal(); render(); toast("Fixed cost saved");
  });
}

/* ----- source rename ----- */
function editSource(id){
  const isNew=id==="new";
  const s=isNew?{id:uid(),name:""}:Object.assign({},source(id));
  openModal(`<div class="modal-head"><h3>${isNew?'Add source':'Rename source'}</h3><button class="iconbtn" data-close>✕</button></div>
    <div class="modal-body"><div class="field"><label>Source name</label><input id="s-name" value="${esc(s.name)}" placeholder="e.g. DJ sets" autofocus></div></div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="s-save">Save</button></div>`);
  modal.querySelector("#s-save").addEventListener("click",()=>{
    s.name=modal.querySelector("#s-name").value.trim(); if(!s.name){toast("Name required");return;}
    const i=S.sources.findIndex(x=>x.id===s.id);
    if(i<0) S.sources.push(s); else S.sources[i]=s;
    save(); closeModal(); render();
  });
}

/* ============================================================
   ACTIONS
   ============================================================ */
function markPaidByKey(key){
  const parts=key.split("|");
  const today=todayISO();
  if(parts[0]==="b"){ const b=S.bookings.find(x=>x.id===parts[1]); if(b){ b.paid=true; if(!b.paidDate)b.paidDate=today; if(!b.accountId)b.accountId=(S.accounts[0]||{}).id; } }
  else if(parts[0]==="ge"){ const b=S.bookings.find(x=>x.id===parts[1]); if(b){ const e=(b.expenses||[]).find(x=>x.id===parts[2]); if(e){ e.paid=true; if(!e.paidDate)e.paidDate=today; if(!e.accountId)e.accountId=(S.accounts[0]||{}).id; } } }
  else if(parts[0]==="o"){ const o=S.oneOffs.find(x=>x.id===parts[1]); if(o){ o.paid=true; if(!o.paidDate)o.paidDate=today; } }
  else if(parts[0]==="c"){ const cid=parts[1], mk=parts[2]; const k=`${cid}|${mk}`; const p=S.costPayments[k]||{}; p.paid=true; p.paidDate=today; S.costPayments[k]=p; }
  save(); render(); toast("Marked paid ✓");
}

/* backup / restore / demo */
function backup(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`life-planner-backup-${todayISO()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function restore(file){
  const r=new FileReader();
  r.onload=()=>{ try{ S=normalize(JSON.parse(r.result)); save(); render(); toast("Data restored"); }catch(e){ toast("⚠ Invalid backup file"); } };
  r.readAsText(file);
}
function loadDemo(){
  const y=ui.year;
  const s=blank();
  const rev=s.accounts[0].id, aib=s.accounts[1].id;
  s.accounts[0].startBalance=1200; s.accounts[1].startBalance=2400;
  s.accounts[0].startDate=`${y}-01-01`; s.accounts[1].startDate=`${y}-01-01`;
  const live=uid(),dj=uid(),prod=uid();
  s.sources=[{id:live,name:"Live shows"},{id:dj,name:"DJ sets"},{id:prod,name:"Production"}];
  s.fixedCosts=[
    {id:uid(),name:"Rent",amount:750,accountId:aib,category:"Rent",startMonth:`${y}-01`,endMonth:""},
    {id:uid(),name:"Utilities",amount:120,accountId:aib,category:"Bills",startMonth:`${y}-01`,endMonth:""},
    {id:uid(),name:"Subscriptions",amount:45,accountId:rev,category:"Subscription",startMonth:`${y}-01`,endMonth:""}
  ];
  const gig=(mo,d,title,fee,src,status,paid)=>({id:uid(),title,venue:"",date:`${y}-${pad(mo)}-${pad(d)}`,fee,sourceId:src,status,paid,paidDate:paid?`${y}-${pad(mo)}-${pad(d+2)}`:todayISO(),accountId:rev,notes:""});
  s.bookings=[
    gig(1,18,"New Year warehouse",500,dj,"fulfilled",true),
    gig(2,14,"Valentine's live set",650,live,"fulfilled",true),
    gig(3,8,"Studio session – artist EP",900,prod,"fulfilled",true),
    gig(4,22,"Festival warm-up",400,dj,"fulfilled",true),
    gig((new Date()).getMonth()+1,20,"Club headline",750,dj,"confirmed",false),
    gig((new Date()).getMonth()+2>12?12:(new Date()).getMonth()+2,12,"Corporate booking",1200,live,"confirmed",false),
    gig(11,3,"Possible tour date",800,live,"inquiry",false)
  ];
  // mark past fixed costs paid up to current month
  const curMk=mkey(todayISO());
  s.fixedCosts.forEach(c=>{ for(let m=0;m<12;m++){ const mk=mkeyOf(y,m); if(mk>=c.startMonth&&mk<curMk){ s.costPayments[`${c.id}|${mk}`]={paid:true,paidDate:mk+"-01"}; } } });
  S=s; save(); render(); toast("Demo data loaded");
}

/* ============================================================
   EVENTS
   ============================================================ */
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(b){ ui.tab=b.dataset.tab; render(); }});
document.getElementById("yr-prev").addEventListener("click",()=>{ ui.year--; render(); });
document.getElementById("yr-next").addEventListener("click",()=>{ ui.year++; render(); });
document.getElementById("yr-label").addEventListener("click",()=>{ ui.year=(new Date()).getFullYear(); ui.month=(new Date()).getMonth(); render(); });

document.getElementById("theme-toggle").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":cur==="light"?"":"dark";
  if(next) document.documentElement.setAttribute("data-theme",next); else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("gigledger.theme",next); }catch(e){}
});

// delegated clicks in the main view
view.addEventListener("click",e=>{
  const t=e.target;
  let el;
  if(el=t.closest("[data-cal]")){ ui.calMode=el.dataset.cal; render(); return; }
  if(t.id==="add-gig"){ editGig(null, ui.calMode==="month"?isoOf(ui.year,ui.month,Math.min((new Date()).getDate(),daysInMonth(ui.year,ui.month))):null); return; }
  if(t.id==="m-prev"){ ui.month--; if(ui.month<0){ui.month=11;ui.year--;} render(); return; }
  if(t.id==="m-next"){ ui.month++; if(ui.month>11){ui.month=0;ui.year++;} render(); return; }
  if(el=t.closest("[data-edit]")){ editGig(el.dataset.edit); return; }
  if(el=t.closest(".mc-head[data-month], .mc-more[data-month]")){ ui.month=Number(el.dataset.month); ui.calMode="month"; render(); return; }
  if(el=t.closest(".day[data-day]")){ if(!t.closest("[data-edit]")) editGig(null, el.dataset.day); return; }
  if(t.id==="wk-prev"){ ui.weekStart=addDays(ui.weekStart,-7); render(); return; }
  if(t.id==="wk-next"){ ui.weekStart=addDays(ui.weekStart,7); render(); return; }
  if(t.id==="wk-today"){ ui.weekStart=weekMonday(todayISO()); render(); return; }
  if(t.id==="task-add"){ const ta=document.getElementById("task-input"); const n=addTasksFromText(ta.value); if(n){ render(); toast(n+" task"+(n===1?'':'s')+" added"); } return; }
  if(el=t.closest("[data-toggle]")){ const arr=weekTasks(ui.weekStart); const tk=arr.find(x=>x.id===el.dataset.toggle); if(tk){ tk.done=!tk.done; tk.doneDate=tk.done?todayISO():null; save(); render(); } return; }
  if(el=t.closest("[data-del-task]")){ if(S.tasks[ui.weekStart]) S.tasks[ui.weekStart]=S.tasks[ui.weekStart].filter(x=>x.id!==el.dataset.delTask); save(); render(); return; }
  if(el=t.closest("[data-reconcile]")){ reconcileAcct(el.dataset.reconcile); return; }
  if(el=t.closest("[data-markpaid]")){ markPaidByKey(el.dataset.markpaid); return; }
  if(el=t.closest("[data-edit-acct]")){ editAccount(el.dataset.editAcct); return; }
  if(el=t.closest("[data-edit-cost]")){ editCost(el.dataset.editCost); return; }
  if(el=t.closest("[data-edit-source]")){ editSource(el.dataset.editSource); return; }
  if(el=t.closest("[data-del-source]")){ const id=el.dataset.delSource; if(confirm("Delete this source? Jobs keep their fee but lose the tag.")){ S.sources=S.sources.filter(s=>s.id!==id); S.bookings.forEach(b=>{ if(b.sourceId===id)b.sourceId=""; }); save(); render(); } return; }
  if(t.id==="fs-new"){ connectNewFile(); return; }
  if(t.id==="fs-open"){ connectExistingFile(); return; }
  if(t.id==="fs-reconnect"){ reconnectFile(); return; }
  if(t.id==="fs-disconnect"){ disconnectFile(); return; }
  if(t.id==="backup"){ backup(); return; }
  if(t.id==="restore"){ document.getElementById("restore-file").click(); return; }
  if(t.id==="demo"){ if(confirm("Load demo data? This replaces everything currently stored.")) loadDemo(); return; }
  if(t.id==="wipe"){ if(confirm("Erase ALL data? This cannot be undone. Consider a backup first.")){ S=blank(); save(); render(); toast("Cleared"); } return; }
});
view.addEventListener("change",e=>{
  if(e.target.id==="restore-file" && e.target.files[0]) restore(e.target.files[0]);
});
view.addEventListener("keydown",e=>{
  if(e.target.id==="task-input" && (e.metaKey||e.ctrlKey) && e.key==="Enter"){
    const n=addTasksFromText(e.target.value); if(n){ render(); toast(n+" task"+(n===1?'':'s')+" added"); }
  }
});

// delegated clicks inside modal (close + deletes)
modal.addEventListener("click",e=>{
  const t=e.target; let el;
  if(t.closest("[data-close]")){ closeModal(); return; }
  if(el=t.closest("[data-del-gig]")){ if(confirm("Delete this Job?")){ S.bookings=S.bookings.filter(b=>b.id!==el.dataset.delGig); save(); closeModal(); render(); toast("Job deleted"); } return; }
  if(el=t.closest("[data-del-acct]")){ if(confirm("Delete this account?")){ S.accounts=S.accounts.filter(a=>a.id!==el.dataset.delAcct); save(); closeModal(); render(); } return; }
  if(el=t.closest("[data-del-cost]")){ if(confirm("Delete this fixed cost?")){ S.fixedCosts=S.fixedCosts.filter(c=>c.id!==el.dataset.delCost); save(); closeModal(); render(); } return; }
});

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2200); }

/* ---------- utils ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- boot ---------- */
(function boot(){
  try{ const th=localStorage.getItem("gigledger.theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
  render();
  restoreFileHandleOnBoot();
})();

// expose for testing
window.GL={get S(){return S;}, set S(v){S=v;}, monthPnL, accountBalance, combinedBalance, projectedYearEnd, awaitingPayment, blank, normalize, save, load, ui};
</script>
