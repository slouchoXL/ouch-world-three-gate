<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OUCH™ — Mockup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff;
      --text: #000;
      --muted: rgba(0,0,0,0.45);
      --border: rgba(0,0,0,0.12);
      --border-hover: rgba(0,0,0,0.28);
      --pill-bg: rgba(255,255,255,0.92);
      --btn-bg: rgba(0,0,0,0.05);
      --btn-bg-hover: rgba(0,0,0,0.10);
      --radius-card: 14px;
      --radius-pill: 999px;
      --edge-pad-desktop: 28px;
      --edge-pad-mobile: 16px;
      --circle: 30px;
      --circle-border: rgba(0,0,0,0.15);
      --circle-border-hover: rgba(0,0,0,0.30);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Hero background image ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      /* swap this path for wherever the image lives on your server */
      background: url('./splash1.png') center / cover no-repeat;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Top nav ── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px var(--edge-pad-desktop);
      z-index: 100;
    }
    @media (max-width: 768px) {
      .top-nav { padding: 20px var(--edge-pad-mobile); }
    }

    .menu-button, .login-button {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--circle-border);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      backdrop-filter: blur(10px);
      transition: border-color .2s ease, background .2s ease;
    }
    .menu-button:hover, .login-button:hover {
      border-color: var(--circle-border-hover);
      background: #fff;
    }
    .menu-dots { display: flex; gap: 4px; }
    .dot { width: 3px; height: 3px; background: #000; border-radius: 50%; }
    .user-icon { width: 16px; height: 16px; color: #000; }
    .user-icon svg { width: 100%; height: 100%; fill: currentColor; }

    /* ── Menu tray ── */
    .menu-tray {
      position: fixed; top: 60px; left: 20px; width: 130px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 200;
      transform: translateY(-20px); opacity: 0; visibility: hidden;
      transition: all .3s ease;
      padding: 10px 0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .menu-tray.open { transform: translateY(0); opacity: 1; visibility: visible; }
    .menu-item {
      position: relative; display: block; width: 100%;
      padding: 6px 15px; color: #000; text-decoration: none;
      font-size: 14px; font-weight: 400;
      cursor: pointer; background: none; border: 0;
    }
    .menu-item::before {
      content: ""; position: absolute; inset: 1px; left: 8px; right: 8px;
      border-radius: 8px; background: rgba(0,0,0,0.06);
      opacity: 0; transform: scaleY(0.96);
      transition: opacity .15s ease, transform .2s ease; pointer-events: none;
    }
    .menu-item:hover::before { opacity: 1; transform: scaleY(1); }
    .menu-item, .menu-item * { position: relative; z-index: 1; }

    /* ── Centred pill ── */
    .center-pill-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .now-playing-pill {
      pointer-events: auto;
      background: var(--pill-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      display: grid;
      grid-template-columns: 40px minmax(0, 260px) 40px;
      align-items: center;
      gap: 10px;
      padding: 9px;
      width: max-content;
      max-width: calc(100vw - 48px);
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }

    /* circular buttons */
    .circ-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .circ-btn:hover { border-color: var(--border-hover); background: var(--btn-bg-hover); }
    .circ-btn svg {
      width: 16px; height: 16px;
      stroke: rgba(0,0,0,0.65);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* muted state */
    .mute-btn .icon-sound { display: block; }
    .mute-btn .icon-muted { display: none; }
    .mute-btn.is-muted .icon-sound { display: none; }
    .mute-btn.is-muted .icon-muted { display: block; }

    /* live dot */
    .live-dot-wrap {
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #000;
      opacity: 0.18;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.18; transform: scale(1); }
      50%       { opacity: 0.55; transform: scale(1.25); }
    }

    /* track info */
    .pill-meta { min-width: 0; }
    .pill-marquee-wrap {
      overflow: hidden;
      white-space: nowrap;
      line-height: 1.3; /* match title so no extra height */
    }
    .pill-title {
      font-size: 14px;
      font-weight: 450;
      white-space: nowrap;
      line-height: 1.3;
      color: var(--text);
      display: inline-block;
      will-change: transform;
    }
    .pill-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="top-nav">
    <button class="menu-button" onclick="document.getElementById('menuTray').classList.toggle('open')">
      <div class="menu-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </button>
    <button class="login-button">
      <div class="user-icon">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
    </button>
  </nav>

  <!-- Menu Tray -->
  <div class="menu-tray" id="menuTray">
    <a href="/" class="menu-item">Home</a>
    <a href="/portal" class="menu-item">Broken Spirit</a>
    <a href="/shop" class="menu-item">Shop</a>
  </div>

  <!-- Centred Now Playing Pill -->
  <div class="center-pill-wrap">
    <div class="now-playing-pill">

      <!-- Left: live pulse dot -->
      <div class="live-dot-wrap" title="Live">
        <div class="live-dot"></div>
      </div>

      <!-- Middle: title + artist -->
      <div class="pill-meta">
        <div class="pill-marquee-wrap" id="marqueeWrap">
          <span class="pill-title" id="trackTitle">Goodbye</span>
        </div>
        <div class="pill-sub" id="trackArtist">Sloucho · Rory Sweeney</div>
      </div>

      <!-- Right: mute toggle -->
      <button class="circ-btn mute-btn is-muted" id="muteBtn" title="Unmute" onclick="toggleMute()">
        <!-- Sound icon -->
        <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5L6 9H3v6h3l5 4V5z" />
          <path d="M15.5 8.5a5 5 0 010 7" />
          <path d="M18 6a9 9 0 010 12" />
        </svg>
        <!-- Muted icon -->
        <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5L6 9H3v6h3l5 4V5z" />
          <line x1="22" y1="9" x2="16" y2="15" />
          <line x1="16" y1="9" x2="22" y2="15" />
        </svg>
      </button>

    </div>
  </div>

  <script>
    // Close menu on outside click
    document.addEventListener('click', function(e) {
      const tray = document.getElementById('menuTray');
      const btn  = document.querySelector('.menu-button');
      if (tray && btn && !tray.contains(e.target) && !btn.contains(e.target)) {
        tray.classList.remove('open');
      }
    });

    // Mute toggle (visual only for mockup)
    function toggleMute() {
      const btn = document.getElementById('muteBtn');
      const isMuted = btn.classList.toggle('is-muted');
      btn.title = isMuted ? 'Unmute' : 'Mute';
    }

    // ── Marquee ──
    let marqueeTimers = [];
    function clearMarqueeTimers() {
      marqueeTimers.forEach(t => clearTimeout(t));
      marqueeTimers = [];
    }

    function runMarquee() {
      const wrap  = document.getElementById('marqueeWrap');
      const text  = document.getElementById('trackTitle');
      if (!wrap || !text) return;

      clearMarqueeTimers();
      text.style.transition = 'none';
      text.style.transform  = 'translateX(0)';

      requestAnimationFrame(() => {
        const wrapW = wrap.clientWidth;
        const textW = text.scrollWidth;
        if (textW <= wrapW) return; // fits — no scroll needed

        const distance = textW - wrapW;
        const duration = distance / 45; // px/s

        const loop = () => {
          text.style.transition = 'transform 380ms cubic-bezier(0.22,0.61,0.36,1)';
          text.style.transform  = 'translateX(0)';

          marqueeTimers.push(setTimeout(() => {
            text.style.transition = `transform ${duration}s linear`;
            text.style.transform  = `translateX(-${distance}px)`;
          }, 900));

          marqueeTimers.push(setTimeout(loop, 900 + duration * 1000 + 900));
        };
        loop();
      });
    }

    // Cycle through a few tracks to show marquee in action
    const tracks = [
      { title: 'Goodbye',                                         artist: 'Sloucho · Rory Sweeney' },
      { title: 'Power Plant',                                     artist: 'Sloucho' },
      { title: 'Rhinestones (ft. Lil Skag · Ahmed, with Love)',  artist: 'Sloucho' },
      { title: 'Sky Path',                                        artist: 'Ultra Marinu 4000' },
      { title: 'Silver Veil',                                     artist: 'Sloucho · Brawni' },
    ];
    let i = 0;

    function setTrack(t) {
      document.getElementById('trackTitle').textContent  = t.title;
      document.getElementById('trackArtist').textContent = t.artist;
      runMarquee();
    }

    setTrack(tracks[0]);
    setInterval(() => {
      i = (i + 1) % tracks.length;
      setTrack(tracks[i]);
    }, 5000);
  </script>

</body>
</html>
