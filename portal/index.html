  <script>
    (async () => {
      try {
        const hash = window.location.hash || "";
        if (!window.supa || !hash.includes("access_token")) return;

        const params = new URLSearchParams(hash.slice(1));
        const access_token = params.get("access_token");
        const refresh_token = params.get("refresh_token");
        const error = params.get("error");
        const error_description = params.get("error_description");

        if (error) {
          alert(`Authentication error: ${error_description || error}`);
          const cleanErrUrl = new URL(window.location.href);
          cleanErrUrl.hash = "";
          history.replaceState({}, "", cleanErrUrl.toString());
          return;
        }

        if (access_token && refresh_token) {
          const { error: sessionError } = await window.supa.auth.setSession({
            access_token,
            refresh_token,
          });
          if (sessionError) {
            alert(`Session error: ${sessionError.message}`);
          } else {
            console.log("[cards] Session restored from magic link");
          }
        }

        // Strip the hash but keep the existing path + query (so ?code=... stays)
        const cleanUrl = new URL(window.location.href);
        cleanUrl.hash = "";
        window.location.replace(cleanUrl.toString());
      } catch (e) {
        console.error("[supabase] Magic link processing failed:", e);
      }
    })();
  </script>

<script>
    
    // Use the existing modal styles for the card portal
    function renderCardPortal(innerHtml) {
      let overlay = document.getElementById('card-modal-overlay');

      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'card-modal-overlay';
        overlay.className = 'modal-overlay show'; // uses your existing CSS
        document.body.appendChild(overlay);
      } else {
        overlay.classList.add('show');
      }

      overlay.innerHTML = `
        <div class="login-modal">
          ${innerHtml}
        </div>
      `;
    }

   
   // ===== Card code + Supabase lookup =====
   async function initCardFlow() {
     const params = new URLSearchParams(window.location.search);
     const code = (params.get('code') || '').trim();

     // If there is no ?code, just run the normal portal UI
     if (!code) {
       document.body.classList.remove('card-portal-active');
       console.log('[cards] No ?code in URL – normal page load');
       return true;
     }

     // Card flow is active → hide normal page chrome (nav, player, etc.)
     document.body.classList.add('card-portal-active');

     if (!window.supa) {
       console.error('[cards] Supabase client not initialised');
       return true;
     }

     console.log('[cards] Looking up card with code:', code);

     const { data: card, error } = await window.supa
       .from('NFCCard')
       .select('*')
       .eq('public_code', code)
       .maybeSingle();

     if (error) {
       console.error('[cards] Error fetching card:', error);
       showInvalidCardMessage();
       return false;
     }

     if (!card || card.active === false) {
       console.warn('[cards] No active card found for code:', code);
       showInvalidCardMessage();
       return false;
     }

     window.__CURRENT_CARD__ = card;
      console.log('[cards] Card OK:', card);

      const { data: { user } } = await window.supa.auth.getUser();
      console.log('[cards] Current user:', user?.email);

      // If the card is unclaimed and we already have a user (coming from magic link),
      // auto-claim it for that user.
      if (!card.claimed_by_email && user) {
        const { error: claimError } = await window.supa
          .from('NFCCard')
          .update({
            claimed_by_email: user.email,
            claimed_at: new Date().toISOString()
          })
          .eq('id', card.id);

        if (claimError) {
          console.error('[cards] Error claiming card:', claimError);
        } else {
          console.log('[cards] Card claimed by', user.email);
          card.claimed_by_email = user.email; // keep local copy in sync
        }
      }

      // Decide what to show based on final card + user state

      // Still unclaimed and no user → show claim form
      if (!card.claimed_by_email && !user) {
        showClaimUI(card);
        return false;
      }

      // Card is claimed but no user → ask them to log in
      if (card.claimed_by_email && !user) {
        showReturnLoginUI(card);
        return false;
      }

      // User is logged in but it's the wrong email
      if (user && user.email !== card.claimed_by_email) {
        showAlreadyClaimedUI(card);
        return false;
      }

      // Happy path: user is logged in and owns the card
      if (user && user.email === card.claimed_by_email) {
        console.log('[cards] User owns this card – redirecting to main portal');
        window.location.href = `${location.origin}/portal`;
        return false;
      }

      // Fallback
      showReturnLoginUI(card);
      return false;
    }



    
    function showClaimUI(card) {
      renderCardPortal(`
        <h2 style="margin-bottom: 8px;">Activate Your Broken Spirit Card</h2>
        <p style="font-size: 14px; opacity: 0.8; margin-bottom: 16px;">
          Enter your email to activate your account <br> and claim your card.
        </p>

        <div class="form-group">
          <input
            id="claimEmail"
            type="email"
            class="form-input"
            placeholder="Enter email"
            autocomplete="email"
          />
        </div>

        <button type="button" class="form-button" id="cardClaimButton">
          Claim Card
        </button>

        <p id="claimError" style="font-size: 12px; color: #f97373; margin-top: 8px; min-height: 16px;"></p>
      `);

      const btn = document.getElementById('cardClaimButton');
      if (btn) btn.addEventListener('click', submitClaimEmail);
    }

    async function submitClaimEmail() {
      const input = document.getElementById("claimEmail");
      const errorEl = document.getElementById("claimError");
      if (!input || !errorEl) return;

      const email = input.value.trim();
      if (!email) {
        errorEl.textContent = "Please enter an email address.";
        input.focus();
        return;
      }

      const code = window.__CURRENT_CARD__?.public_code;
      if (!code) {
        errorEl.textContent = "Missing card code.";
        return;
      }

      const { error } = await window.supa.auth.signInWithOtp({
        email,
        options: {
          // bring them back to the same card URL
          emailRedirectTo: `${location.origin}/portal?code=${encodeURIComponent(code)}`
        }
      });

      if (error) {
        errorEl.textContent = error.message;
        return;
      }

      renderCardPortal(`
        <h2 style="margin-bottom: 8px;">Check your email</h2>
        <p style="font-size: 14px; opacity: 0.8;">
          We’ve sent a magic link to <strong>${email}</strong>.<br/>
          Click the link in your email to finish set-up.
        </p>
      `);
    }

    function showAlreadyClaimedUI(card) {
      renderCardPortal(`
        <h2 style="margin-bottom: 8px;">Card already claimed</h2>
        <p style="font-size: 14px; opacity: 0.8; margin-bottom: 12px;">
          This card is registered to<br/>
          <strong>${card.claimed_by_email}</strong>.
        </p>
        <p style="font-size: 13px; opacity: 0.7;">
          If you bought this second-hand or think this is a mistake,
          email <strong>hello@brokenspirit.zone</strong>.
        </p>
      `);
    }


    function showReturnLoginUI(card) {
      renderCardPortal(`
        <h2 style="margin-bottom: 8px;">Log back in</h2>
        <p style="font-size: 14px; opacity: 0.8; margin-bottom: 16px;">
          This card belongs to <strong>${card.claimed_by_email}</strong>.<br/>
          Enter that email to get a new magic link.
        </p>

        <div class="form-group">
          <input
            id="returnEmail"
            type="email"
            class="form-input"
            placeholder="Email"
            autocomplete="email"
          />
        </div>

        <button type="button" class="form-button" id="cardReturnButton">
          Send login link
        </button>

        <p id="returnError" style="font-size: 12px; color: #f97373; margin-top: 8px; min-height: 16px;"></p>
      `);

      const btn = document.getElementById('cardReturnButton');
      if (btn) btn.addEventListener('click', returnLogin);
    }

    async function returnLogin() {
      const input = document.getElementById("returnEmail");
      const errorEl = document.getElementById("returnError");
      if (!input || !errorEl) return;

      const email = input.value.trim();
      if (!email) {
        errorEl.textContent = "Please enter your email.";
        input.focus();
        return;
      }

      const code = window.__CURRENT_CARD__?.public_code;
      if (!code) {
        errorEl.textContent = "Missing card code.";
        return;
      }

      const { error } = await window.supa.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: `${location.origin}/portal?code=${encodeURIComponent(code)}`
        }
      });

      if (error) {
        errorEl.textContent = error.message;
        return;
      }

      renderCardPortal(`
        <h2 style="margin-bottom: 8px;">Check your inbox</h2>
        <p style="font-size: 14px; opacity: 0.8;">
          We’ve sent a login link to <strong>${email}</strong>.
        </p>
      `);
    }


    function showDownloadUI(card) {
      renderCardPortal(`
        <h2 style="margin-bottom: 8px;">Your Broken Spirit Download</h2>
        <p style="font-size: 14px; opacity: 0.8; margin-bottom: 16px;">
          This card is unlocked on your account.
        </p>

        <button
          type="button"
          class="form-button"
          onclick="window.location.href='/downloads/bs-pack.zip'"
        >
          Download Pack
        </button>
      `);
    }

  
      async function gatePortalAccess() {
        try {
          // If we are in card flow (?code=...), don't gate — card UI is in charge.
          const params = new URLSearchParams(window.location.search);
          const codeFromUrl = (params.get('code') || '').trim();
          if (codeFromUrl) {
            console.log('[portal] In card flow (?code=...), skipping portal gate');
            return;
          }

          if (!window.supa) {
            console.warn('[portal] Supabase not ready, skipping gate');
            return;
          }

          // 1) Check session
          const { data: { user } } = await window.supa.auth.getUser();

          if (!user) {
            console.log('[portal] No logged-in user – locking portal');
            showPortalLocked();
            return;
          }

          // 2) Check if this email owns at least one active NFCCard
          const { data: cards, error } = await window.supa
            .from('NFCCard')
            .select('id')
            .eq('claimed_by_email', user.email)
            .eq('active', true)
            .limit(1);

          if (error) {
            console.error('[portal] Error checking NFCCard ownership:', error);
            showPortalLocked();
            return;
          }

          if (!cards || !cards.length) {
            console.log('[portal] User logged in but has no active cards – locking portal');
            showPortalLocked();
            return;
          }

          console.log('[portal] Portal access granted for', user.email);
          // Nothing else to do: user sees the normal portal.
        } catch (err) {
          console.error('[portal] gatePortalAccess failed:', err);
          showPortalLocked();
        }
      }

    function showPortalLocked() {
      // mark the body as locked so we can hide the portal UI
      document.body.classList.add('portal-locked');

      const existing = document.getElementById('portalLockOverlay');
      if (existing) existing.remove();

      const overlay = document.createElement('div');
      overlay.id = 'portalLockOverlay';
      overlay.className = 'modal-overlay show';

      overlay.innerHTML = `
        <div class="login-modal">
          <h2 style="margin-bottom:8px;">Broken Spirit</h2>
          <p style="font-size:14px; opacity:0.8; margin-bottom:16px;">
            A Broken Spirit NFC card is needed to access this page.
          </p>
          <button
            type="button"
            class="form-button"
            onclick="window.location.href='https://YOUR-SHOPIFY-URL-HERE'"
          >
            Buy the Broken Spirit Card
          </button>
        </div>
      `;

      document.body.appendChild(overlay);
    }



    function showInvalidCardMessage() {
      // Replace body content with a simple error screen
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#000;
          color:#fff;
          padding:2rem;
          text-align:center;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', sans-serif;
        ">
          <div>
            <p style="font-size:14px; opacity:0.85;">This card code is not valid or has been disabled.</p>
            <p style="margin-top:8px; font-size:12px; opacity:0.6;">
              If you think this is a mistake, email <span style="white-space:nowrap;">hello@brokenspirit.zone</span>
            </p>
          </div>
        </div>
      `;
    }

  // ===== Globals =====
  let scene, camera, renderer;

  // Update loading progress

  // Enhanced preload function with progress tracking
  function preloadAllCharacters() {
    if (carousel.preloadComplete) {
      console.log('✅ Characters already preloaded');
      return Promise.resolve();
    }

    const configs = window.characterConfigs || [];
    if (configs.length === 0) return Promise.resolve();

    console.log('🚀 Starting character preload...');
    showLoading();
    updateLoadingProgress(0, configs.length);

    const loadPromises = configs.map((config, index) => {
      return loadCharacterToCache(index).then(() => {
        updateLoadingProgress(index + 1, configs.length);
        console.log(`✅ Preloaded: ${config.name} (index: ${index})`);
      }).catch(err => {
        console.error(`❌ Failed to preload ${config.name}:`, err);
        updateLoadingProgress(index + 1, configs.length);
      });
    });

    return Promise.all(loadPromises).then(() => {
      carousel.preloadComplete = true;
      hideLoading();
      console.log('🎉 All characters preloaded! Cache state:', carousel.cache.length);
      // Debug: log what's in the cache
      carousel.cache.forEach((entry, i) => {
        if (entry) {

  // Load a single character into cache

  // ===== ENHANCED CHARACTER CREATION =====
  
  window.createCharacter = function() {
    if (!window.scene) {
      console.error('Scene not ready');
      return;
    }

    // Clean up current model properly
    if (currentMixer) {
      try {
        currentMixer.stopAllAction();
        currentMixer.uncacheRoot(currentModel);
      } catch(e) { console.log('Mixer cleanup:', e); }
      currentMixer = null;
    }
    
    if (currentModel) {
      scene.remove(currentModel);
      // Don't dispose if it's from cache - we want to keep the cache intact
      if (!isFromCache(currentModel)) {
        disposeObject(currentModel);
      }
      currentModel = null;
    }

    if (window.character && window.character !== currentModel) {
      try { scene.remove(window.character); } catch {}
      window.character = null;
    }

    const index = window.currentCharacterIndex ?? 0;
    
    // Try to get from cache first
    const cached = getCharacterFromCache(index);
    if (cached && carousel.preloadComplete) {
      console.log(`📦 Loading ${cached.config.name} from cache...`);
      loadFromCache(index, cached);
      return;
    }
    
    // Fallback to direct loading
    console.log(`⏳ Loading ${window.characterConfigs[index]?.name} directly...`);
    loadCharacterDirectly();
  };

  // Helper to check if model is from cache
  function isFromCache(model) {
    return model && model.userData && model.userData.fromCache === true;
  }

  // Load character from cache with proper animation setup
  function loadFromCache(index, cached) {
    const { gltfData, config, targetHeight } = cached;
    
    // Use the original scene directly - don't clone!
    const root = gltfData.scene || gltfData.scenes?.[0];
    if (!root) {
      console.error('No scene in cached GLTF data');
      return;
    }

    // Remove from any previous parent first
    if (root.parent) {
      root.parent.remove(root);
    }

    // Only process if not already processed
    if (!root.userData.processed) {
      // Center and scale
      centerAndScaleToHeight(root, targetHeight);
      if (config.scaleMul) root.scale.multiplyScalar(config.scaleMul);

      // Apply Y offset
      root.userData = root.userData || {};
      if (config.y != null && !root.userData.yApplied) {
        root.position.y += config.y;
        root.userData.yApplied = true;
      }
      root.userData.baseY = root.position.y;
      
      // Setup mesh properties
      root.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
          obj.raycast = THREE.Mesh.prototype.raycast;
          obj.frustumCulled = false;
          
          const storeMaterial = (material) => {
            if (!material) return;
            material.userData = material.userData || {};
            if ('emissive' in material && !material.userData._origEmissive) {
              material.userData._origEmissive = material.emissive.clone();
            }
          };
          
          if (Array.isArray(obj.material)) {
            obj.material.forEach(storeMaterial);
          } else {
            storeMaterial(obj.material);
          }
        }
      });

      root.updateMatrixWorld(true);
      root.userData.processed = true;
    }

    root.userData.fromCache = true;
    root.visible = true;
    
    // Create fresh animation mixer using original GLTF animations
    let freshMixer = null;
    if (gltfData.animations && gltfData.animations.length) {
      freshMixer = new THREE.AnimationMixer(root);
      
      const clips = gltfData.animations;
      const baseClip = THREE.AnimationClip.findByName(clips, 'Idle') ||
                       THREE.AnimationClip.findByName(clips, 'idle') ||
                       clips[0];
      
      if (baseClip) {
        // Apply trimming settings
        const trimStart = Math.max(0, config.trimStart ?? 1.5);
        const trimEnd = Math.max(0, config.trimEnd ?? 2.0);
        const minDur = 0.05;
        const startSec = Math.min(trimStart, Math.max(0, baseClip.duration - minDur));
        const endSec = Math.max(baseClip.duration - trimEnd, startSec + minDur);
        const fps = 30;
        const startFrame = Math.max(0, Math.floor(startSec * fps));
        const endFrame = Math.max(startFrame + 1, Math.ceil(endSec * fps));
        
        // Create trimmed clip with unique name
        const trimmedClip = THREE.AnimationUtils.subclip(
          baseClip,
          `${baseClip.name}_${index}_${Date.now()}`,
          startFrame, endFrame, fps
        );
        
        // Create and start the action
        const action = freshMixer.clipAction(trimmedClip);
        action.setLoop(THREE.LoopPingPong, Infinity);
        action.reset();
        action.setEffectiveWeight(1);
        action.play();
        action.time = 1/60;
        freshMixer.update(0);
        
        console.log(`Animation created for ${config.name}: running=${action.isRunning()}, weight=${action.getEffectiveWeight()}`);
      }
    }
    
    // Add to scene and update references
    scene.add(root);
    currentModel = root;
    currentMixer = freshMixer;
    window.character = root;
    
    // Update camera framing
    frameCameraOnTargetHeight(camera, targetHeight);
    window.updateCharacterInfo();
    
    console.log(`${config.name} loaded from cache with preserved skeleton`);
  }

  // Original character loading method (fallback)
  function loadCharacterDirectly() {
    const list = window.characterConfigs || [];
    const idx = (window.currentCharacterIndex ?? 0) % (list.length || 1);
    const cfg = list[idx];
    if (!cfg || !cfg.url) return;

    const myVersion = ++loadVersion;
    gltfLoader.load(
      cfg.url,
      (gltf) => {
        if (myVersion !== loadVersion) { if (gltf.scene) disposeObject(gltf.scene); return; }
        const root = gltf.scene || gltf.scenes?.[0];
        if (!root) return;

        const targetHeight = cfg.targetHeight ?? 1.8;

        // Center/scale first
        centerAndScaleToHeight(root, targetHeight);
        if (cfg.scaleMul) root.scale.multiplyScalar(cfg.scaleMul);

        // Apply per-character Y offset ONCE and cache the stable baseY
        root.userData = root.userData || {};
        if (cfg.y != null && !root.userData.yApplied) {
          root.position.y += cfg.y;
          root.userData.yApplied = true;
        }
        root.userData.baseY = root.position.y;

        // Make meshes raycast-friendly + cache original emissive
        root.traverse((o) => {
          if (!o.isMesh) return;

          o.castShadow = true;
          o.receiveShadow = true;
          o.raycast = THREE.Mesh.prototype.raycast;
          o.frustumCulled = false;

          const store = (m) => {
            if (!m) return;
            m.userData = m.userData || {};
            if ('emissive' in m && !m.userData._origEmissive) {
              m.userData._origEmissive = m.emissive.clone();
            }
          };
          if (Array.isArray(o.material)) {
            o.material.forEach(store);
          } else {
            store(o.material);
          }
        });

        root.updateMatrixWorld(true);

        // Animations
        if (gltf.animations && gltf.animations.length) {
          currentMixer = new THREE.AnimationMixer(root);
          const clips = gltf.animations;
          const baseClip =
            THREE.AnimationClip.findByName(clips, 'Idle') ||
            THREE.AnimationClip.findByName(clips, 'idle') ||
            clips[0];

          const trimStart = Math.max(0, cfg.trimStart ?? 1.5);
          const trimEnd   = Math.max(0, cfg.trimEnd   ?? 2.0);
          const minDur = 0.05;
          const startSec = Math.min(trimStart, Math.max(0, baseClip.duration - minDur));
          const endSec   = Math.max(baseClip.duration - trimEnd, startSec + minDur);
          const fps = 30;
          const startFrame = Math.max(0, Math.floor(startSec * fps));
          const endFrame   = Math.max(startFrame + 1, Math.ceil(endSec * fps));
          const sub = THREE.AnimationUtils.subclip(
            baseClip,
            (baseClip.name || 'clip') + '_trim',
            startFrame, endFrame, fps
          );

          const action = currentMixer.clipAction(sub);
          action.setLoop(THREE.LoopPingPong, Infinity)
                .reset()
                .setEffectiveWeight(1)
                .play();
          action.time = 1/60;
          currentMixer.update(0);
        } else {
          currentMixer = null;
        }

        root.name = 'CHARACTER';
        scene.add(root);
        currentModel = root;
        window.character = root;

        frameCameraOnTargetHeight(camera, targetHeight);
        window.updateCharacterInfo?.();
      },
      undefined,
      (err) => console.error('GLB load error for', cfg.url, err)
    );
  }

  function centerAndScaleToHeight(root, targetHeight = 1.8) {
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    root.position.sub(center);
    root.position.y += targetHeight * 0.5;
    const h = Math.max(size.y, 1e-6);
    const s = targetHeight / h;
    root.scale.multiplyScalar(s);
  }

    function frameCameraOnTargetHeight(
      camera,
      targetHeight = 1.8,
      pad = 1.4,
      centerYFactor = 0.01
    ) {
      const fovRad = (camera.fov * Math.PI) / 180;
      const halfH  = (targetHeight * pad) / 2;
      const dist   = halfH / Math.tan(fovRad / 2);
      const cy     = targetHeight * centerYFactor;

      camera.position.set(0, cy, dist);
      camera.lookAt(0, cy, 0);
      camera.updateProjectionMatrix();
    }

    function tickAnimations() {
      const dt = Math.min(clock.getDelta(), 0.033);
      
      // Update the current character's mixer
      if (currentMixer) {
        try {
          currentMixer.update(dt);
        } catch(e) {
          console.warn('Animation update error:', e);
        }
      }
    }

  let simpleSwipe = { active: false, startX: 0, threshold: 50 };

  function attachSimpleSwipeInput() {
    if (simpleSwipe.active) return;
    
    const dom = renderer.domElement;
    simpleSwipe.active = true;
    
    function onStart(e) {
      simpleSwipe.startX = e.touches ? e.touches[0].clientX : e.clientX;
    }
    
    function onEnd(e) {
      const endX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const deltaX = endX - simpleSwipe.startX;
      
      if (Math.abs(deltaX) > simpleSwipe.threshold) {
        if (deltaX > 0) {
          window.previousCharacter();
        } else {
          window.nextCharacter();
        }
      }
    }
    
    dom.addEventListener('touchstart', onStart);
    dom.addEventListener('touchend', onEnd);
    dom.addEventListener('mousedown', onStart);
    dom.addEventListener('mouseup', onEnd);
    
    simpleSwipe.handlers = { onStart, onEnd, dom };
  }

  function detachSimpleSwipeInput() {
    if (!simpleSwipe.active || !simpleSwipe.handlers) return;
    
    const { onStart, onEnd, dom } = simpleSwipe.handlers;
    dom.removeEventListener('touchstart', onStart);
    dom.removeEventListener('touchend', onEnd);
    dom.removeEventListener('mousedown', onStart);
    dom.removeEventListener('mouseup', onEnd);
    
    simpleSwipe.active = false;
    simpleSwipe.handlers = null;
  }

  function disposeObject(obj) {
    obj?.traverse?.((node) => {
      if (node.isMesh) {
        node.geometry?.dispose?.();
        const mat = node.material;
        if (Array.isArray(mat)) {
          mat.forEach(m => { m.map?.dispose?.(); m.normalMap?.dispose?.(); m.roughnessMap?.dispose?.(); m.metalnessMap?.dispose?.(); m.emissiveMap?.dispose?.(); m.dispose?.(); });
        } else if (mat) {
          mat.map?.dispose?.(); mat.normalMap?.dispose?.(); mat.roughnessMap?.dispose?.(); mat.metalnessMap?.dispose?.(); mat.emissiveMap?.dispose?.(); mat.dispose?.();
        }
      }
    });
  }

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0x1a1a2a, 0.7); scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, 1); key.position.set(5, 8, 6); key.castShadow = true; key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=0.1; key.shadow.camera.far=50; scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-4, 5, 6); scene.add(fill);
    const rim  = new THREE.DirectionalLight(0x88aaff, 0.5); rim.position.set(-5, 2, -6); scene.add(rim);

      hemi: hemi.intensity, key: key.intensity, fill: fill.intensity, rim: rim.intensity
    };

    // Raycasting
    raycaster = new THREE.Raycaster();

    // Events
    //  renderer.domElement.addEventListener('click', onCanvasClick);
    window.addEventListener('resize', onWindowResize);

    setFixedTitleWidth("Super Maramu 2000");

  function animate() {
    requestAnimationFrame(animate);
    tickAnimations();
    renderer.render(scene, camera);
  }
  
  let clickPreventUntil = 0;
  
  function onCanvasClick(e) {
    if (performance.now() < clickPreventUntil) return;

    if (carousel && carousel.mode === 'carousel') {
      const cfg = window.characterConfigs?.[window.currentCharacterIndex];
      if (cfg && cfg.status !== 'Locked') exitCarousel(true);
      return;
    }

    const root = currentModel || window.character;
    if (!root || !camera || !renderer) return;

    root.updateMatrixWorld(true);

    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );

    raycaster.setFromCamera(ndc, camera);

    const hits = raycaster.intersectObject(root, true);
    if (hits.length > 0) {
      window.onCharacterClick();
      return;
    }

    // Fallback: screen-space AABB check
    const box = new THREE.Box3().setFromObject(root);
    if (!box.isEmpty()) {
      const corners = [
        new THREE.Vector3(box.min.x, box.min.y, box.min.z),
        new THREE.Vector3(box.min.x, box.max.y, box.min.z),
        new THREE.Vector3(box.max.x, box.min.y, box.min.z),
        new THREE.Vector3(box.max.x, box.max.y, box.min.z),
        new THREE.Vector3(box.min.x, box.min.y, box.max.z),
        new THREE.Vector3(box.min.x, box.max.y, box.max.z),
        new THREE.Vector3(box.max.x, box.min.y, box.max.z),
        new THREE.Vector3(box.max.x, box.max.y, box.max.z),
      ];
      let minX =  Infinity, minY =  Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const v of corners) {
        v.project(camera);
        const sx = (v.x * 0.5 + 0.5) * rect.width  + rect.left;
        const sy = (-v.y * 0.5 + 0.5) * rect.height + rect.top;
        minX = Math.min(minX, sx); maxX = Math.max(maxX, sx);
        minY = Math.min(minY, sy); maxY = Math.max(maxY, sy);
      }
      if (e.clientX >= minX && e.clientX <= maxX && e.clientY >= minY && e.clientY <= maxY) {
        window.onCharacterClick();
      }
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function onMouseMove(e) {
    mouseNDC.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    if (carousel.mode === 'carousel') return;
    checkHover();
  }

  function selectorOpen() {
    return !!document.getElementById('characterControls')?.classList.contains('show');
  }

  function checkHover() {
    if (!window.character) return;
    if (selectorOpen()) {
      if (lastHoverState) { setCharacterHighlight(false); lastHoverState = false; }
      return;
    }
    raycaster.setFromCamera(mouseNDC, camera);
    const intersects = raycaster.intersectObjects(window.character.children, true);
    hoverActive = intersects.length > 0;
    if (hoverActive !== lastHoverState) { setCharacterHighlight(hoverActive); lastHoverState = hoverActive; }
  }

  function setCharacterHighlight(active) {
    if (!window.scene || !window.character) return;
    if (active) {
      if (!hoverLight) {
        hoverLight = new THREE.PointLight(0x88aaff, 0.35, 3, 2);
        hoverLight.castShadow = false;
        hoverLight.position.set(0, 1.2, 1.6);
        window.character.add(hoverLight);
      }
    } else {
      if (hoverLight) { hoverLight.parent?.remove(hoverLight); hoverLight = null; }
      window.character.traverse(obj => {
           if (!obj.isMesh || !obj.material) return;
           const restore = (m) => {
             if (!m) return;
             if ('emissive' in m) {
               const orig = m.userData && m.userData._origEmissive;
               if (orig) m.emissive.copy(orig);
             }
           };
           if (Array.isArray(obj.material)) obj.material.forEach(restore); else restore(obj.material);
         });
    }
  }

  function setFixedTitleWidth(ghostString) {
    const nameEl = document.getElementById('characterName');
    if (!nameEl) return;
    const measurer = document.createElement('span');
    measurer.style.position = 'absolute';
    measurer.style.visibility = 'hidden';
    measurer.style.whiteSpace = 'nowrap';
    measurer.style.fontFamily = getComputedStyle(nameEl).fontFamily;
    measurer.style.fontSize = getComputedStyle(nameEl).fontSize;
    measurer.style.fontWeight = getComputedStyle(nameEl).fontWeight;
    measurer.textContent = ghostString;
    document.body.appendChild(measurer);
    const width = Math.ceil(measurer.getBoundingClientRect().width);
    document.body.removeChild(measurer);
    document.documentElement.style.setProperty('--title-width', width + 'px');
    const info = document.querySelector('.character-info'); if (info) { void getComputedStyle(info).width; }
  }

    // ===== UI bits =====
    function toggleMenu() { document.getElementById('menuTray').classList.toggle('open');
        
    }
      function handleLogin() { document.getElementById('loginModal').classList.add('show');
      }

    function closeLoginModal() { document.getElementById('loginModal').classList.remove('show');
    }

    function switchTab(tab) {
      const tabs = document.querySelectorAll('.modal-tab');
      const loginForm = document.getElementById('loginForm');
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const signupForm = document.getElementById('signupForm');
        
        tabs.forEach(t => t.classList.remove('active'));
        if (tab === 'login') { tabs[0].classList.add('active'); loginForm.style.display = 'block'; signupForm.style.display = 'none'; }
        else { tabs[1].classList.add('active'); loginForm.style.display = 'none'; signupForm.style.display = 'block'; }
      }); // <-- fixed closing here
    }

    document.addEventListener('click', function(e) {
      const tray = document.getElementById('menuTray');
      const btn = document.querySelector('.menu-button');
      if (tray && !tray.contains(e.target) && !btn.contains(e.target)) tray.classList.remove('open');
    });
    document.getElementById('loginModal').addEventListener('click', function(e) { if (e.target === this) closeLoginModal(); });

    
    // ===== Simple password gate =====
    const SITE_PASSWORD = 'SLOUCHOLOVESYOU'; // <-- change this to whatever you want

    function initPasswordGate() {
      const overlay = document.getElementById('passwordOverlay');
      const input = document.getElementById('sitePasswordInput');
      const submit = document.getElementById('sitePasswordSubmit');
      const error = document.getElementById('passwordError');

      if (!overlay || !input || !submit) return;

      // Show the overlay as soon as JS runs


      function tryUnlock() {
        const value = (input.value || '').trim();

        if (value === SITE_PASSWORD) {
          overlay.style.display = 'none';
          input.value = '';
          if (error) error.textContent = '';
        } else {
          if (error) error.textContent = 'Wrong password. Try again.';
          input.value = '';
          input.focus();
        }
      }

      submit.addEventListener('click', tryUnlock);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          tryUnlock();
        }
      });
    }

    
    window.addEventListener('load', async () => {
      // 1) Run the card flow first (for ?code=... URLs)
      const cardOk = await initCardFlow();

      // If this was a card URL and the card UI took over (claim / download / error),
      // stop here and don't boot the portal UI – keep portal-hidden so nothing flashes.
      if (!cardOk) {
        console.log('[boot] Card flow took over, skipping portal init');
        return;
      }

      // 2) Normal portal initialisation (3D + audio)
      if (typeof THREE === 'undefined') {
        console.error('Three.js not loaded');
        return;
      }

      initLoaders();
      initThreeJS();

      createCharacter();
      animate();

      setTimeout(() => {
        preloadAllCharacters()
          .then(() => console.log('🚀 All characters ready for instant switching!'))
          .catch(err => console.error('Preload failed:', err));
      }, 1000);

      document.getElementById('prevArrow')?.addEventListener('click', window.previousCharacter);
      document.getElementById('nextArrow')?.addEventListener('click', window.nextCharacter);

      // 3) Lock the portal for people without cards
      await gatePortalAccess();

      // 4) If the portal is NOT locked, reveal the shell (remove the anti-flash class)
      if (!document.body.classList.contains('portal-locked')) {
        document.body.classList.remove('portal-hidden');
      }
      // If it IS locked, portal-locked CSS + portal-hidden keep the background invisible,
      // and only the "Buy the Broken Spirit Card" modal is visible.
    });


    window.addEventListener('keydown', (e) => {
      if (carousel.mode !== 'carousel') return;
      if (e.key === 'ArrowLeft') window.previousCharacter();
      if (e.key === 'ArrowRight') window.nextCharacter();
    });

    // ===== Mobile zoom suppression =====
    (function () {
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
    document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });
    document.addEventListener('touchstart', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function (e) { if (typeof e.scale === 'number' && e.scale !== 1) e.preventDefault(); }, { passive: false });
    // Login form handler



    (function () {
        const emailInput = document.getElementById('loginEmail');   // your modal email input
        const loginBtn   = document.getElementById('loginSubmit');  // your modal button

        if (!emailInput || !loginBtn) return; // modal not on this page

        function magicRedirect() {
          const isInIframe = window !== window.top;
          // Changed from /packs to /landing-page/
          return isInIframe
            ? 'https://ouchworld.netlify.app/landing-page/'
            : `${location.origin}/landing-page/`;
        }

        loginBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          const email = (emailInput.value || '').trim();
          if (!email) return alert('Enter your email');
          if (!window.supa?.auth) return alert('Auth not initialized');

          loginBtn.disabled = true; const old = loginBtn.textContent; loginBtn.textContent = 'Sending…';
          const { error } = await window.supa.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: magicRedirect() }
          });
          loginBtn.disabled = false; loginBtn.textContent = old;

          if (error) alert(error.message);
          else alert('Check your email for the magic link!');
        });
    })();
    // click behavior
    document.getElementById('enterCarouselBtn')?.addEventListener('click', () => {
      if (carousel.mode === 'view') window.onCharacterClick?.();   // enter carousel
      else window.confirmCharacter?.();                             // confirm & exit
    });

    // in enterCarousel(): add the 'tick' class
    const btn = document.getElementById('enterCarouselBtn');
    if (btn) {
      btn.classList.add('tick');
      btn.setAttribute('aria-label', 'Confirm Character');
    }

    // in exitCarousel(): remove 'tick'
    if (btn) {
      btn.classList.remove('tick');
      btn.setAttribute('aria-label', 'Choose Character');
    }

    // ===== Audio playlist: WARP-STYLE BAR =====
    (function () {
      const audioEl         = document.getElementById('mysteryGiftAudio');
      const progressTrack   = document.getElementById('audioProgressTrack');
      const progressFill    = document.getElementById('audioProgressFill');
      const currentTimeEl   = document.getElementById('audioCurrentTime');
      const durationEl      = document.getElementById('audioDuration');
      const trackListEl     = document.getElementById('audioTrackList');
      const playPauseBtn    = document.getElementById('audioPlayPause');
      const nowTitleEl      = document.getElementById('nowPlayingTitle');
      const playerEl        = document.querySelector('.audio-player');
      const toggleTracksBtn = document.getElementById('audioToggleTracks');

      if (!audioEl || !trackListEl) return;

      const trackButtons = Array.from(
        trackListEl.querySelectorAll('.audio-track-row')
      );

      let currentIndex  = 0;
      let isScrubbing   = false;

      function clamp01(x) {
        return Math.max(0, Math.min(1, x));
      }

      function formatTime(seconds) {
        if (!isFinite(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
      }

      function updateNowPlayingTitle() {
        if (!nowTitleEl) return;
        const btn = trackButtons[currentIndex];
        if (!btn) return;
        const titleSpan = btn.querySelector('.track-title');
        if (titleSpan) {
          nowTitleEl.textContent = titleSpan.textContent.trim();
        }
      }

      function updateTrackStates(isPlaying) {
        trackButtons.forEach((btn, i) => {
          const playingThis = isPlaying && i === currentIndex;
          btn.classList.toggle('active', i === currentIndex);
          btn.classList.toggle('playing', playingThis);
        });
        updateNowPlayingTitle();
      }

      function updateProgressVisual() {
        if (!progressTrack || !progressFill || !audioEl.duration) return;
        const ratio = clamp01(audioEl.currentTime / audioEl.duration);
        progressFill.style.transform = `scaleX(${ratio})`;
      }

      function loadTrack(index, autoplay = false) {
        if (!trackButtons.length) return;
        if (index < 0 || index >= trackButtons.length) index = 0;

        currentIndex = index;
        const btn = trackButtons[currentIndex];
        const src = btn.getAttribute('data-src');
        if (!src) return;

        audioEl.src = src;
        audioEl.load();

        updateTrackStates(false);

        if (autoplay) {
          audioEl.play().catch(err => console.error(err));
        }
      }


      // Clicking a row = play/pause that track
      trackButtons.forEach((btn, index) => {
        btn.addEventListener('click', () => {
          if (index === currentIndex) {
            if (audioEl.paused || audioEl.ended) {
              audioEl.play().catch(err => console.error(err));
            } else {
              audioEl.pause();
            }
          } else {
            loadTrack(index, true);
          }
        });
      });

      // Play / pause button
      if (playPauseBtn) {
        playPauseBtn.addEventListener('click', () => {
          if (audioEl.paused || audioEl.ended) {
            audioEl.play().catch(err => console.error(err));
          } else {
            audioEl.pause();
          }
        });
      }

      // Scrubbing on the custom bar
      function seekFromEvent(e) {
        if (!progressTrack || !audioEl.duration) return;
        const rect = progressTrack.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const ratio = clamp01((clientX - rect.left) / rect.width);
        audioEl.currentTime = ratio * audioEl.duration;
        updateProgressVisual();
        if (currentTimeEl) currentTimeEl.textContent = formatTime(audioEl.currentTime);
      }

      if (progressTrack) {
        progressTrack.addEventListener('mousedown', (e) => {
          isScrubbing = true;
          seekFromEvent(e);
        });
        window.addEventListener('mousemove', (e) => {
          if (!isScrubbing) return;
          seekFromEvent(e);
        });
        window.addEventListener('mouseup', () => {
          isScrubbing = false;
        });

        progressTrack.addEventListener('touchstart', (e) => {
          isScrubbing = true;
          seekFromEvent(e);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
          if (!isScrubbing) return;
          seekFromEvent(e);
        }, { passive: true });
        window.addEventListener('touchend', () => {
          isScrubbing = false;
        });
      }

      // Time + duration
      audioEl.addEventListener('loadedmetadata', () => {
        if (durationEl) {
          durationEl.textContent = formatTime(audioEl.duration);
        }
        updateProgressVisual();
      });

      audioEl.addEventListener('timeupdate', () => {
        if (!isScrubbing && currentTimeEl) {
          currentTimeEl.textContent = formatTime(audioEl.currentTime);
        }
        if (!isScrubbing) {
          updateProgressVisual();
        }
      });

      audioEl.addEventListener('play', () => {
        updateTrackStates(true);
        if (playPauseBtn) playPauseBtn.classList.add('playing');
      });

      audioEl.addEventListener('pause', () => {
        updateTrackStates(false);
        if (playPauseBtn) playPauseBtn.classList.remove('playing');
      });

      audioEl.addEventListener('ended', () => {
        audioEl.currentTime = 0;
        if (currentTimeEl) currentTimeEl.textContent = '0:00';
        updateProgressVisual();
        updateTrackStates(false);
        if (playPauseBtn) playPauseBtn.classList.remove('playing');
      });

      // Collapsible behaviour (scrubber always visible)
      function setCollapsed(collapsed) {
        if (!playerEl) return;
        playerEl.classList.toggle('collapsed', collapsed);
        if (toggleTracksBtn) {
          toggleTracksBtn.setAttribute('aria-expanded', (!collapsed).toString());
        }
      }

      if (toggleTracksBtn) {
        toggleTracksBtn.addEventListener('click', () => {
          const collapsed = playerEl?.classList.contains('collapsed');
          setCollapsed(!collapsed);
        });
      }

      // Load durations from actual audio files into the list
      function populateTrackDurations() {
        trackButtons.forEach(btn => {
          const src = btn.getAttribute('data-src');
          const timeEl = btn.querySelector('.audio-col-time');
          if (!src || !timeEl) return;

          const probe = new Audio();
          probe.preload = 'metadata';
          probe.src = src;
          probe.addEventListener('loadedmetadata', () => {
            const d = probe.duration;
            if (isFinite(d)) {
              timeEl.textContent = formatTime(d);
            }
          });
        });
      }

      // Initial state
      if (currentTimeEl) currentTimeEl.textContent = '0:00';
      if (durationEl) durationEl.textContent = '0:00';

      loadTrack(0, false);
      setCollapsed(true);
      populateTrackDurations();
    })();







</script>
