    (async function () {
      try {
        if (window.supa && location.hash && location.hash.includes('access_token')) {
          const params = new URLSearchParams(location.hash.slice(1));
          const access_token = params.get('access_token');
          const refresh_token = params.get('refresh_token');
          const error = params.get('error');
          const error_description = params.get('error_description');
          if (error) { alert('Authentication error: ' + (error_description || error)); history.replaceState({}, '', location.pathname + location.search); return; }
          if (access_token && refresh_token) {
            const { error: se } = await window.supa.auth.setSession({ access_token, refresh_token });
            if (se) alert('Session error: ' + se.message); else window.location.reload();
          }
          history.replaceState({}, '', location.pathname + location.search);
        }
      } catch (e) { console.error('[supabase] Magic link processing failed:', e); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #000; color: #fff; touch-action: none; }

    .icon-close { position: relative; }
    .icon-close::before, .icon-close::after {

    }
    @media (hover: none) and (pointer: coarse) {
      #joystick-zone { display: block; }
      #move-hint { display: none; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      const canvas  = document.getElementById('room-canvas');
      const videoEl = document.getElementById('room-video');

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene  = new THREE.Scene();

      // FIX 1: Enormous room — 5x bigger than before, far clip to match
      const roomW = 12000, roomH = 4500, roomD = 14000;
      const EYE_Y = -roomH * 0.3;

      const camera = new THREE.PerspectiveCamera(45, 1, 1, 30000);
      camera.position.set(0, EYE_Y, 0);

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }
      window.addEventListener('resize', resize);
      resize();

      // Video texture
      videoEl.crossOrigin = 'anonymous';
      const videoTexture = new THREE.VideoTexture(videoEl);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.format    = THREE.RGBFormat;
      const wallMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.FrontSide });

      function addWall(w, h, px, py, pz, ry, rx) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
        m.position.set(px, py, pz);
        if (ry) m.rotation.y = ry;
        if (rx) m.rotation.x = rx;
        scene.add(m);
      }
      addWall(roomW, roomH,  0,        0,  -roomD/2,  0,          0);           // front
      addWall(roomW, roomH,  0,        0,   roomD/2,  Math.PI,    0);           // back
      addWall(roomD, roomH, -roomW/2,  0,   0,        Math.PI/2,  0);           // left
      addWall(roomD, roomH,  roomW/2,  0,   0,       -Math.PI/2,  0);           // right
      addWall(roomW, roomD,  0,  roomH/2,   0,        0,           Math.PI/2);  // ceiling
      addWall(roomW, roomD,  0, -roomH/2,   0,        0,          -Math.PI/2);  // floor

      // ── Look state ───────────────────────────────────────────
      let phi = 0, theta = 0.05;
      let velPhi = 0, velTheta = 0, rafInertia = null;

      function updateCamera() {
        theta = Math.max(-Math.PI/2 + 0.02, Math.min(Math.PI/2 - 0.02, theta));
        camera.lookAt(
          camera.position.x + Math.cos(theta) * Math.sin(phi),
          camera.position.y + Math.sin(theta),
          camera.position.z + Math.cos(theta) * Math.cos(phi)
        );
      }
      function runInertia() {
        if (Math.abs(velPhi) > 0.00003 || Math.abs(velTheta) > 0.00003) {
          phi += velPhi; theta += velTheta;
          velPhi *= 0.85; velTheta *= 0.85;
          updateCamera(); rafInertia = requestAnimationFrame(runInertia);
        }
      }

      // ── Desktop: mouse look ──────────────────────────────────
      let mouseDragging = false, mLastX = 0, mLastY = 0;
      canvas.addEventListener('mousedown', e => {
        if (e.target !== canvas) return;
        mouseDragging = true; mLastX = e.clientX; mLastY = e.clientY;
        velPhi = velTheta = 0; cancelAnimationFrame(rafInertia);
        canvas.classList.add('dragging');
        document.getElementById('move-hint').style.opacity = '0';
      });
      window.addEventListener('mousemove', e => {
        if (!mouseDragging) return;
        velPhi   = -(e.clientX - mLastX) * 0.002;
        velTheta = -(e.clientY - mLastY) * 0.002;
        phi += velPhi; theta += velTheta;
        mLastX = e.clientX; mLastY = e.clientY; updateCamera();
      });
      window.addEventListener('mouseup', () => {
        mouseDragging = false; canvas.classList.remove('dragging');
        rafInertia = requestAnimationFrame(runInertia);
      });

      // ── Desktop: WASD ────────────────────────────────────────
      const keys = {};
      window.addEventListener('keydown', e => { keys[e.code] = true; document.getElementById('move-hint').style.opacity = '0'; });
      window.addEventListener('keyup',   e => { keys[e.code] = false; });

      const SPEED   = 18;
      const HALF_W  = roomW / 2 - 20;
      const HALF_D  = roomD / 2 - 20;

      function applyKeyMovement() {
        const fX = Math.sin(phi), fZ = Math.cos(phi);
        const rX = Math.cos(phi), rZ = -Math.sin(phi);
        let dx = 0, dz = 0;
        if (keys['KeyW'] || keys['ArrowUp'])    { dx += fX; dz += fZ; }
        if (keys['KeyS'] || keys['ArrowDown'])  { dx -= fX; dz -= fZ; }
        if (keys['KeyA'] || keys['ArrowLeft'])  { dx -= rX; dz -= rZ; }
        if (keys['KeyD'] || keys['ArrowRight']) { dx += rX; dz += rZ; }
        if (!dx && !dz) return;
        const len = Math.sqrt(dx*dx + dz*dz);
        camera.position.x = Math.max(-HALF_W, Math.min(HALF_W, camera.position.x + (dx/len)*SPEED));
        camera.position.z = Math.max(-HALF_D, Math.min(HALF_D, camera.position.z + (dz/len)*SPEED));
        camera.position.y = EYE_Y;
        updateCamera();
      }

      // ── Mobile: dual-touch (joystick left, look right) ───────
      const jZone = document.getElementById('joystick-zone');
      const jKnob = document.getElementById('joystick-knob');
      const J_RADIUS = 33;
      let jTouchId = -1, jActive = false, jDx = 0, jDz = 0;
      let lookTouchId = -1, lLastX = 0, lLastY = 0;

      jZone.addEventListener('touchstart', e => {
        e.stopPropagation();
        const t = e.changedTouches[0];
        jTouchId = t.identifier; jActive = true;
        moveKnob(t.clientX, t.clientY);
      }, { passive: true });

      canvas.addEventListener('touchstart', e => {
        for (const t of e.changedTouches) {
          if (lookTouchId === -1) {
            lookTouchId = t.identifier; lLastX = t.clientX; lLastY = t.clientY;
            velPhi = velTheta = 0; cancelAnimationFrame(rafInertia);
          }
        }
      }, { passive: true });

      window.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) {
          if (t.identifier === jTouchId) {
            moveKnob(t.clientX, t.clientY);
          }
          if (t.identifier === lookTouchId) {
            velPhi   = -(t.clientX - lLastX) * 0.003;
            velTheta = -(t.clientY - lLastY) * 0.003;
            phi += velPhi; theta += velTheta;
            lLastX = t.clientX; lLastY = t.clientY;
            updateCamera();
          }
        }
        e.preventDefault();
      }, { passive: false });

      window.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
          if (t.identifier === jTouchId) {
            jActive = false; jTouchId = -1; jDx = 0; jDz = 0;
            jKnob.style.transform = 'translate(-50%, -50%)';
          }
          if (t.identifier === lookTouchId) {
            lookTouchId = -1;
            rafInertia = requestAnimationFrame(runInertia);
          }
        }
      }, { passive: true });

      function moveKnob(cx, cy) {
        const r = jZone.getBoundingClientRect();
        const ox = cx - (r.left + r.width  / 2);
        const oy = cy - (r.top  + r.height / 2);
        const dist  = Math.min(Math.sqrt(ox*ox + oy*oy), J_RADIUS);
        const angle = Math.atan2(oy, ox);
        jKnob.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
        // jDx = screen-right, jDz = screen-down
        jDx = (dist / J_RADIUS) * Math.cos(angle);
        jDz = (dist / J_RADIUS) * Math.sin(angle);
      }

      function applyJoystickMovement() {
        if (!jActive || (!jDx && !jDz)) return;
        const fX = Math.sin(phi), fZ = Math.cos(phi); // forward
        const rX = Math.cos(phi), rZ = -Math.sin(phi); // right
        // FIX 2: negate jDx so left on joystick = strafe left
        const dx = fX * (-jDz) + rX * (-jDx);
        const dz = fZ * (-jDz) + rZ * (-jDx);
        const len = Math.sqrt(dx*dx + dz*dz) || 1;
        camera.position.x = Math.max(-HALF_W, Math.min(HALF_W, camera.position.x + (dx/len)*SPEED));
        camera.position.z = Math.max(-HALF_D, Math.min(HALF_D, camera.position.z + (dz/len)*SPEED));
        camera.position.y = EYE_Y;
        updateCamera();
      }

      // Desktop video unlock on first gesture
      let videoUnlocked = false;
      function unlockVideo() {
        if (videoUnlocked) return;
        videoEl.play().then(() => { videoUnlocked = true; }).catch(() => {});
      }
      ['mousedown','keydown','wheel'].forEach(ev => window.addEventListener(ev, unlockVideo, { once: true, capture: true }));
      videoEl.play().catch(() => {});

      updateCamera();

      function animate() {
        requestAnimationFrame(animate);
        applyKeyMovement();
        applyJoystickMovement();
        if (videoEl.readyState >= videoEl.HAVE_CURRENT_DATA) videoTexture.needsUpdate = true;
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>

  <script>
    // ===== Menu / Modal =====
    function toggleMenu() { document.getElementById('menuTray')?.classList.toggle('open'); }

    async function handleLogin() {
      const modal = document.getElementById('loginModal');
      if (!modal || !window.supa) return;
      const loggedInView = document.getElementById('accountLoggedIn');
      const loginForm    = document.getElementById('loginForm');
      const emailEl      = document.getElementById('accountEmail');
      const { data: { user } } = await window.supa.auth.getUser();
      if (user) {
        if (emailEl) emailEl.textContent = user.email || '';
        if (loggedInView) loggedInView.style.display = 'block';
        if (loginForm)    loginForm.style.display    = 'none';
      } else {
        if (loggedInView) loggedInView.style.display = 'none';
        if (loginForm)    loginForm.style.display    = 'block';
      }
      modal.classList.add('show');
    }

    function closeLoginModal() { document.getElementById('loginModal')?.classList.remove('show'); }

    async function logout() {
      try { await window.supa?.auth?.signOut(); closeLoginModal(); }
      catch (e) { console.error('[auth] signOut failed', e); }
    }

    document.addEventListener('click', function(e) {
      const tray = document.getElementById('menuTray');
      const btn  = document.querySelector('.menu-button');
      if (tray && btn && !tray.contains(e.target) && !btn.contains(e.target)) tray.classList.remove('open');
    });
    document.getElementById('loginModal')?.addEventListener('click', function(e) { if (e.target === this) closeLoginModal(); });
    document.getElementById('logoutBtn')?.addEventListener('click', logout);

    // Mobile zoom suppression
    (function () {
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = Date.now(); if (now - lastTouchEnd <= 300) e.preventDefault(); lastTouchEnd = now;
      }, { passive: false });
    })();
    document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });
    document.addEventListener('touchstart', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function (e) { if (typeof e.scale === 'number' && e.scale !== 1) e.preventDefault(); }, { passive: false });

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }
    function showCheckEmailUI(email) {
      const card = document.querySelector('#loginModal .login-modal');
      if (!card) return;
      card.innerHTML = `
        <button class="icon-circle icon-close" type="button" onclick="closeLoginModal()" aria-label="Close"></button>
        <h2 style="margin:8px 0 10px;text-align:center;">Check your email</h2>
        <p style="font-size:14px;opacity:0.8;margin:0 0 12px;line-height:1.45;text-align:center;">
          We sent a login link to <strong>${escapeHtml(email)}</strong>.
        </p>`;
      document.getElementById('loginModal').classList.add('show');
    }

    (function () {
      const emailInput = document.getElementById('loginEmail');
      const loginBtn   = document.getElementById('loginSubmit');
      if (!emailInput || !loginBtn) return;
      loginBtn.addEventListener('click', async e => {
        e.preventDefault();
        const email = (emailInput.value || '').trim();
        if (!email) return alert('Enter your email');
        if (!window.supa?.auth) return alert('Auth not initialized');
        loginBtn.disabled = true; const old = loginBtn.textContent; loginBtn.textContent = 'Sending…';
        const { error } = await supa.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.origin } });
        loginBtn.disabled = false; loginBtn.textContent = old;
        if (error) alert(error.message); else showCheckEmailUI(email);
      });
    })();

    function updateMediaSessionMetadata() {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Infinity', artist: 'Sloucho', album: 'Discography',
        artwork: [
          { src: location.origin + '/assets/slouchometa.png', sizes: '96x96',  type: 'image/png' },
          { src: location.origin + '/assets/slouchometa.png', sizes: '512x512', type: 'image/png' }
        ]
      });
    }

    // ===== AUDIO — single looping track =====
    (function () {
      const audioEl = document.getElementById('mysteryGiftAudio');
      const btn     = document.getElementById('audioMuteBtn');
      if (!audioEl || !btn) return;

      audioEl.src  = '/assets/music/Sloucho_Infinity.mp3';
      audioEl.loop = true;
      audioEl.load();

      audioEl.muted = true;
      btn.classList.add('is-muted');
      btn.setAttribute('aria-label', 'Unmute audio');

      let started = false;
      async function tryPlay() {
        if (started || !audioEl.paused) { started = true; return; }
        try { await audioEl.play(); started = true; removeUnlockers(); } catch (_) {}
      }
      function addUnlockers() {
        ['pointerdown','mousedown','touchstart','keydown','wheel'].forEach(ev =>
          window.addEventListener(ev, tryPlay, { capture: true, once: true }));
      }
      function removeUnlockers() {
        ['pointerdown','mousedown','touchstart','keydown','wheel'].forEach(ev =>
          window.removeEventListener(ev, tryPlay, { capture: true }));
      }

      audioEl.addEventListener('canplay', tryPlay);
      window.addEventListener('load', tryPlay, { once: true });
      tryPlay();
      addUnlockers();

      audioEl.addEventListener('play',  () => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; updateMediaSessionMetadata(); });
      audioEl.addEventListener('pause', () => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; });
      document.addEventListener('visibilitychange', () => { if (!document.hidden && audioEl.paused && started) audioEl.play().catch(() => {}); });

      btn.addEventListener('click', async () => {
        const willMute = !audioEl.muted; audioEl.muted = willMute;
        btn.classList.toggle('is-muted', willMute);
        btn.setAttribute('aria-label', willMute ? 'Unmute audio' : 'Mute audio');
        if (!willMute) { try { await audioEl.play(); } catch (_) {} }
      });
    })();
  </script>
</body>
</html>
