  <!-- Process magic-link hash if present -->
  <script>
    (async () => {
      try {
        const hash = window.location.hash || "";
        if (!window.supa || !hash.includes("access_token")) return;

        const params = new URLSearchParams(hash.slice(1));
        const access_token = params.get("access_token");
        const refresh_token = params.get("refresh_token");
        const error = params.get("error");
        const error_description = params.get("error_description");

        if (error) {
          alert(`Authentication error: ${error_description || error}`);
          const cleanErrUrl = new URL(window.location.href);
          cleanErrUrl.hash = "";
          history.replaceState({}, "", cleanErrUrl.toString());
          return;
        }

        if (access_token && refresh_token) {
          const { error: sessionError } = await window.supa.auth.setSession({ access_token, refresh_token });
          if (sessionError) alert(`Session error: ${sessionError.message}`);
        }

        const cleanUrl = new URL(window.location.href);
        cleanUrl.hash = "";
        window.location.replace(cleanUrl.toString());
      } catch (e) {
        console.error("[supabase] login link processing failed:", e);
      }
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'PPMori', Arial, sans-serif;

    @font-face {

    /* Top Navigation */
    .top-nav {

    .menu-button,
    .login-button {
      width: 30px; height: 30px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .2s ease, background .2s ease;
    }
    .menu-button:hover, .login-button:hover { border-color: rgba(255, 255, 255, 0.45); }

    .menu-dots { display: flex; gap: 4px; }
    .dot { width: 3px; height: 3px; background: #fff; border-radius: 50%; }

    .user-icon { width: 16px; height: 16px; color: #fff; }
    .user-icon svg { width: 100%; height: 100%; fill: currentColor; }

    /* Menu tray */
    .menu-tray {
      position: fixed;
      top: 60px;
      left: 20px;
      width: 130px;
      background: rgba(0, 0, 0, 1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      z-index: 200;
      transform: translateY(-20px);
      opacity: 0;
      visibility: hidden;
      transition: all .3s ease;
      padding: 10px 0;
    }
    .menu-tray.open { transform: translateY(0); opacity: 1; visibility: visible; }

    .menu-item {
      position: relative;
      display: block;
      width: 100%;
      padding: 6px 15px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 300;
      cursor: pointer;
      background: none;

    .menu-item::before {

      left: 8px; right: 8px;
      border-radius: 8px;

    /* Shop layout */

      border: 1px solid var(--tile-border);
      background: var(--tile-bg);
      box-shadow: var(--tile-shadow);
      text-decoration: none;
      color: #fff;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
      cursor: pointer;
    }
    .product-tile:hover {
      background: var(--tile-bg-hover);
      border-color: rgba(255,255,255,0.18);
      transform: translateY(-1px);
    }

    .mv-wrap {

    }

    input, textarea, select { font-size: 16px; }
    button, a, .menu-button, .login-button { touch-action: manipulation; }
  </style>
</head>

<body>

  <!-- Account Modal -->
  <div class="modal-overlay" id="loginModal" role="dialog" aria-modal="true" aria-label="Account">

      <!-- Logged-in view -->

        <button
          type="button"

  <script>
    // ============================================================
    // EDIT THESE FOUR VALUES:
    // ============================================================
    const CARD_PRODUCT_URL = "https://shop.ouch.world/products/broken-spirit-nfc-card";
    const TSHIRT_PRODUCT_URL = "https://shop.ouch.world/products/broken-spirit-t-shirt";

    // Use your real GLB paths (match your portal’s working card.glb path)
    const CARD_GLB_SRC = "/assets/models/card.glb";
    const TSHIRT_GLB_SRC = "/assets/models/cover.glb";

    // Apply values to DOM (keeps HTML readable)
    (function applyProductConfig() {
      const tiles = document.querySelectorAll(".product-tile");
      tiles.forEach(tile => {
        const isCard = (tile.getAttribute("aria-label") || "").toLowerCase().includes("nfc");
        const url = isCard ? CARD_PRODUCT_URL : TSHIRT_PRODUCT_URL;
        tile.href = url;
        tile.dataset.productUrl = url;

        const mv = tile.querySelector("model-viewer");
        if (mv) mv.src = isCard ? CARD_GLB_SRC : TSHIRT_GLB_SRC;
      });
    })();

    // ============================================================
    // Click-to-navigate with drag guard:
    // - If the user drags to rotate, do NOT navigate.
    // - If it’s a simple click/tap, navigate.
    // ============================================================
    (function enableTileClickGuard() {
      const DRAG_THRESHOLD_PX = 6;

      document.querySelectorAll(".product-tile").forEach(tile => {
        let downX = 0, downY = 0, moved = false;

        tile.addEventListener("pointerdown", (e) => {
          downX = e.clientX;
          downY = e.clientY;
          moved = false;
        }, { passive: true });

        tile.addEventListener("pointermove", (e) => {
          const dx = Math.abs(e.clientX - downX);
          const dy = Math.abs(e.clientY - downY);
          if (dx > DRAG_THRESHOLD_PX || dy > DRAG_THRESHOLD_PX) moved = true;
        }, { passive: true });

        tile.addEventListener("click", (e) => {
          if (moved) {
            // user was rotating the model: suppress navigation
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          // normal click: allow navigation (default anchor behavior)
        }, true);
      });
    })();

    // ===== UI bits =====
    function toggleMenu() {
      document.getElementById('menuTray')?.classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
      const tray = document.getElementById('menuTray');
      const btn  = document.querySelector('.menu-button');
      if (!tray || !btn) return;
      if (!tray.contains(e.target) && !btn.contains(e.target)) tray.classList.remove('open');
    });

    function closeLoginModal() {
      document.getElementById('loginModal')?.classList.remove('show');
    }

    document.getElementById('loginModal')?.addEventListener('click', function(e) {
      if (e.target === this) closeLoginModal();
    });

    async function syncAccountButton() {
      const btn = document.querySelector('.login-button');
      if (!btn || !window.supa) return;
      const { data: { user } } = await window.supa.auth.getUser();
      if (user) {
        btn.setAttribute('aria-label', `Account (${user.email})`);
        btn.title = user.email;
      } else {
        btn.setAttribute('aria-label', 'Login');
        btn.title = 'Login';
      }
    }

    async function handleLogin() {
      const modal = document.getElementById('loginModal');
      if (!modal || !window.supa) return;

      const loggedInView = document.getElementById('accountLoggedIn');
      const loginForm    = document.getElementById('loginForm');
      const emailEl      = document.getElementById('accountEmail');

      const { data: { user } } = await window.supa.auth.getUser();

      if (user) {
        if (emailEl) emailEl.textContent = user.email || '';
        if (loggedInView) loggedInView.style.display = 'block';
        if (loginForm) loginForm.style.display = 'none';
      } else {
        if (loggedInView) loggedInView.style.display = 'none';
        if (loginForm) loginForm.style.display = 'block';
      }

      modal.classList.add('show');
    }

    async function logout() {
      try {
        if (!window.supa) return;
        await window.supa.auth.signOut();
        closeLoginModal();
        await syncAccountButton();
      } catch (e) {
        console.error('[auth] signOut failed', e);
      }
    }

    document.getElementById('logoutBtn')?.addEventListener('click', logout);

    // Login form handler (magic link back to /shop/)
    (function () {
      const emailInput = document.getElementById('loginEmail');
      const loginBtn   = document.getElementById('loginSubmit');
      const errorEl    = document.getElementById('loginError');

      if (!emailInput || !loginBtn) return;

      loginBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (errorEl) errorEl.textContent = "";

        const email = (emailInput.value || '').trim();
        if (!email) {
          if (errorEl) errorEl.textContent = "Enter your email.";
          return;
        }
        if (!window.supa?.auth) {
          if (errorEl) errorEl.textContent = "Auth not initialized.";
          return;
        }

        loginBtn.disabled = true;
        const old = loginBtn.textContent;
        loginBtn.textContent = 'Sending…';

        const { error } = await window.supa.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: `${location.origin}/shop/` }
        });

        loginBtn.disabled = false;
        loginBtn.textContent = old;

        if (error) {
          if (errorEl) errorEl.textContent = error.message;
        } else {
          if (errorEl) errorEl.style.color = "rgba(255,255,255,0.75)";
          if (errorEl) errorEl.textContent = "Check your email for the login link.";
        }
      });
    })();

    document.addEventListener("DOMContentLoaded", async () => {
      await syncAccountButton();
      if (window.supa?.auth?.onAuthStateChange) {
        window.supa.auth.onAuthStateChange(() => syncAccountButton());
      }
    });

    // ===== Mobile zoom suppression (kept, minimal) =====
    (function () {
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
    document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });
    document.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
  </script>
</body>
